<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>tg05 layout en scan animatie test</title>
  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;

      /* Divider ratios, exact zoals tg05 */
      --cols-left: 58fr;
      --cols-right: 42fr;
      --rows-top: 54fr;
      --rows-bottom: 46fr;

      /* Marbotic scanplek */
      --scanplek-left: 80.5%;
      --scanplek-top: 87%;
      --scanplek-scale: 0.36;

      /* Instelbare tutorial waarden */
      --tut-scale: 1;
      --tut-x: 0; /* px */
      --tut-y: 0; /* px */
      --tut-anchor-dx: 0; /* px, offset van beeld middelpunt naar anker */
      --tut-anchor-dy: 0; /* px, offset van beeld middelpunt naar anker */
    }

    *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select:none;
      user-select:none;
      touch-action: manipulation;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: var(--cols-left) var(--cols-right);
      height:100%;
    }

    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: var(--rows-top) var(--rows-bottom);
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 16px;
      position:relative;
      overflow:hidden;
      min-height:0;
    }

    .left h1{
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.2px;
      color: #4f4a47;
    }
    .left p{
      margin: 0;
      line-height: 1.35;
      max-width: 42ch;
      color: #6b6663;
      font-size: 14px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.55);
      border: 2px solid rgba(245,180,152,0.55);
      width: fit-content;
      font-size: 13px;
      color: #5f5b58;
    }

    .scan-surface{
      background:#ffffff;
      position:relative;
      overflow:hidden;
      min-height:0;
      transition: background 120ms ease;
    }

    @media (orientation: landscape){
      .scan-surface{ border-left: 2px solid rgba(245,180,152,0.50); }
    }
    @media (orientation: portrait){
      .scan-surface{ border-top: 2px solid rgba(245,180,152,0.50); }
      .left{ padding: 22px; }
    }

    /* Scan overlay en scanplek */
    .scanOverlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px;
      pointer-events:none;
      z-index: 2;
    }

    #scanPlaceImg{
      position:absolute;
      left: var(--scanplek-left, 50%);
      top: var(--scanplek-top, 50%);
      transform: translate(-50%, -50%) scale(var(--scanplek-scale, 1));
      width: min(720px, 86%);
      height:auto;
      object-fit: contain;
      pointer-events:none;
      z-index: 1;
      opacity: 1;
      transition: opacity 240ms ease;
    }

    /* Optioneel veil */
    .scanVeil{
      position:absolute;
      inset:0;
      background: rgba(255,255,255,0.0);
      opacity: 0;
    }

    /* Tutorial Marbotic animatie, dit is het stuk dat jij wilt schalen en positioneren */
    .tutMarboticWrap{
      position:absolute;
      left: var(--scanplek-left, 50%);
      top: var(--scanplek-top, 50%);
      transform:
        translate(-50%, -50%)
        translate(calc(var(--tut-x) * 1px), calc(var(--tut-y) * 1px));
      opacity: 0;
      transition: transform 560ms cubic-bezier(.22,.61,.35,1), opacity 180ms ease, filter 220ms ease;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,0.18));
      pointer-events:none;
      z-index: 25;
      will-change: transform, opacity;
    }
    .tutMarboticWrap.show{ opacity: 1; }
    .tutMarboticWrap.pressed{ filter: drop-shadow(0 6px 12px rgba(0,0,0,0.10)); }

    .tutMarboticWrap.pick{ pointer-events:auto; }
    .tutMarboticWrap.pick .tutMarboticImg{ pointer-events:auto; }

    .tutMarboticScaler{
      transform: scale(var(--tut-scale));
      transform-origin: 50% 50%;
      transition: transform 560ms cubic-bezier(.22,.61,.35,1);
      will-change: transform;
    }

    .tutMarboticShift{
      transform: translate(calc(var(--tut-anchor-dx) * -1px), calc(var(--tut-anchor-dy) * -1px));
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .tutMarboticImg{
      width: min(72%, 340px);
      height:auto;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }
    @media (orientation: landscape){
      .tutMarboticImg{ width: min(68%, 300px); }
    }

    /* Controls overlay, links in landscape, boven in portrait */
    .controls{
      position:fixed;
      z-index: 3000;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(245,180,152,0.55);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.10);
      padding: 12px;
      gap: 10px;
      display:flex;
      align-items:flex-end;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      max-width: calc(100vw - 24px);
    }
    .ctrl{
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-width: 170px;
    }
    .ctrl label{
      font-size: 12px;
      color:#5f5b58;
      display:flex;
      justify-content:space-between;
      gap: 10px;
    }
    .ctrl input[type="range"]{
      width: 100%;
    }
    .btnRow{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }
    .checkLine{
      display:flex;
      align-items:center;
      gap: 10px;
      font-size: 12px;
      color:#5f5b58;
      user-select:none;
    }
    .checkLine input{ width: 18px; height: 18px; }

    .miniRow{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hint{
      position: fixed;
      z-index: 4000;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(255,255,255,0.94);
      border: 2px solid rgba(245,180,152,0.55);
      border-radius: 18px;
      padding: 10px 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.10);
      font-weight: 700;
      color:#7a5145;
    }
    button{
      appearance:none;
      border: 0;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      background: #e58c74;
      color: #ffffff;
      cursor:pointer;
    }
    button.secondary{
      background: rgba(229,140,116,0.18);
      color:#7a5145;
      border: 2px solid rgba(229,140,116,0.45);
      font-weight: 700;
    }

    @media (orientation: landscape){
      .controls{
        top: calc(12px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        transform: none;
        flex-direction: column;
        align-items: stretch;
        width: min(260px, calc(58vw - 24px));
      }
      .ctrl{ min-width: 0; }
      .btnRow{ justify-content: space-between; }
    }
    @media (orientation: portrait){
      .controls{
        top: calc(12px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        flex-direction: row;
        align-items: flex-end;
        width: calc(100vw - 24px);
      }
    }

    /* kleine crosshair op de scanplek, helpt bij afstellen, geen layout invloed */
    .targetDot{
      position:absolute;
      left: var(--scanplek-left, 50%);
      top: var(--scanplek-top, 50%);
      width: 16px;
      height: 16px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: rgba(229,140,116,0.25);
      border: 2px solid rgba(229,140,116,0.55);
      z-index: 3;
      pointer-events:none;
    }
  </style>
</head>

<body>
  <section class="left" aria-label="Layout">
    <h1>layout test</h1>
    <p>Hier staat alleen de layout en de voorbeeldanimatie met de hand en de 4. Met de sliders kun je schaal en positie afstellen zonder dat het spel ertussen zit.</p>
    <div class="badge">Landscape, sliders links, Portrait, sliders boven</div>
  </section>

  <section class="scan-surface scanAllowed" id="scan-area" aria-label="Scanvak">
    <div class="targetDot" aria-hidden="true"></div>

    <div class="tutMarboticWrap" id="tutMarboticWrap" aria-hidden="true">
      <div class="tutMarboticScaler" id="tutMarboticScaler" aria-hidden="true">
        <div class="tutMarboticShift" id="tutMarboticShift" aria-hidden="true">
          <img class="tutMarboticImg" id="tutMarboticImg" src="marboticvoorbeelda.png" alt="" draggable="false" />
        </div>
      </div>
    </div>

    <div class="scanOverlay">
      <img id="scanPlaceImg" src="marbotic_scanplek.png" alt="" draggable="false" aria-hidden="true" />
      <div class="scanVeil" id="scanVeil" aria-hidden="true"></div>
    </div>
  </section>

  <div class="hint" id="hint" hidden>tik op het midden van de 4</div>

  <div class="controls" id="controls" aria-label="Afstellen">
    <div class="ctrl">
      <label for="scaleRange"><span>schaal</span><span id="scaleVal">1.00</span></label>
      <input id="scaleRange" type="range" min="0.25" max="25.00" step="0.01" value="1.00" />
    </div>
    <div class="ctrl">
      <label for="xRange"><span>x</span><span id="xVal">0px</span></label>
      <input id="xRange" type="range" min="-700" max="700" step="1" value="0" />
    </div>
    <div class="ctrl">
      <label for="yRange"><span>y</span><span id="yVal">0px</span></label>
      <input id="yRange" type="range" min="-700" max="700" step="1" value="0" />
    </div>

    <div class="ctrl">
      <label><span>anker</span><span id="anchorVal">geen</span></label>
      <label class="checkLine"><input id="anchorMode" type="checkbox" /> x en y op midden van 4</label>
      <div class="miniRow">
        <button id="pickAnchorBtn" class="secondary" type="button">kies midden</button>
        <button id="resetAnchorBtn" class="secondary" type="button">reset anker</button>
      </div>
    </div>

    <div class="btnRow">
      <button id="playBtn" type="button">speel voorbeeld</button>
      <button id="resetBtn" class="secondary" type="button">reset</button>
    </div>
  </div>

  <script>
    const wrap = document.getElementById("tutMarboticWrap");
    const scaler = document.getElementById("tutMarboticScaler");
    const shift = document.getElementById("tutMarboticShift");
    const img = document.getElementById("tutMarboticImg");

    const scaleRange = document.getElementById("scaleRange");
    const xRange = document.getElementById("xRange");
    const yRange = document.getElementById("yRange");

    const scaleVal = document.getElementById("scaleVal");
    const xVal = document.getElementById("xVal");
    const yVal = document.getElementById("yVal");

    const playBtn = document.getElementById("playBtn");
    const resetBtn = document.getElementById("resetBtn");
const hint = document.getElementById("hint");
const anchorMode = document.getElementById("anchorMode");
const pickAnchorBtn = document.getElementById("pickAnchorBtn");
const resetAnchorBtn = document.getElementById("resetAnchorBtn");
const anchorVal = document.getElementById("anchorVal");

    const STORE_PREFIX = "tg05_tut_v4_";



    function getOriKey(){
      try{
        if (window.matchMedia && window.matchMedia("(orientation: landscape)").matches) return "landscape";
      }catch(e){}
      return (window.innerWidth > window.innerHeight) ? "landscape" : "portrait";
    }

    const oriDefaults = {
      landscape: { scale: 5.58, x: 79, y: -222 },
      portrait: { scale: 3.33, x: -87, y: -125 }
    };

    let oriKey = getOriKey();

    function setSliders(v){
      if (!v) return;
      if (typeof v.scale === "number") scaleRange.value = v.scale.toFixed(2);
      if (typeof v.x === "number") xRange.value = String(Math.round(v.x));
      if (typeof v.y === "number") yRange.value = String(Math.round(v.y));
    }

    function loadVarsForOri(key){
      const storeKey = STORE_PREFIX + "vars_" + key;
      let v = null;
      try{
        const raw = localStorage.getItem(storeKey);
        if (raw) v = JSON.parse(raw);
      }catch(e){}
      if (!v) v = oriDefaults[key] || oriDefaults.portrait;
      setSliders(v);
      applyVars();
    }

    function saveVarsForOri(){
      const key = getOriKey();
      const storeKey = STORE_PREFIX + "vars_" + key;
      const v = {
        scale: parseFloat(scaleRange.value) || 1,
        x: parseFloat(xRange.value) || 0,
        y: parseFloat(yRange.value) || 0
      };
      try{ localStorage.setItem(storeKey, JSON.stringify(v)); }catch(e){}
    }

    function setDefaultsForCurrentOri(){
      const key = getOriKey();
      setSliders(oriDefaults[key] || oriDefaults.portrait);
      applyVars();
      saveVarsForOri();
    }

const clamp01 = (v) => Math.max(0, Math.min(1, v));

let anchorFx = parseFloat(localStorage.getItem("tg05_tut_v4_anchorFx"));
let anchorFy = parseFloat(localStorage.getItem("tg05_tut_v4_anchorFy"));
if (Number.isNaN(anchorFx) || Number.isNaN(anchorFy)) {
  anchorFx = null;
  anchorFy = null;
}

let picking = false;


    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function applyVars(){
      const s = parseFloat(scaleRange.value);
      const x = parseFloat(xRange.value);
      const y = parseFloat(yRange.value);

      document.documentElement.style.setProperty("--tut-scale", s);
      document.documentElement.style.setProperty("--tut-x", x);
      document.documentElement.style.setProperty("--tut-y", y);

      scaleVal.textContent = s.toFixed(2);
      xVal.textContent = Math.round(x) + "px";
      yVal.textContent = Math.round(y) + "px";

      updateAnchorVars();
    }


function updateAnchorVars(){
  if (!anchorMode) return;

  const enabled = !!anchorMode.checked;
  const s = Math.max(0.01, parseFloat(scaleRange.value));
  const rect = img.getBoundingClientRect();
  const canMeasure = rect.width > 10 && rect.height > 10;

  if (enabled && anchorFx != null && anchorFy != null && canMeasure){
    const baseW = rect.width / s;
    const baseH = rect.height / s;
    const dx = (anchorFx - 0.5) * baseW;
    const dy = (anchorFy - 0.5) * baseH;

    document.documentElement.style.setProperty("--tut-anchor-dx", dx);
    document.documentElement.style.setProperty("--tut-anchor-dy", dy);

    if (anchorVal) anchorVal.textContent = Math.round(anchorFx * 100) + "%," + Math.round(anchorFy * 100) + "%";
  } else {
    document.documentElement.style.setProperty("--tut-anchor-dx", 0);
    document.documentElement.style.setProperty("--tut-anchor-dy", 0);

    if (anchorVal) anchorVal.textContent = (anchorFx != null && anchorFy != null) ? "opgeslagen" : "geen";
  }
}

    scaleRange.addEventListener("input", () => { applyVars(); saveVarsForOri(); }, { passive:true });
    xRange.addEventListener("input", () => { applyVars(); saveVarsForOri(); }, { passive:true });
    yRange.addEventListener("input", () => { applyVars(); saveVarsForOri(); }, { passive:true });
    loadVarsForOri(oriKey);

if (anchorMode){
  anchorMode.addEventListener("change", () => {
    updateAnchorVars();
  }, { passive:true });
}

if (pickAnchorBtn){
  pickAnchorBtn.addEventListener("click", async () => {
    picking = true;
    if (hint) hint.hidden = false;
    if (anchorMode) anchorMode.checked = true;

    img.src = marC;
    showWrap();
    wrap.classList.add("pick");

    // wacht een tik zodat de browser het beeld kan tekenen
    await sleep(40);
    updateAnchorVars();
  });
}

if (resetAnchorBtn){
  resetAnchorBtn.addEventListener("click", () => {
    localStorage.removeItem("tg05_tut_v4_anchorFx");
    localStorage.removeItem("tg05_tut_v4_anchorFy");
    anchorFx = null;
    anchorFy = null;
    picking = false;
    wrap.classList.remove("pick");
    if (hint) hint.hidden = true;
    if (anchorMode) anchorMode.checked = false;
    updateAnchorVars();
  });
}

img.addEventListener("pointerdown", (e) => {
  if (!picking) return;
  e.preventDefault();

  const rect = img.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) return;

  anchorFx = clamp01((e.clientX - rect.left) / rect.width);
  anchorFy = clamp01((e.clientY - rect.top) / rect.height);

  localStorage.setItem("tg05_tut_v4_anchorFx", String(anchorFx));
  localStorage.setItem("tg05_tut_v4_anchorFy", String(anchorFy));

  picking = false;
  wrap.classList.remove("pick");
  if (hint) hint.hidden = true;

  updateAnchorVars();
  applyVars();
});

async function loadImage(src){
      return new Promise((resolve) => {
        const test = new Image();
        const done = (ok) => resolve(ok ? src : null);
        test.onload = () => done(true);
        test.onerror = () => done(false);
        test.src = src;
        setTimeout(() => done(false), 600);
      });
    }

    async function pickExisting(cands){
      for (const src of cands){
        const ok = await loadImage(src);
        if (ok) return src;
      }
      return cands[0];
    }

    let marA = "marboticvoorbeelda.png";
    let marB = "marboticvoorbeeldb.png";
    let marC = "marboticvoorbeeldc.png";

    (async () => {
      marA = await pickExisting(["marboticvoorbeelda.png","marbotic_voorbeeld/marboticvoorbeelda.png"]);
      marB = await pickExisting(["marboticvoorbeeldb.png","marbotic_voorbeeld/marboticvoorbeeldb.png"]);
      marC = await pickExisting(["marboticvoorbeeldc.png","marbotic_voorbeeld/marboticvoorbeeldc.png"]);
      img.src = marA;
    })();

    function showWrap(){
      wrap.classList.add("show");
      wrap.setAttribute("aria-hidden", "false");
    }
    function hideWrap(){
      wrap.classList.remove("show","pressed");
      wrap.setAttribute("aria-hidden", "true");
    }

    function setTargetVars(){
      applyVars();
    }

    async function playExample(){
      playBtn.disabled = true;

      // Start positie, net buiten beeld, eindigt op jouw slider waarde
      const targetX = parseFloat(xRange.value);
      const targetY = parseFloat(yRange.value);
      const targetS = parseFloat(scaleRange.value);

      img.src = marA;
      showWrap();

      // zet start
      document.documentElement.style.setProperty("--tut-scale", targetS);
      document.documentElement.style.setProperty("--tut-x", targetX - 420);
      document.documentElement.style.setProperty("--tut-y", targetY - 260);

      // force reflow zodat de transition pakt
      wrap.getBoundingClientRect();

      // move naar target
      document.documentElement.style.setProperty("--tut-x", targetX);
      document.documentElement.style.setProperty("--tut-y", targetY);

      await sleep(650);
      img.src = marB;

      await sleep(650);
      img.src = marC;
      wrap.classList.add("pressed");

      await sleep(650);
      hideWrap();

      // terug naar slider state
      setTargetVars();
      playBtn.disabled = false;
    }

    playBtn.addEventListener("click", playExample);
    resetBtn.addEventListener("click", () => {
      setDefaultsForCurrentOri();
    });

    // Als je draait, wil je dat de waarden blijven gelden
    window.addEventListener("resize", () => {
      const k = getOriKey();
      if (k !== oriKey){
        oriKey = k;
        loadVarsForOri(oriKey);
        return;
      }
      applyVars();
    }, { passive:true });
  </script>
</body>
</html>
