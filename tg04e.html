
<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;
      --midLine: rgba(245,180,152,0.85);
      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);
      --pressDown: 2px;
      --wrongFill: rgba(248, 197, 197, 0.85);
      --wrongBorder: rgba(229, 140, 116, 0.45);
      --correctFill: rgba(210, 244, 214, 0.92);
      --correctBorder: rgba(144, 204, 152, 0.70);
      --activeFill: rgba(229, 140, 116, 0.18);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }
    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 22px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }

    .scan-surface{
      background:#ffffff;
      position: relative;
      overflow:hidden;
      min-height: 0;
      transition: background 140ms ease;
    }

    @media (orientation: landscape){
      .scan-surface{ border-left: 6px dashed var(--midLine); }
    }
    @media (orientation: portrait){
      .scan-surface{ border-top: 6px dashed var(--midLine); }
      .left{ padding: 22px; gap: 16px; }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      transition: transform 140ms cubic-bezier(.22,.61,.35,1);
    }
    .homeBtn:active,
    .tuneBtn:active{ transform: translateY(1px) scale(0.99); }

    .homeBtn svg{ width: 42px; height: 42px; display:block; }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: 6px solid rgba(245,180,152,0.85);
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    @media (orientation: portrait){
      .gameCard{ height: min(420px, 34vh); }
    }

    .flashBoard{
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background:#ffffff;
      border: 2px solid rgba(245,180,152,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
      aspect-ratio: 520 / 380;
    }

    .flashSvg{
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .flashSvg svg{
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .scanStage{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 10;
    }

    .answersWrap{
      width: min(560px, 92%);
      max-width: 560px;
    }

    .answers{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      justify-items:center;
      align-items:center;
    }

    @media (orientation: portrait){
      .answers{
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .answersWrap{ width: min(640px, 92%); }
    }

    /* ANTWOORD KNOPPEN / KAARTEN */
    .ansBtn{
      appearance:none;
      border:none;
      background: transparent;
      cursor:pointer;
      padding: 0;
      aspect-ratio: 1 / 1;
      width: 100%;
      position: relative;
      perspective: 1000px; /* Nodig voor 3D effect */
    }

    @media (orientation: landscape){
      .answersWrap{ width: min(360px, 92%); }
      .ansBtn{ width: clamp(86px, 10.5vw, 120px); }
    }

    .cardWrap {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    /* De draai actie */
    .ansBtn.cardOpen .cardWrap {
      transform: rotateY(180deg);
    }

    .cardBack, .cardFront {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 3px solid rgba(245,180,152,0.85);
      box-shadow: 0 12px 24px rgba(0,0,0,0.10);
    }

    /* Kuikentje kant */
    .cardBack {
      background: #f8c3b0;
      background-image: url("vogeltje_achterkantkaart.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 2;
      transform: rotateY(0deg);
    }

    /* Stippen kant */
    .cardFront {
      background: #ffffff;
      transform: rotateY(180deg);
      z-index: 1;
    }

    /* Feedback Kleuren */
    .ansBtn.wrongHold .cardFront {
      background: var(--wrongFill);
      border-color: var(--wrongBorder);
    }
    .ansBtn.correctHold .cardFront {
      background: var(--correctFill);
      border-color: var(--correctBorder);
    }

    .ansBtn.pressBounce{ animation: pressBounce 280ms cubic-bezier(.22,.61,.35,1) 1; }
    @keyframes pressBounce{
      0%{ transform: scale(1); }
      42%{ transform: scale(0.96); }
      100%{ transform: scale(1); }
    }

    .answersHidden{ opacity:0; pointer-events:none; }

    /* OVERLAY & PANELS */
    .startOverlay{
      position:fixed;
      inset:0;
      background: rgba(253,238,234,0.55);
      backdrop-filter: blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      padding: 24px;
    }
    .startCard{
      width: min(740px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align:center;
    }
    .startCard h1{
      margin: 0 0 10px 0;
      font-size: 28px;
      color: #4d4a48;
      text-transform: lowercase;
    }
    .startCard p{
      margin: 0 0 14px 0;
      color: rgba(77,74,72,0.82);
      font-size: 18px;
      line-height: 1.35;
    }

    .startBtn{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 900;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      transition: transform 140ms cubic-bezier(.22,.61,.35,1);
    }
    .startBtn:active{ transform: translateY(1px) scale(0.99); }

    .tunePanel{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(620px, calc(100vw - 36px));
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.16);
      border: 2px solid rgba(245,180,152,0.75);
      padding: 14px 14px 12px 14px;
      z-index: 1200;
      color: #4d4a48;
    }
    .tunePanel.hidden{ display:none; }
    .tuneHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tuneTitle{
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.2px;
      text-transform: lowercase;
    }
    .tuneClose{
      appearance:none;
      border:none;
      background:#f8c3b0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }

    .tuneSection{
      margin-top: 8px;
      padding-top: 10px;
      border-top:2px solid rgba(245,180,152,0.45);
    }

    .tuneRow{
      display:grid;
      grid-template-columns: 170px 1fr 84px;
      gap: 10px;
      align-items:center;
      margin: 10px 0;
    }
    .tuneLabel{
      font-weight: 800;
      font-size: 13px;
      color: rgba(77,74,72,0.86);
      text-transform: lowercase;
    }
    .tuneValue{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 13px;
      text-align:right;
    }

    .tuneButtons{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tuneBtnSmall{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 900;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
    }
    .tuneBtnSmall.secondary{ background:#f8c3b0; color:#4d4a48; }
  </style>
</head>

<body>
  <section class="left" aria-label="Spel">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn" aria-label="Naar het menu" type="button">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10 28L32 10l22 18v26a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V28z" fill="rgba(255,255,255,.55)"/>
          <path d="M16 26.5L32 13.7l16 12.8v27.2H16V26.5z" fill="rgba(0,0,0,.10)"/>
          <path d="M26 54V38h12v16" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 30l20-16 20 16" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="tuneBtn" id="tuneBtn" aria-label="Instellen" type="button">⚙️</button>
      <div class="titlePill" id="titlePill">slim kijken</div>
    </div>

    <div class="content">
      <div class="gameCard" id="gameCard">
        <div class="flashBoard" id="flashBoard">
          <div class="flashSvg" id="flashSvg"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="scan-surface" id="scanArea">
    <div class="scanStage">
      <div class="answersWrap">
        <div class="answers answersHidden" id="answers"></div>
      </div>
    </div>
  </section>

  <div class="startOverlay" id="startOverlay">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Je start in level 1. Bij 5 goed ga je omhoog, bij 2 fout omlaag. Vanaf level 2 draaien de kaarten om.</p>
      <button class="startBtn" id="startBtn" type="button">Start</button>
    </div>
  </div>

  <div class="tunePanel hidden" id="tunePanel">
    <div class="tuneHeader">
      <div class="tuneTitle">instellingen</div>
      <button class="tuneClose" id="tuneClose">Sluit</button>
    </div>
    <div class="tuneSection">
      <div class="tuneTitle" style="font-size:16px;">huidig level: <span id="tuneLevelValue">1</span></div>
    </div>
    <div class="tuneSection">
      <div class="tuneRow">
        <div class="tuneLabel">flitstijd</div>
        <input type="range" id="flashMsRange" min="300" max="2400" step="50" value="300" />
        <div class="tuneValue" id="flashMsValue">300</div>
      </div>
    </div>
    <div class="tuneSection">
      <div class="tuneButtons">
        <button class="tuneBtnSmall secondary" id="newRoundBtn">Nieuwe ronde</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      const raf = () => new Promise(r => requestAnimationFrame(() => r()));

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");
      const titlePill = document.getElementById("titlePill");
      const tuneBtn = document.getElementById("tuneBtn");
      const tunePanel = document.getElementById("tunePanel");
      const tuneClose = document.getElementById("tuneClose");
      const flashMsRange = document.getElementById("flashMsRange");
      const flashMsValue = document.getElementById("flashMsValue");
      const tuneLevelValue = document.getElementById("tuneLevelValue");
      const flashSvg = document.getElementById("flashSvg");
      const answersEl = document.getElementById("answers");
      const scanArea = document.getElementById("scanArea");

      let flashMs = Number(flashMsRange.value);
      let LEVEL = 1;
      let streakGood = 0;
      let streakBad = 0;
      let started = false;
      let locked = false;
      let correct = 1;
      let previewToken = 0;

      function usesAnswerCards(){ return LEVEL >= 2; }

      function setLevel(n){
        LEVEL = clamp(n, 1, 5);
        titlePill.textContent = `slim kijken, level ${LEVEL}`;
        if(tuneLevelValue) tuneLevelValue.textContent = String(LEVEL);
      }

      function maxForLevel(){
        return (LEVEL <= 3) ? 4 : 6;
      }

      // Audio Beeps
      let audioCtx = null;
      function beep(type){
        try{
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          if(type === "ok") o.frequency.setValueAtTime(740, t);
          else if(type === "no") o.frequency.setValueAtTime(220, t);
          else o.frequency.setValueAtTime(520, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.1, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t); o.stop(t + 0.2);
        }catch(e){}
      }

      // DOT PATTERNS (Simplificatie voor demo)
      const P = { mc:[0.5,0.5], tl:[0.25,0.25], br:[0.75,0.75], tr:[0.75,0.25], bl:[0.25,0.75], ml:[0.25,0.5], mr:[0.75,0.5] };
      const diceFaces = { 1:[P.mc], 2:[P.tl, P.br], 3:[P.tl, P.mc, P.br], 4:[P.tl, P.tr, P.bl, P.br], 5:[P.tl, P.tr, P.mc, P.bl, P.br], 6:[P.tl, P.ml, P.bl, P.tr, P.mr, P.br] };

      function svgForDots(dots, opts = {}){
        const { dotRadius = 14 } = opts;
        const w = 520, h = 380;
        const circles = dots.map(([x,y]) => {
          const X = (0.12 + x*0.76) * w;
          const Y = (0.12 + y*0.76) * h;
          return `<circle cx="${X}" cy="${Y}" r="${dotRadius}" fill="rgba(25,25,25,.92)" />`;
        }).join("");
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%">${circles}</svg>`;
      }

      function renderAnswers(correctVal, onPick){
        const options = new Set([correctVal]);
        while(options.size < 3) options.add(clamp(correctVal + pick([-2,-1,1,2]), 1, maxForLevel()));
        const arr = [...options].sort(() => Math.random() - 0.5);

        answersEl.innerHTML = "";
        arr.forEach(v => {
          const btn = document.createElement("button");
          btn.className = "ansBtn";
          
          const svgContent = svgForDots(diceFaces[v], {dotRadius: 11});
          
          if(usesAnswerCards()){
            btn.innerHTML = `
              <div class="cardWrap">
                <div class="cardBack"></div>
                <div class="cardFront">${svgContent}</div>
              </div>
            `;
          } else {
            // Level 1: Geen kaart effect, direct stippen
            btn.innerHTML = `
              <div class="cardWrap" style="transform: rotateY(180deg);">
                <div class="cardFront" style="transform: rotateY(0deg);">${svgContent}</div>
              </div>
            `;
          }

          btn.addEventListener("click", () => onPick(btn, v));
          answersEl.appendChild(btn);
        });
      }

      async function previewCardsNonBlocking(){
        if(!usesAnswerCards()) return;
        const myToken = ++previewToken;
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        
        await wait(300);
        for(let b of btns) {
           if(previewToken !== myToken) return;
           b.classList.add("cardOpen");
           await wait(100);
        }

        await wait(1700); // Tijd dat de stippen zichtbaar zijn
        if(previewToken !== myToken) return;
        
        btns.forEach(b => b.classList.remove("cardOpen"));
      }

      async function nextRound(){
        locked = true;
        answersEl.classList.add("answersHidden");
        flashSvg.innerHTML = "";
        await wait(400);

        correct = pick([1,2,3,4,5,6].filter(n => n <= maxForLevel()));
        flashSvg.innerHTML = svgForDots(diceFaces[correct], {dotRadius: 16});
        
        await wait(flashMs);
        flashSvg.innerHTML = "";
        await wait(300);

        renderAnswers(correct, onPick);
        answersEl.classList.remove("answersHidden");
        
        locked = false;
        previewCardsNonBlocking();
      }

      async function onPick(btn, value){
        if(locked) return;
        locked = true;
        previewToken++; 

        // Zorg dat de kaart open staat bij klik
        btn.classList.add("cardOpen");

        if(value === correct){
          beep("ok");
          btn.classList.add("correctHold");
          streakGood++; streakBad = 0;
          if(streakGood >= 5) { setLevel(LEVEL+1); streakGood = 0; }
          await wait(1200);
        } else {
          beep("no");
          btn.classList.add("wrongHold");
          streakBad++; streakGood = 0;
          if(streakBad >= 2) { setLevel(LEVEL-1); streakBad = 0; }
          await wait(1200);
        }
        
        nextRound();
      }

      startBtn.addEventListener("click", () => {
        startOverlay.style.display = "none";
        started = true;
        setLevel(1);
        nextRound();
      });

      tuneBtn.addEventListener("click", () => tunePanel.classList.toggle("hidden"));
      tuneClose.addEventListener("click", () => tunePanel.classList.add("hidden"));
      flashMsRange.addEventListener("input", () => {
        flashMs = Number(flashMsRange.value);
        flashMsValue.textContent = flashMs;
      });
      document.getElementById("newRoundBtn").addEventListener("click", () => { if(started) nextRound(); });

    })();
  </script>
</body>
</html>
