<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;

      --midLine: rgba(245,180,152,0.85);

      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);

      --pressDown: 2px;

      --wrongFill: rgba(248, 197, 197, 0.85);
      --wrongBorder: rgba(229, 140, 116, 0.45);

      --correctFill: rgba(210, 244, 214, 0.92);
      --correctBorder: rgba(144, 204, 152, 0.70);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }
    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 22px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }

    .scan-surface{
      background:#ffffff;
      position: relative;
      overflow:hidden;
      min-height: 0;
      transition: background 140ms ease;
    }

    @media (orientation: landscape){
      .scan-surface{ border-left: 6px dashed var(--midLine); }
    }
    @media (orientation: portrait){
      .scan-surface{ border-top: 6px dashed var(--midLine); }
      .left{ padding: 22px; gap: 16px; }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      transition: transform 140ms cubic-bezier(.22,.61,.35,1);
    }
    .homeBtn:active,
    .tuneBtn:active{ transform: translateY(1px) scale(0.99); }

    .homeBtn svg{ width: 42px; height: 42px; display:block; }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: 6px solid rgba(245,180,152,0.85);
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    @media (orientation: portrait){
      .gameCard{ height: min(420px, 34vh); }
    }

    .flashBoard{
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background:#ffffff;
      border: 2px solid rgba(245,180,152,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }

    @media (orientation: portrait){
      .flashBoard{
        width: min(520px, 90%);
        height: auto;
        aspect-ratio: 1.5 / 1;
        transform: scale(0.90);
        transform-origin: center;
      }
    }

    .flashSvg{
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .scanStage{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 10;
    }

    .answersWrap{
      width: min(560px, 92%);
      max-width: 560px;
    }

    .answers{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      justify-items:center;
      align-items:center;
    }

    @media (orientation: portrait){
      .answers{
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .answersWrap{ width: min(640px, 92%); }
    }

    .ansBtn{
      appearance:none;
      border:none;
      background:#ffffff;
      border-radius: 22px;
      border: 3px solid rgba(245,180,152,0.85);
      box-shadow: 0 12px 24px rgba(0,0,0,0.10);
      cursor:pointer;

      display:grid;
      place-items:center;
      padding: 10px;

      aspect-ratio: 1 / 1;
      width: 100%;

      transition: transform 180ms cubic-bezier(.22,.61,.35,1), box-shadow 180ms cubic-bezier(.22,.61,.35,1), background 220ms cubic-bezier(.22,.61,.35,1), border-color 220ms cubic-bezier(.22,.61,.35,1);
      transform: translateZ(0);
      will-change: transform, opacity;
    }

    @media (orientation: landscape){
      .answersWrap{ width: min(360px, 92%); }
      .ansBtn{ width: clamp(86px, 10.5vw, 120px); }
    }

    .ansBtn:active{
      transform: translateY(var(--pressDown));
      box-shadow: 0 8px 16px rgba(0,0,0,0.10);
    }

    .ansBtn.pressBounce{ animation: pressBounce 280ms cubic-bezier(.22,.61,.35,1) 1; }
    @keyframes pressBounce{
      0%{ transform: translateY(0); }
      42%{ transform: translateY(var(--pressDown)); }
      100%{ transform: translateY(0); }
    }

    .ansBtn.wrongHold{
      background: var(--wrongFill);
      border-color: var(--wrongBorder);
    }

    .ansBtn.correctHold{
      background: var(--correctFill);
      border-color: var(--correctBorder);
    }

    .answersHidden{ opacity:0; pointer-events:none; }

    .startOverlay{
      position:fixed;
      inset:0;
      background: rgba(253,238,234,0.55);
      backdrop-filter: blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      padding: 24px;
    }
    .startCard{
      width: min(560px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align:center;
    }
    .startCard h1{
      margin: 0 0 10px 0;
      font-size: 28px;
      color: #4d4a48;
      text-transform: lowercase;
    }
    .startCard p{
      margin: 0 0 16px 0;
      color: rgba(77,74,72,0.82);
      font-size: 18px;
      line-height: 1.35;
    }
    .startBtn{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 800;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      transition: transform 140ms cubic-bezier(.22,.61,.35,1);
    }
    .startBtn:active{ transform: translateY(1px) scale(0.99); }

    /* Instellingenpaneel blijft bestaan, maar zonder sliders voor animatie timing */
    .tunePanel{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(560px, calc(100vw - 36px));
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.16);
      border: 2px solid rgba(245,180,152,0.75);
      padding: 14px 14px 12px 14px;
      z-index: 1200;
      color: #4d4a48;
    }
    .tunePanel.hidden{ display:none; }
    .tuneHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tuneTitle{
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.2px;
      text-transform: lowercase;
    }
    .tuneClose{
      appearance:none;
      border:none;
      background:#f8c3b0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }
    .tuneClose:active{ transform: translateY(1px) scale(0.99); }

    .tuneSection{
      margin-top: 8px;
      padding-top: 10px;
      border-top:2px solid rgba(245,180,152,0.45);
    }

    .tuneRow{
      display:grid;
      grid-template-columns: 170px 1fr 84px;
      gap: 10px;
      align-items:center;
      margin: 10px 0;
    }
    @media (max-width: 520px){
      .tuneRow{ grid-template-columns: 130px 1fr 70px; }
    }

    .tuneLabel{
      font-weight: 800;
      font-size: 13px;
      color: rgba(77,74,72,0.86);
      text-transform: lowercase;
    }
    .tuneValue{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 13px;
      text-align:right;
      color: rgba(77,74,72,0.86);
    }
    .tuneRow input[type="range"]{ width: 100%; }

    .tuneButtons{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tuneBtnSmall{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 900;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      font-size: 14px;
    }
    .tuneBtnSmall.secondary{
      background:#f8c3b0;
      color:#4d4a48;
    }
    .tuneBtnSmall:active{ transform: translateY(1px) scale(0.99); }
  </style>
</head>

<body>
  <section class="left" aria-label="Spel">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn" aria-label="Naar het menu" type="button">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10 28L32 10l22 18v26a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V28z" fill="rgba(255,255,255,.55)"/>
          <path d="M16 26.5L32 13.7l16 12.8v27.2H16V26.5z" fill="rgba(0,0,0,.10)"/>
          <path d="M26 54V38h12v16" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 30l20-16 20 16" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="tuneBtn" id="tuneBtn" aria-label="Instellen" type="button">⚙️</button>
      <div class="titlePill">slim kijken</div>
    </div>

    <div class="content">
      <div class="gameCard" id="gameCard" aria-label="Vraagvak">
        <div class="flashBoard" id="flashBoard">
          <div class="flashSvg" id="flashSvg"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="scan-surface" id="scanArea" aria-label="Antwoordvak">
    <div class="scanStage">
      <div class="answersWrap" id="answersWrap">
        <div class="answers answersHidden" id="answers"></div>
      </div>
    </div>
  </section>

  <div class="startOverlay" id="startOverlay" role="dialog" aria-modal="true" aria-label="Start">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Je ziet stippen heel kort, daarna kies je wat je zag.</p>
      <button class="startBtn" id="startBtn" type="button">Start</button>
    </div>
  </div>

  <div class="tunePanel hidden" id="tunePanel" role="dialog" aria-modal="false" aria-label="Instellingen">
    <div class="tuneHeader">
      <div class="tuneTitle">instellingen</div>
      <button class="tuneClose" id="tuneClose" aria-label="Sluiten" type="button">Sluit</button>
    </div>

    <div class="tuneSection">
      <div class="tuneTitle" style="font-size:16px; margin-bottom:8px;">flits</div>

      <div class="tuneRow">
        <div class="tuneLabel">flitstijd</div>
        <input type="range" id="flashMsRange" min="350" max="1400" step="50" value="650" />
        <div class="tuneValue" id="flashMsValue">650</div>
      </div>
    </div>

    <div class="tuneSection" style="padding-top:12px;">
      <div class="tuneButtons">
        <button class="tuneBtnSmall secondary" id="newRoundBtn" type="button">Nieuwe ronde</button>
        <button class="tuneBtnSmall secondary" id="testWrongBtn" type="button">Test fout</button>
        <button class="tuneBtnSmall" id="testGoodBtn" type="button">Test goed</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      const raf = () => new Promise(r => requestAnimationFrame(() => r()));

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");

      const homeBtn = document.getElementById("homeBtn");
      const tuneBtn = document.getElementById("tuneBtn");
      const tunePanel = document.getElementById("tunePanel");
      const tuneClose = document.getElementById("tuneClose");

      const flashMsRange = document.getElementById("flashMsRange");
      const flashMsValue = document.getElementById("flashMsValue");

      const newRoundBtn = document.getElementById("newRoundBtn");
      const testWrongBtn = document.getElementById("testWrongBtn");
      const testGoodBtn = document.getElementById("testGoodBtn");

      const flashSvg = document.getElementById("flashSvg");
      const answersEl = document.getElementById("answers");
      const scanArea = document.getElementById("scanArea");

      /* Definitieve timing waarden (geen sliders meer) */
      const WAIT_BEFORE_IN_MS = 0;  // wachttijd vóór binnenkomst
      const IN_DUR_MS = 800;        // snelheid binnenschuiven
      const OUT_DUR_MS = 750;       // snelheid terugschuiven

      /* Flits blijft instelbaar (zoals je al had) */
      let flashMs = Number(flashMsRange.value);

      /* WebAudio beep */
      let audioCtx = null;
      function beep(type){
        try{
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          if(type === "ok") o.frequency.setValueAtTime(740, t);
          if(type === "no") o.frequency.setValueAtTime(220, t);
          if(type === "tap") o.frequency.setValueAtTime(520, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + (type==="ok"?0.12:0.18));
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t); o.stop(t + 0.22);
        }catch(e){}
      }

      /* Dots */
      const P = {
        tl:[0.25,0.25], tc:[0.50,0.25], tr:[0.75,0.25],
        ml:[0.25,0.50], mc:[0.50,0.50], mr:[0.75,0.50],
        bl:[0.25,0.75], bc:[0.50,0.75], br:[0.75,0.75]
      };
      const diceFaces = {
        1: [P.mc],
        2: [P.tl, P.br],
        3: [P.tl, P.mc, P.br],
        4: [P.tl, P.tr, P.bl, P.br],
        5: [P.tl, P.tr, P.mc, P.bl, P.br],
        6: [P.tl, P.ml, P.bl, P.tr, P.mr, P.br]
      };

      function patternLevel1(n){
        return [{
          dots: diceFaces[n],
          box: {x0:0.12, y0:0.12, x1:0.88, y1:0.88}
        }];
      }

      function svgForDots(dotSets, opts = {}){
        const { dotRadius = 14, dotColor = "rgba(25,25,25,.92)" } = opts;
        const w = 520, h = 380;

        const circles = [];
        dotSets.forEach(set => {
          const b = set.box;
          set.dots.forEach(([x,y]) => {
            const X = (b.x0 + x*(b.x1-b.x0)) * w;
            const Y = (b.y0 + y*(b.y1-b.y0)) * h;
            circles.push({X,Y});
          });
        });

        const cs = circles.map(c => `
          <circle cx="${c.X.toFixed(1)}" cy="${c.Y.toFixed(1)}" r="${dotRadius}" fill="${dotColor}" />
        `).join("");

        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" aria-hidden="true">${cs}</svg>`;
      }

      function setBoard(html){ flashSvg.innerHTML = html; }
      function clearBoard(){ setBoard(svgForDots([], {dotRadius: 1})); }

      function dissolveBoard(ms){
        flashSvg.style.transition = `opacity ${ms}ms ease`;
        flashSvg.style.opacity = "0";
        setTimeout(() => {
          clearBoard();
          flashSvg.style.transition = "";
          flashSvg.style.opacity = "1";
        }, ms + 40);
      }

      function buildOptions(correct){
        const cap = 6;
        const options = new Set([correct]);
        while(options.size < 3){
          const delta = [ -2, -1, 1, 2 ][randInt(0,3)];
          options.add(clamp(correct + delta, 1, cap));
        }
        const arr = [...options];
        for(let i=arr.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [arr[i],arr[j]] = [arr[j],arr[i]];
        }
        return arr;
      }

      function hideAnswers(){ answersEl.classList.add("answersHidden"); }
      function showAnswers(){ answersEl.classList.remove("answersHidden"); }

      function renderAnswers(correct, onPick){
        const arr = buildOptions(correct);
        answersEl.innerHTML = "";

        arr.forEach(v => {
          const btn = document.createElement("button");
          btn.className = "ansBtn";
          btn.type = "button";

          btn.addEventListener("pointerdown", () => {
            btn.classList.remove("pressBounce");
            void btn.offsetWidth;
            btn.classList.add("pressBounce");
          }, {passive:true});

          btn.addEventListener("click", () => onPick(btn, v));

          const svg = svgForDots(patternLevel1(v), {dotRadius: 12});
          btn.innerHTML = `<div style="width:100%; height:100%; display:grid; place-items:center;">${svg}</div>`;
          answersEl.appendChild(btn);
        });
      }

      function isPortrait(){
        return window.matchMedia && window.matchMedia("(orientation: portrait)").matches;
      }

      function slideVectorForButton(btn){
        const b = btn.getBoundingClientRect();
        const a = scanArea.getBoundingClientRect();
        const extra = 10;

        if(isPortrait()){
          const seamY = a.top;
          const dy = -((b.bottom - seamY) + extra);
          return { x: 0, y: dy };
        }else{
          const seamX = a.left;
          const dx = -((b.right - seamX) + extra);
          return { x: dx, y: 0 };
        }
      }

      function sortedButtonsForExit(btns){
        const rects = btns.map(b => ({ b, r: b.getBoundingClientRect() }));
        if(isPortrait()){
          rects.sort((u,v) => v.r.left - u.r.left);
        }else{
          rects.sort((u,v) => v.r.top - u.r.top);
        }
        return rects.map(x => x.b);
      }

      async function animateInButtons(){
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        if(!btns.length) return;

        hideAnswers();
        await raf(); await raf();

        btns.forEach(btn => {
          const v = slideVectorForButton(btn);
          btn.style.transform = `translate(${v.x}px, ${v.y}px)`;
          btn.style.opacity = "0";
        });

        showAnswers();
        await raf();

        const easing = "cubic-bezier(.22,.61,.35,1)";

        btns.forEach((btn, i) => {
          btn.animate(
            [
              { transform: btn.style.transform, opacity: 0 },
              { transform: "translate(0px, 0px)", opacity: 1 }
            ],
            { duration: IN_DUR_MS, easing, fill: "forwards", delay: i * 95 }
          );
        });

        await wait(IN_DUR_MS + 95*(btns.length-1) + 60);

        btns.forEach(btn => {
          btn.style.transform = "translate(0px, 0px)";
          btn.style.opacity = "1";
        });
      }

      async function animateOutButtons(btns, staggerMs){
        if(!btns.length) return;

        const easing = "cubic-bezier(.22,.61,.35,1)";

        btns.forEach((btn, i) => {
          const v = slideVectorForButton(btn);
          btn.animate(
            [
              { transform: "translate(0px, 0px)", opacity: 1 },
              { transform: `translate(${v.x}px, ${v.y}px)`, opacity: 0.02 }
            ],
            { duration: OUT_DUR_MS, easing, fill: "forwards", delay: i * (staggerMs ?? 140) }
          );
        });

        await wait(OUT_DUR_MS + (staggerMs ?? 140)*(btns.length-1) + 80);

        btns.forEach(btn => { btn.style.opacity = "0"; });
      }

      /* Game */
      let started = false;
      let locked = false;
      let correct = 1;

      async function flashAndAsk(){
        locked = true;

        hideAnswers();
        answersEl.innerHTML = "";
        clearBoard();

        await wait(160);

        setBoard(svgForDots(patternLevel1(correct), {dotRadius: 16}));
        await wait(flashMs);

        clearBoard();
        await wait(260);

        renderAnswers(correct, onPick);

        /* vaste wachttijd voordat de knoppen binnenschuiven */
        await wait(WAIT_BEFORE_IN_MS);

        await animateInButtons();

        locked = false;
      }

      function nextRound(){
        correct = randInt(1,6);
        flashAndAsk();
      }

      async function onPick(btn, value){
        if(!started || locked) return;
        locked = true;

        const all = [...answersEl.querySelectorAll(".ansBtn")];
        all.forEach(b => b.style.pointerEvents = "none");

        if(value === correct){
          beep("ok");
          btn.classList.add("correctHold");

          setBoard(svgForDots(patternLevel1(correct), {dotRadius: 16}));
          await wait(520);
          dissolveBoard(260);

          const exitOrder = sortedButtonsForExit(all);
          await animateOutButtons(exitOrder, 140);

          btn.classList.remove("correctHold");

          hideAnswers();
          all.forEach(b => b.style.pointerEvents = "");
          await wait(160);

          nextRound();
          return;
        }

        beep("no");

        const notChosen = all.filter(b => b !== btn);
        const chosen = btn;

        chosen.classList.add("wrongHold");
        await animateOutButtons(sortedButtonsForExit(notChosen), 120);

        setBoard(svgForDots(patternLevel1(correct), {dotRadius: 16}));
        await wait(1200);
        dissolveBoard(320);

        await wait(120);
        await animateOutButtons([chosen], 0);
        chosen.classList.remove("wrongHold");

        hideAnswers();

        await wait(240);

        all.forEach(b => b.style.pointerEvents = "");
        nextRound();
      }

      /* Settings UI (alleen flits) */
      function syncUI(){
        flashMsValue.textContent = String(flashMs);
      }

      function openTune(){ tunePanel.classList.remove("hidden"); syncUI(); }
      function closeTune(){ tunePanel.classList.add("hidden"); }

      tuneBtn.addEventListener("click", () => {
        beep("tap");
        if(tunePanel.classList.contains("hidden")) openTune();
        else closeTune();
      });
      tuneClose.addEventListener("click", () => { beep("tap"); closeTune(); });

      flashMsRange.addEventListener("input", () => {
        flashMs = Number(flashMsRange.value);
        syncUI();
      });

      newRoundBtn.addEventListener("click", () => { beep("tap"); if(started) nextRound(); });

      testWrongBtn.addEventListener("click", async () => {
        beep("tap");
        if(!started || locked) return;
        const wrong = correct === 6 ? 1 : correct + 1;
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        if(btns[0]) await onPick(btns[0], wrong);
      });

      testGoodBtn.addEventListener("click", async () => {
        beep("tap");
        if(!started || locked) return;
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        if(btns[0]) await onPick(btns[0], correct);
      });

      /* Start */
      function startGame(){
        if(started) return;
        started = true;
        startOverlay.style.display = "none";
        syncUI();
        nextRound();
      }

      startBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        beep("tap");
        startGame();
      });

      startOverlay.addEventListener("click", (e) => {
        if(e.target === startOverlay){
          beep("tap");
          startGame();
        }
      });

      homeBtn.addEventListener("click", () => {
        beep("tap");
        try{ window.location.href = "index.html"; }catch(e){}
      });

      /* Reflow guard */
      let reflowTimer = null;
      function onReflow(){
        if(!started) return;
        if(reflowTimer) clearTimeout(reflowTimer);
        reflowTimer = setTimeout(async () => {
          locked = true;
          hideAnswers();
          answersEl.innerHTML = "";
          clearBoard();
          await wait(120);
          renderAnswers(correct, onPick);
          await wait(WAIT_BEFORE_IN_MS);
          await animateInButtons();
          locked = false;
        }, 220);
      }
      window.addEventListener("resize", onReflow);
      window.addEventListener("orientationchange", onReflow);

      /* Init */
      clearBoard();
      syncUI();
    })();
  </script>
</body>
</html>
