<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Testomgeving, toverfee, cijfer, explosie mp4</title>

  <style>
    :root{
      /* jouw waarden */
      --fairy-left: 32.5%;
      --fairy-top: 51%;
      --digit-left: 68.5%;
      --digit-top: 58%;

      --fairy-size: 439px;
      --digit-size: 260px;

      --fade-duration: 1.45s;
      --digit-delay: 1.05s;

      --explosion-start-delay: 0s;
      --explosion-scale: 1.5;
      --explosion-fade-in: 0.55s;
      --explosion-offset-y: -22px;
      --explosion-hide-after: 5.05s;
      --explosion-fadeout: 200ms;

      --card-w: min(980px, 92vw);
      --card-h: min(520px, 56vh);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      height:100%;
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#faf7f5;
      color:#4d4a48;
      overflow:hidden;
    }

    .app{ height:100%; display:grid; grid-template-columns: 390px 1fr; }
    @media (max-width: 920px){
      .app{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }

    .panel{
      padding: 16px 14px;
      background:#ffffff;
      border-right: 1px solid rgba(0,0,0,0.06);
      overflow:auto;
    }
    .panel h1{ font-size: 16px; margin: 0 0 10px 0; }
    .hint{ font-size: 12px; color: rgba(0,0,0,0.62); line-height: 1.35; margin-bottom: 14px; }

    .group{
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .group h2{ font-size: 13px; margin: 0 0 10px 0; }

    .row{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items:center;
      margin: 8px 0;
    }
    .row label{ font-size: 12px; color: rgba(0,0,0,0.78); }
    .row output{
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: rgba(0,0,0,0.75);
      min-width: 92px;
      text-align:right;
    }
    input[type="range"]{ width:100%; }

    select{
      width: 100%;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.18);
      background:#fff;
      font-weight: 800;
      color:#4d4a48;
    }

    .btns{ display:flex; gap: 10px; flex-wrap:wrap; margin-top: 8px; }
    button{
      appearance:none;
      border:none;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      background:#e58c74;
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    }
    button.secondary{
      background:#f2eee9;
      color:#4d4a48;
      box-shadow:none;
      border: 1px solid rgba(0,0,0,0.08);
      font-weight: 900;
    }

    textarea{
      width: 100%;
      min-height: 170px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.18);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.35;
      color:#2f2d2c;
    }

    .preview{
      position: relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
      overflow:hidden;
    }

    .cardWrap{ position: relative; width: var(--card-w); height: var(--card-h); }

    .gameCard{
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: none;
      border-radius: 28px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.10);
      position:relative;
      overflow: visible;
    }

    /* gestippelde lijn als overlay boven alles,
       zo kan de toverfee erachter lijken te zitten */
    .gameCard::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: 28px;
      border: 4px dashed rgba(245,180,152,0.95);
      pointer-events:none;
      z-index: 50;
    }

    .stage{ position:absolute; inset:0; overflow: visible; }
    .stage img, .stage video{
      position:absolute;
      height:auto;
      display:block;
      pointer-events:none;
      transform: translate(-50%, -50%);
    }

    /* toverfee onder cijfer */
    #fairyVid{
      left: var(--fairy-left);
      top: var(--fairy-top);
      width: var(--fairy-size);
      opacity: 1;
      z-index: 2;
    }

    /* cijfer boven toverfee */
    #digitImg{
      left: var(--digit-left);
      top: var(--digit-top);
      width: var(--digit-size);
      opacity: 0;
      z-index: 3;
    }

    /* explosie wrapper boven cijfer */
    #explosionWrap{
      left: var(--digit-left);
      top: var(--digit-top);
      width: calc(var(--digit-size) * var(--explosion-scale));
      opacity: 0;
      z-index: 4;
      position:absolute;
      transform: translate(-50%, -50%);
    }

    #explosionVid{
      width: 100%;
      height: auto;
      display:block;
    }

    .stage.play #digitImg{
      animation: appear var(--fade-duration) ease forwards;
      animation-delay: var(--digit-delay);
    }

    .stage.boom #explosionWrap{
      animation: pop var(--explosion-fade-in) ease forwards;
      animation-delay: 0s;
    }

    @keyframes appear{
      0%{ opacity:0; transform: translate(-50%, -50%) scale(0.96); }
      100%{ opacity:1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes pop{
      0%{
        opacity:0;
        transform: translate(-50%, -50%) translateY(var(--explosion-offset-y)) scale(0.98);
      }
      100%{
        opacity:1;
        transform: translate(-50%, -50%) translateY(var(--explosion-offset-y)) scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="panel">
      <h1>Testomgeving, explosie mp4</h1>
      <div class="hint">
        Tip, zet je fade out niet op 10ms als je hem wilt zien, 200ms voelt al veel natuurlijker.
      </div>

      <div class="group">
        <h2>Start</h2>

        <div class="row">
          <label for="digitSelect">Te tonen cijfer</label>
          <output id="digitOut"></output>
        </div>

        <select id="digitSelect">
          <option value="random">Willekeurig</option>
          <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
        </select>

        <div class="btns">
          <button id="startBtn">Start</button>
          <button class="secondary" id="resetBtn">Reset</button>
          <button class="secondary" id="firstFrameBtn">Eerste beeld</button>
        </div>
      </div>

      <div class="group">
        <h2>Snelheid</h2>

        <div class="row"><label>Explosie snelheid</label><output id="explSpeedOut"></output></div>
        <input id="explSpeed" type="range" min="0.25" max="3.0" step="0.05" />

        <div class="row"><label>Toverfee snelheid</label><output id="fairySpeedOut"></output></div>
        <input id="fairySpeed" type="range" min="0.25" max="2.5" step="0.05" />
      </div>

      <div class="group">
        <h2>Copy paste blok</h2>
        <textarea id="exportBox" spellcheck="false" readonly></textarea>
      </div>
    </aside>

    <main class="preview">
      <div class="cardWrap">
        <div class="gameCard" id="card">
          <div class="stage" id="stage">
            <video id="fairyVid" muted playsinline preload="auto"></video>
            <img id="digitImg" alt="" />
            <div id="explosionWrap">
              <video id="explosionVid" muted playsinline preload="auto"></video>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const FAIRY_SRC = 'toverfee.mp4';
    const EXPLOSION_SRC = 'explosie.mp4';

    const stage = document.getElementById('stage');
    const fairyVid = document.getElementById('fairyVid');
    const digitImg = document.getElementById('digitImg');

    const explosionWrap = document.getElementById('explosionWrap');
    const explosionVid = document.getElementById('explosionVid');

    const els = {
      digitSelect: document.getElementById('digitSelect'),
      digitOut: document.getElementById('digitOut'),

      startBtn: document.getElementById('startBtn'),
      resetBtn: document.getElementById('resetBtn'),
      firstFrameBtn: document.getElementById('firstFrameBtn'),

      explSpeed: document.getElementById('explSpeed'),
      fairySpeed: document.getElementById('fairySpeed'),
      explSpeedOut: document.getElementById('explSpeedOut'),
      fairySpeedOut: document.getElementById('fairySpeedOut'),

      exportBox: document.getElementById('exportBox')
    };

    let tBoom = null;
    let tFade = null;

    function clearTimers(){
      if (tBoom){ clearTimeout(tBoom); tBoom = null; }
      if (tFade){ clearTimeout(tFade); tFade = null; }
    }

    function getVar(name){
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function parseMs(raw, fallback){
      const s = String(raw).trim();
      if (!s) return fallback;
      if (s.endsWith('ms')) return parseFloat(s) || fallback;
      if (s.endsWith('s')) return (parseFloat(s) || 0) * 1000;
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : fallback;
    }

    function freezeOnLastFrame(video){
      const d = Number.isFinite(video.duration) ? video.duration : 0;
      const t = Math.max(0, d - 0.04);
      video.addEventListener('seeked', () => video.pause(), { once:true });
      try { video.currentTime = t; } catch(e) { video.pause(); }
    }

    function loadFairyFirstFrame(){
      fairyVid.muted = true;
      fairyVid.playsInline = true;
      fairyVid.loop = false;
      fairyVid.controls = false;
      fairyVid.preload = 'auto';
      fairyVid.src = FAIRY_SRC;

      const onReady = () => {
        try { fairyVid.pause(); } catch(e) {}
        try { fairyVid.currentTime = 0; } catch(e) {}
        try { fairyVid.pause(); } catch(e) {}
      };

      fairyVid.addEventListener('loadeddata', onReady, { once:true });
      fairyVid.addEventListener('canplay', onReady, { once:true });
      try { fairyVid.load(); } catch(e) {}
    }

    function playFairyOnce(){
      const speed = Number(els.fairySpeed.value) || 1;
      fairyVid.playbackRate = speed;
      fairyVid.loop = false;
      fairyVid.onended = () => freezeOnLastFrame(fairyVid);

      try { fairyVid.pause(); } catch(e) {}
      try { fairyVid.currentTime = 0; } catch(e) {}

      const p = fairyVid.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }

    function loadExplosion(){
      explosionVid.muted = true;
      explosionVid.playsInline = true;
      explosionVid.loop = false;
      explosionVid.controls = false;
      explosionVid.preload = 'auto';
      explosionVid.src = EXPLOSION_SRC;
      try { explosionVid.load(); } catch(e) {}
    }

    function resetStage(){
      clearTimers();
      stage.classList.remove('play');
      stage.classList.remove('boom');

      digitImg.style.opacity = '0';
      digitImg.removeAttribute('src');
      digitImg.alt = '';

      explosionWrap.style.opacity = '0';
      explosionWrap.style.transition = '';

      try { explosionVid.pause(); } catch(e) {}
      try { explosionVid.currentTime = 0; } catch(e) {}
    }

    function pickDigit(){
      const v = els.digitSelect.value;
      if (v === 'random') return Math.floor(Math.random() * 10);
      return Number(v);
    }

    function startSequence(){
      const d = pickDigit();
      resetStage();

      digitImg.src = `marbotic${d}.png`;
      digitImg.alt = String(d);

      void stage.offsetHeight;
      stage.classList.add('play');

      playFairyOnce();

      const explStart = parseFloat(getVar('--explosion-start-delay')) || 0;
      const hideAfter = parseFloat(getVar('--explosion-hide-after')) || 0;
      const fadeMs = parseMs(getVar('--explosion-fadeout'), 200);

      tBoom = setTimeout(() => {
        stage.classList.remove('boom');
        void stage.offsetHeight;

        const speed = Number(els.explSpeed.value) || 1;
        explosionVid.playbackRate = speed;

        try { explosionVid.pause(); } catch(e) {}
        try { explosionVid.currentTime = 0; } catch(e) {}

        explosionWrap.style.opacity = '0';
        explosionWrap.style.transition = '';

        stage.classList.add('boom');

        const p = explosionVid.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      }, Math.max(0, explStart * 1000));

      tFade = setTimeout(() => {
        explosionWrap.style.transition = `opacity ${Math.max(0, fadeMs)}ms ease`;
        explosionWrap.style.opacity = '0';

        setTimeout(() => {
          stage.classList.remove('boom');
          try { explosionVid.pause(); } catch(e) {}
        }, Math.max(0, fadeMs + 60));
      }, Math.max(0, (explStart + hideAfter) * 1000));
    }

    function exportBlock(){
      els.exportBox.value =
`:root{
  --fairy-left: ${getVar('--fairy-left')};
  --fairy-top: ${getVar('--fairy-top')};
  --digit-left: ${getVar('--digit-left')};
  --digit-top: ${getVar('--digit-top')};

  --fairy-size: ${getVar('--fairy-size')};
  --digit-size: ${getVar('--digit-size')};

  --fade-duration: ${getVar('--fade-duration')};
  --digit-delay: ${getVar('--digit-delay')};

  --explosion-start-delay: ${getVar('--explosion-start-delay')};
  --explosion-scale: ${getVar('--explosion-scale')};
  --explosion-fade-in: ${getVar('--explosion-fade-in')};
  --explosion-offset-y: ${getVar('--explosion-offset-y')};
  --explosion-hide-after: ${getVar('--explosion-hide-after')};
  --explosion-fadeout: ${getVar('--explosion-fadeout')};
}

Toverfee snelheid: ${(Number(els.fairySpeed.value)||1).toFixed(2)}
Explosie snelheid: ${(Number(els.explSpeed.value)||1).toFixed(2)}
`;
    }

    function bindSpeed(rangeEl, outEl){
      const handler = () => {
        const v = Number(rangeEl.value) || 1;
        outEl.textContent = `${v.toFixed(2)}×`;
        exportBlock();
      };
      rangeEl.addEventListener('input', handler);
      handler();
    }

    window.addEventListener('load', () => {
      els.explSpeed.value = 1.00;
      els.fairySpeed.value = 1.00;

      els.digitOut.textContent = els.digitSelect.value === 'random' ? 'Willekeurig' : els.digitSelect.value;
      els.digitSelect.addEventListener('change', () => {
        els.digitOut.textContent = els.digitSelect.value === 'random' ? 'Willekeurig' : els.digitSelect.value;
      });

      bindSpeed(els.explSpeed, els.explSpeedOut);
      bindSpeed(els.fairySpeed, els.fairySpeedOut);

      els.startBtn.addEventListener('click', startSequence);
      els.resetBtn.addEventListener('click', () => { resetStage(); loadFairyFirstFrame(); });
      els.firstFrameBtn.addEventListener('click', loadFairyFirstFrame);

      loadFairyFirstFrame();
      loadExplosion();
      exportBlock();
      resetStage();
    });
  </script>
</body>
</html>
