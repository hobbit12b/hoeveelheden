<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Testomgeving, finetunen toverfee, cijfer, explosie</title>

  <style>
    :root{
      /* JOUW STARTWAARDEN */
      --fairy-left: 32.5%;
      --fairy-top: 51%;
      --digit-left: 68.5%;
      --digit-top: 58%;

      --fairy-size: 439px;
      --digit-size: 260px;

      --fade-duration: 1.8s;
      --digit-delay: 0.5s;

      --explosion-start-delay: 0.45s;
      --explosion-scale: 2;
      --explosion-fade-in: 0.07s;
      --explosion-offset-y: 10px;
      --explosion-hide-after: 0.7s;
      --explosion-fadeout: 200ms;

      --card-w: min(980px, 92vw);
      --card-h: min(520px, 56vh);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      height:100%;
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#faf7f5;
      color:#4d4a48;
      overflow:hidden;
    }

    .app{ height:100%; display:grid; grid-template-columns: 380px 1fr; }
    @media (max-width: 920px){
      .app{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }

    .panel{
      padding: 16px 14px;
      background:#ffffff;
      border-right: 1px solid rgba(0,0,0,0.06);
      overflow:auto;
    }
    .panel h1{ font-size: 16px; margin: 0 0 10px 0; }
    .hint{ font-size: 12px; color: rgba(0,0,0,0.62); line-height: 1.35; margin-bottom: 14px; }

    .group{
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .group h2{ font-size: 13px; margin: 0 0 10px 0; }

    .row{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items:center;
      margin: 8px 0;
    }
    .row label{ font-size: 12px; color: rgba(0,0,0,0.78); }
    .row output{
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: rgba(0,0,0,0.75);
      min-width: 82px;
      text-align:right;
    }
    input[type="range"]{ width:100%; }

    select{
      width: 100%;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.18);
      background:#fff;
      font-weight: 800;
      color:#4d4a48;
    }

    .btns{ display:flex; gap: 10px; flex-wrap:wrap; margin-top: 8px; }
    button{
      appearance:none;
      border:none;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      background:#e58c74;
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    }
    button.secondary{
      background:#f2eee9;
      color:#4d4a48;
      box-shadow:none;
      border: 1px solid rgba(0,0,0,0.08);
      font-weight: 900;
    }

    .check{ display:flex; gap: 10px; align-items:center; margin-top: 10px; font-size: 12px; color: rgba(0,0,0,0.75); }

    textarea{
      width: 100%;
      min-height: 170px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.18);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.35;
      color:#2f2d2c;
    }

    .preview{
      position: relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
      overflow:hidden;
    }

    .cardWrap{ position: relative; width: var(--card-w); height: var(--card-h); }

    .gameCard{
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 4px dashed rgba(245,180,152,0.95);
      border-radius: 28px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.10);
      position:relative;
      overflow: visible;
    }

    .gridOverlay{
      position:absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events:none;
      opacity: 0;
      background:
        linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px) 0 0 / 10% 100%,
        linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px) 0 0 / 100% 10%;
      mix-blend-mode: multiply;
    }
    .gridOn .gridOverlay{ opacity: 0.55; }

    .stage{ position:absolute; inset:0; overflow: visible; }
    .stage img, .stage video{
      position:absolute;
      height:auto;
      display:block;
      pointer-events:none;
      transform: translate(-50%, -50%);
    }

    /* Cijfer */
    #digitImg{
      left: var(--digit-left);
      top: var(--digit-top);
      width: var(--digit-size);
      opacity: 0;
      z-index: 2;
    }

    /* Explosie onder de toverfee, boven het cijfer */
    #explosion{
      left: var(--digit-left);
      top: var(--digit-top);
      width: calc(var(--digit-size) * var(--explosion-scale));
      opacity: 0;
      z-index: 3;
    }

    /* Toverfee BOVEN alles */
    #fairyVid{
      left: var(--fairy-left);
      top: var(--fairy-top);
      width: var(--fairy-size);
      opacity: 1;
      z-index: 4;
    }

    .stage.play #digitImg{
      animation: appear var(--fade-duration) ease forwards;
      animation-delay: var(--digit-delay);
    }

    /* explosie animatie start pas als JS boom class zet */
    .stage.boom #explosion{
      animation: pop var(--explosion-fade-in) ease forwards;
      animation-delay: 0s;
    }

    @keyframes appear{
      0%{ opacity:0; transform: translate(-50%, -50%) scale(0.96); }
      100%{ opacity:1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes pop{
      0%{ opacity:0; transform: translate(-50%, -50%) translateY(var(--explosion-offset-y)) scale(0.98); }
      100%{ opacity:1; transform: translate(-50%, -50%) translateY(var(--explosion-offset-y)) scale(1); }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="panel">
      <h1>Testomgeving, explosie gif herstart altijd</h1>
      <div class="hint">
        Start speelt alles af, nogmaals Start begint opnieuw vanaf nul.
        De explosie gif wordt elke keer hard opnieuw geladen, zodat hij opnieuw afspeelt op iPad.
      </div>

      <div class="group">
        <h2>Start</h2>

        <div class="row">
          <label for="digitSelect">Te tonen cijfer</label>
          <output id="digitOut"></output>
        </div>

        <select id="digitSelect">
          <option value="random">Willekeurig</option>
          <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
        </select>

        <div class="btns">
          <button id="startBtn">Start</button>
          <button class="secondary" id="resetBtn">Reset</button>
          <button class="secondary" id="firstFrameBtn">Eerste beeld</button>
        </div>

        <div class="check">
          <input type="checkbox" id="gridToggle" />
          <label for="gridToggle">Raster over het vak</label>
        </div>
      </div>

      <div class="group">
        <h2>Plaatsing</h2>

        <div class="row"><label>Cijfer links</label><output id="digitLeftOut"></output></div>
        <input id="digitLeft" type="range" min="0" max="100" step="0.5" />

        <div class="row"><label>Cijfer boven</label><output id="digitTopOut"></output></div>
        <input id="digitTop" type="range" min="0" max="100" step="0.5" />

        <div class="row"><label>Toverfee links</label><output id="fairyLeftOut"></output></div>
        <input id="fairyLeft" type="range" min="0" max="100" step="0.5" />

        <div class="row"><label>Toverfee boven</label><output id="fairyTopOut"></output></div>
        <input id="fairyTop" type="range" min="0" max="100" step="0.5" />
      </div>

      <div class="group">
        <h2>Grootte</h2>

        <div class="row"><label>Cijfer grootte</label><output id="digitSizeOut"></output></div>
        <input id="digitSize" type="range" min="120" max="460" step="1" />

        <div class="row"><label>Toverfee grootte</label><output id="fairySizeOut"></output></div>
        <input id="fairySize" type="range" min="180" max="700" step="1" />

        <div class="row"><label>Explosie schaal</label><output id="explScaleOut"></output></div>
        <input id="explScale" type="range" min="1" max="3" step="0.05" />

        <div class="row"><label>Explosie offset Y</label><output id="explOffsetOut"></output></div>
        <input id="explOffset" type="range" min="-60" max="80" step="1" />
      </div>

      <div class="group">
        <h2>Timing</h2>

        <div class="row"><label>Delay cijfer</label><output id="digitDelayOut"></output></div>
        <input id="digitDelay" type="range" min="0" max="3.0" step="0.05" />

        <div class="row"><label>Fade duur cijfer</label><output id="fadeDurOut"></output></div>
        <input id="fadeDur" type="range" min="0.1" max="3.5" step="0.05" />

        <div class="row"><label>Start explosie</label><output id="explStartOut"></output></div>
        <input id="explStart" type="range" min="0" max="3.5" step="0.05" />

        <div class="row"><label>Fade in explosie</label><output id="explFadeInOut"></output></div>
        <input id="explFadeIn" type="range" min="0.01" max="1.2" step="0.01" />

        <div class="row"><label>Explosie zichtbaar</label><output id="explHideAfterOut"></output></div>
        <input id="explHideAfter" type="range" min="0.1" max="6.0" step="0.05" />

        <div class="row"><label>Fade out explosie</label><output id="explFadeOutOut"></output></div>
        <input id="explFadeOut" type="range" min="0" max="1400" step="10" />
      </div>

      <div class="group">
        <h2>Copy paste blok</h2>
        <textarea id="exportBox" spellcheck="false" readonly></textarea>
      </div>
    </aside>

    <main class="preview">
      <div class="cardWrap">
        <div class="gameCard" id="card">
          <div class="gridOverlay"></div>

          <div class="stage" id="stage">
            <video id="fairyVid" muted playsinline preload="auto"></video>
            <img id="digitImg" alt="" />
            <img id="explosion" src="explosie.gif" alt="Explosie" />
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const card = document.getElementById('card');

    const fairyVid = document.getElementById('fairyVid');
    const digitImg = document.getElementById('digitImg');
    let explosionEl = document.getElementById('explosion');

    const els = {
      digitSelect: document.getElementById('digitSelect'),
      digitOut: document.getElementById('digitOut'),

      startBtn: document.getElementById('startBtn'),
      resetBtn: document.getElementById('resetBtn'),
      firstFrameBtn: document.getElementById('firstFrameBtn'),
      gridToggle: document.getElementById('gridToggle'),

      digitLeft: document.getElementById('digitLeft'),
      digitTop: document.getElementById('digitTop'),
      fairyLeft: document.getElementById('fairyLeft'),
      fairyTop: document.getElementById('fairyTop'),

      digitSize: document.getElementById('digitSize'),
      fairySize: document.getElementById('fairySize'),
      explScale: document.getElementById('explScale'),
      explOffset: document.getElementById('explOffset'),

      digitDelay: document.getElementById('digitDelay'),
      fadeDur: document.getElementById('fadeDur'),
      explStart: document.getElementById('explStart'),
      explFadeIn: document.getElementById('explFadeIn'),
      explHideAfter: document.getElementById('explHideAfter'),
      explFadeOut: document.getElementById('explFadeOut'),

      digitLeftOut: document.getElementById('digitLeftOut'),
      digitTopOut: document.getElementById('digitTopOut'),
      fairyLeftOut: document.getElementById('fairyLeftOut'),
      fairyTopOut: document.getElementById('fairyTopOut'),
      digitSizeOut: document.getElementById('digitSizeOut'),
      fairySizeOut: document.getElementById('fairySizeOut'),
      explScaleOut: document.getElementById('explScaleOut'),
      explOffsetOut: document.getElementById('explOffsetOut'),

      digitDelayOut: document.getElementById('digitDelayOut'),
      fadeDurOut: document.getElementById('fadeDurOut'),
      explStartOut: document.getElementById('explStartOut'),
      explFadeInOut: document.getElementById('explFadeInOut'),
      explHideAfterOut: document.getElementById('explHideAfterOut'),
      explFadeOutOut: document.getElementById('explFadeOutOut'),

      exportBox: document.getElementById('exportBox')
    };

    let tBoom = null;
    let tFade = null;

    function clearTimers(){
      if (tBoom){ clearTimeout(tBoom); tBoom = null; }
      if (tFade){ clearTimeout(tFade); tFade = null; }
    }

    function setVar(name, value){
      document.documentElement.style.setProperty(name, value);
    }

    function getVar(name){
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function parseMs(raw, fallback){
      const s = String(raw).trim();
      if (!s) return fallback;
      if (s.endsWith('ms')) return parseFloat(s) || fallback;
      if (s.endsWith('s')) return (parseFloat(s) || 0) * 1000;
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : fallback;
    }

    function freezeOnLastFrame(video){
      const d = Number.isFinite(video.duration) ? video.duration : 0;
      const t = Math.max(0, d - 0.04);
      video.addEventListener('seeked', () => video.pause(), { once:true });
      try { video.currentTime = t; } catch(e) { video.pause(); }
    }

    function showFirstFrame(){
      fairyVid.muted = true;
      fairyVid.playsInline = true;
      fairyVid.loop = false;
      fairyVid.controls = false;
      fairyVid.preload = 'auto';
      fairyVid.src = 'toverfee.mp4';

      const onReady = () => {
        try { fairyVid.pause(); } catch(e) {}
        try { fairyVid.currentTime = 0; } catch(e) {}
        try { fairyVid.pause(); } catch(e) {}
      };

      fairyVid.addEventListener('loadeddata', onReady, { once:true });
      fairyVid.addEventListener('canplay', onReady, { once:true });
      try { fairyVid.load(); } catch(e) {}
    }

    function playFairyOnce(){
      fairyVid.loop = false;
      fairyVid.onended = () => freezeOnLastFrame(fairyVid);

      try { fairyVid.pause(); } catch(e) {}
      try { fairyVid.currentTime = 0; } catch(e) {}

      const p = fairyVid.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }

    function hardRestartExplosionGif(){
      const old = explosionEl;
      const parent = old.parentNode;

      const rawSrc = old.dataset.baseSrc || old.getAttribute('src') || 'explosie.gif';
      const baseSrc = rawSrc.split('?')[0];

      const fresh = old.cloneNode(false);
      fresh.id = old.id;
      fresh.alt = old.alt || 'Explosie';
      fresh.dataset.baseSrc = baseSrc;

      fresh.style.opacity = '0';
      fresh.style.transition = '';

      fresh.src = baseSrc + (baseSrc.includes('?') ? '&' : '?') + 't=' + Date.now();

      parent.replaceChild(fresh, old);
      explosionEl = fresh;
    }

    function resetStage(){
      clearTimers();
      stage.classList.remove('play');
      stage.classList.remove('boom');

      digitImg.style.opacity = '0';
      digitImg.removeAttribute('src');
      digitImg.alt = '';

      if (explosionEl){
        explosionEl.style.opacity = '0';
        explosionEl.style.transition = '';
      }
    }

    function pickDigit(){
      const v = els.digitSelect.value;
      if (v === 'random') return Math.floor(Math.random() * 10);
      return Number(v);
    }

    function startSequence(){
      const d = pickDigit();
      resetStage();

      digitImg.src = `marbotic${d}.png`;
      digitImg.alt = String(d);

      void stage.offsetHeight;
      stage.classList.add('play');

      playFairyOnce();

      const explStart = parseFloat(getVar('--explosion-start-delay')) || 0;
      const hideAfter = parseFloat(getVar('--explosion-hide-after')) || 0;
      const fadeMs = parseMs(getVar('--explosion-fadeout'), 200);

      tBoom = setTimeout(() => {
        stage.classList.remove('boom');
        void stage.offsetHeight;

        hardRestartExplosionGif();

        stage.classList.add('boom');
      }, Math.max(0, explStart * 1000));

      tFade = setTimeout(() => {
        if (!explosionEl) return;
        explosionEl.style.transition = `opacity ${Math.max(0, fadeMs)}ms ease`;
        explosionEl.style.opacity = '0';
        setTimeout(() => {
          stage.classList.remove('boom');
        }, Math.max(0, fadeMs + 60));
      }, Math.max(0, (explStart + hideAfter) * 1000));
    }

    function exportBlock(){
      els.exportBox.value =
`:root{
  --fairy-left: ${getVar('--fairy-left')};
  --fairy-top: ${getVar('--fairy-top')};
  --digit-left: ${getVar('--digit-left')};
  --digit-top: ${getVar('--digit-top')};

  --fairy-size: ${getVar('--fairy-size')};
  --digit-size: ${getVar('--digit-size')};

  --fade-duration: ${getVar('--fade-duration')};
  --digit-delay: ${getVar('--digit-delay')};

  --explosion-start-delay: ${getVar('--explosion-start-delay')};
  --explosion-scale: ${getVar('--explosion-scale')};
  --explosion-fade-in: ${getVar('--explosion-fade-in')};
  --explosion-offset-y: ${getVar('--explosion-offset-y')};
  --explosion-hide-after: ${getVar('--explosion-hide-after')};
  --explosion-fadeout: ${getVar('--explosion-fadeout')};
}`;
    }

    function bindRange(rangeEl, outEl, fmt, apply){
      const handler = () => {
        const v = Number(rangeEl.value);
        outEl.textContent = fmt(v);
        apply(v);
        exportBlock();
      };
      rangeEl.addEventListener('input', handler);
      handler();
    }

    function initUI(){
      const parsePct = (s) => parseFloat(String(s).replace('%','')) || 0;
      const parsePx = (s) => parseFloat(String(s).replace('px','')) || 0;
      const parseSec = (s) => parseFloat(String(s).replace('s','')) || 0;

      els.digitLeft.value = parsePct(getVar('--digit-left'));
      els.digitTop.value = parsePct(getVar('--digit-top'));
      els.fairyLeft.value = parsePct(getVar('--fairy-left'));
      els.fairyTop.value = parsePct(getVar('--fairy-top'));

      els.digitSize.value = parsePx(getVar('--digit-size'));
      els.fairySize.value = parsePx(getVar('--fairy-size'));

      els.explScale.value = parseFloat(getVar('--explosion-scale')) || 2;
      els.explOffset.value = parsePx(getVar('--explosion-offset-y'));

      els.digitDelay.value = parseSec(getVar('--digit-delay'));
      els.fadeDur.value = parseSec(getVar('--fade-duration'));

      els.explStart.value = parseSec(getVar('--explosion-start-delay'));
      els.explFadeIn.value = parseSec(getVar('--explosion-fade-in'));
      els.explHideAfter.value = parseSec(getVar('--explosion-hide-after'));
      els.explFadeOut.value = parseMs(getVar('--explosion-fadeout'), 200);

      els.digitOut.textContent = els.digitSelect.value === 'random' ? 'Willekeurig' : els.digitSelect.value;
    }

    function wire(){
      bindRange(els.digitLeft, els.digitLeftOut, v => `${v.toFixed(1)}%`, v => setVar('--digit-left', `${v}%`));
      bindRange(els.digitTop, els.digitTopOut, v => `${v.toFixed(1)}%`, v => setVar('--digit-top', `${v}%`));
      bindRange(els.fairyLeft, els.fairyLeftOut, v => `${v.toFixed(1)}%`, v => setVar('--fairy-left', `${v}%`));
      bindRange(els.fairyTop, els.fairyTopOut, v => `${v.toFixed(1)}%`, v => setVar('--fairy-top', `${v}%`));

      bindRange(els.digitSize, els.digitSizeOut, v => `${Math.round(v)}px`, v => setVar('--digit-size', `${Math.round(v)}px`));
      bindRange(els.fairySize, els.fairySizeOut, v => `${Math.round(v)}px`, v => setVar('--fairy-size', `${Math.round(v)}px`));

      bindRange(els.explScale, els.explScaleOut, v => `${v.toFixed(2)}`, v => setVar('--explosion-scale', `${v}`));
      bindRange(els.explOffset, els.explOffsetOut, v => `${Math.round(v)}px`, v => setVar('--explosion-offset-y', `${Math.round(v)}px`));

      bindRange(els.digitDelay, els.digitDelayOut, v => `${v.toFixed(2)}s`, v => setVar('--digit-delay', `${v}s`));
      bindRange(els.fadeDur, els.fadeDurOut, v => `${v.toFixed(2)}s`, v => setVar('--fade-duration', `${v}s`));

      bindRange(els.explStart, els.explStartOut, v => `${v.toFixed(2)}s`, v => setVar('--explosion-start-delay', `${v}s`));
      bindRange(els.explFadeIn, els.explFadeInOut, v => `${v.toFixed(2)}s`, v => setVar('--explosion-fade-in', `${v}s`));
      bindRange(els.explHideAfter, els.explHideAfterOut, v => `${v.toFixed(2)}s`, v => setVar('--explosion-hide-after', `${v}s`));
      bindRange(els.explFadeOut, els.explFadeOutOut, v => `${Math.round(v)}ms`, v => setVar('--explosion-fadeout', `${Math.round(v)}ms`));

      els.digitSelect.addEventListener('change', () => {
        els.digitOut.textContent = els.digitSelect.value === 'random' ? 'Willekeurig' : els.digitSelect.value;
      });

      els.startBtn.addEventListener('click', startSequence);
      els.resetBtn.addEventListener('click', () => { resetStage(); showFirstFrame(); });
      els.firstFrameBtn.addEventListener('click', showFirstFrame);

      els.gridToggle.addEventListener('change', () => {
        card.classList.toggle('gridOn', els.gridToggle.checked);
      });
    }

    window.addEventListener('load', () => {
      initUI();
      wire();
      exportBlock();
      showFirstFrame();
      resetStage();
    });
  </script>
</body>
</html>
