<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Slim kijken</title>

  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; overflow: hidden; }

    .titleBar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .teacherOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .teacherPanel {
      width: min(520px, 100%);
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 16px;
      touch-action: auto;
    }

    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="titleBar" class="titleBar">Slim kijken</div>

  <div id="teacherOverlay" class="teacherOverlay" aria-hidden="true">
    <div class="teacherPanel" role="dialog" aria-modal="true">
      <div style="font-weight: 700; font-size: 18px; margin-bottom: 10px;">Leerkrachtmodus</div>

      <div class="row">
        <button id="btnExport">Exporteer sessie JSON</button>
        <button id="btnReset">Reset sessie</button>
        <button id="btnClose">Sluit</button>
      </div>

      <div style="margin-top: 10px; font-size: 13px; opacity: 0.75;">
        Dit paneel is verborgen voor leerlingen, open via lang indrukken op de titel.
      </div>
    </div>
  </div>

  <script>
    const state = {
      sessionId: crypto.randomUUID(),
      startedAt: new Date().toISOString(),
      endedAt: null,
      pos: 1,
      stability: 0,
      helpDebt: 0,
      forcedHelpRounds: 0,
      startLookRoundsRemaining: 2,
      lastRoundType: null,
      lastRoundWasWrong: false,
      rounds: [],
    };

    const elTitle = document.getElementById("titleBar");
    const elOverlay = document.getElementById("teacherOverlay");
    const btnExport = document.getElementById("btnExport");
    const btnReset = document.getElementById("btnReset");
    const btnClose = document.getElementById("btnClose");

    let overlayIdleTimer = null;

    function openTeacherMode() {
      elOverlay.style.display = "flex";
      elOverlay.setAttribute("aria-hidden", "false");
      resetOverlayIdleTimer();
    }

    function closeTeacherMode() {
      elOverlay.style.display = "none";
      elOverlay.setAttribute("aria-hidden", "true");
      clearTimeout(overlayIdleTimer);
      overlayIdleTimer = null;
    }

    function resetOverlayIdleTimer() {
      clearTimeout(overlayIdleTimer);
      overlayIdleTimer = setTimeout(() => closeTeacherMode(), 25000);
    }

    elOverlay.addEventListener("pointerdown", resetOverlayIdleTimer, { passive: true });
    elOverlay.addEventListener("pointermove", resetOverlayIdleTimer, { passive: true });
    elOverlay.addEventListener("pointerup", resetOverlayIdleTimer, { passive: true });

    btnClose.addEventListener("click", closeTeacherMode);

    btnReset.addEventListener("click", () => {
      // reset, zonder opslag tussen sessies
      Object.assign(state, {
        sessionId: crypto.randomUUID(),
        startedAt: new Date().toISOString(),
        endedAt: null,
        pos: 1,
        stability: 0,
        helpDebt: 0,
        forcedHelpRounds: 0,
        startLookRoundsRemaining: 2,
        lastRoundType: null,
        lastRoundWasWrong: false,
        rounds: [],
      });
      resetOverlayIdleTimer();
    });

    btnExport.addEventListener("click", () => {
      state.endedAt = new Date().toISOString();

      const payload = {
        sessionId: state.sessionId,
        startedAt: state.startedAt,
        endedAt: state.endedAt,
        start: { pos: 1 },
        end: { pos: state.pos },
        rounds: state.rounds,
      };

      const text = JSON.stringify(payload, null, 2);
      const blob = new Blob([text], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const stamp = new Date();
      const y = stamp.getFullYear();
      const m = String(stamp.getMonth() + 1).padStart(2, "0");
      const d = String(stamp.getDate()).padStart(2, "0");
      const hh = String(stamp.getHours()).padStart(2, "0");
      const mm = String(stamp.getMinutes()).padStart(2, "0");
      const ss = String(stamp.getSeconds()).padStart(2, "0");
      const filename = `slimkijken_session_${y}${m}${d}_${hh}${mm}${ss}.json`;

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
      resetOverlayIdleTimer();
    });

    // Lang indrukken op titel, 900 ms, max 12 px beweging
    (function installLongPress() {
      const HOLD_MS = 900;
      const MAX_MOVE_PX = 12;

      let timer = null;
      let startX = 0;
      let startY = 0;
      let activePointerId = null;
      let triggered = false;

      function clear() {
        if (timer) clearTimeout(timer);
        timer = null;
        activePointerId = null;
        triggered = false;
      }

      elTitle.addEventListener("pointerdown", (e) => {
        if (elOverlay.style.display === "flex") return;

        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        triggered = false;

        timer = setTimeout(() => {
          triggered = true;
          openTeacherMode();
        }, HOLD_MS);
      });

      elTitle.addEventListener("pointermove", (e) => {
        if (activePointerId !== e.pointerId || !timer) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.hypot(dx, dy) > MAX_MOVE_PX) clear();
      });

      elTitle.addEventListener("pointerup", (e) => {
        if (activePointerId !== e.pointerId) return;
        clear();
      });

      elTitle.addEventListener("pointercancel", clear);
      elTitle.addEventListener("lostpointercapture", clear);
    })();
  </script>
</body>
</html>
