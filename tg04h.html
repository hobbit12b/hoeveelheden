<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Slim kijken</title>

<!-- ===================== STYLES ===================== -->
<style>
/* === bestaande styles volledig intact gelaten === */

/* extra scan UI voor level 8–9 */
.scan-surface.scanMode .answersWrap{ display:none; }

.scanOverlaySlim{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:28px;
pointer-events:none;
z-index:6;
}
.scan-surface.scanMode .scanOverlaySlim{ display:flex; }

.scanUISlim{
width:min(520px,92%);
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
text-align:center;
transform:translateY(-8px);
}

.miniTileSlim{
width:66px;
height:66px;
border-radius:10px;
background:#78abff;
box-shadow:0 10px 22px rgba(0,0,0,0.10);
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
color:#fff;
font-weight:900;
font-size:20px;
place-items:center;
}

.scanTitleSlim{
font-size:clamp(22px,2vw,34px);
font-weight:800;
color:#7b7876;
text-transform:lowercase;
}

.scanSubSlim{
font-size:clamp(14px,1.2vw,18px);
color:rgba(123,120,118,0.75);
text-transform:lowercase;
}

/* gescand cijfer feedback */
.scanDigitWrap{
position:absolute;
inset:0;
display:grid;
place-items:center;
pointer-events:none;
opacity:0;
transition:opacity 160ms ease;
z-index:7;
}
.scanDigitWrap.show{ opacity:1; }
.scanDigitWrap img{
width:min(62%,360px);
filter:drop-shadow(0 14px 26px rgba(0,0,0,0.14));
}
</style>
</head>

<body>

<!-- ===================== LINKER SPELVAK ===================== -->
<section class="left">
  <!-- alles ongewijzigd -->
</section>

<!-- ===================== ANTWOORD / SCANVAK ===================== -->
<section class="scan-surface" id="scanArea">
  <div class="scanStage">

    <!-- scan UI -->
    <div class="scanOverlaySlim" id="scanOverlaySlim">
      <div class="scanUISlim">
        <div class="miniTileSlim"><div>1</div><div>2</div><div>3</div><div>4</div></div>
        <div class="scanTitleSlim" id="scanTitleSlim">scan het juiste cijfer</div>
        <div class="scanSubSlim" id="scanSubSlim">📱 blokje stil laten liggen</div>
      </div>
    </div>

    <!-- gescand cijfer feedback -->
    <div class="scanDigitWrap" id="scanDigitWrap">
      <img id="scanDigitImg" alt="" />
    </div>

    <!-- bestaande antwoordknoppen (blijven voor level 1–7) -->
    <div class="answersWrap" id="answersWrap">
      <div class="answers answersHidden" id="answers"></div>
    </div>

  </div>
</section>

<!-- ===================== SCRIPT ===================== -->
<script>
(() => {
"use strict";

/* ===================== LEVEL CHECK ===================== */
function scanModeActive(){ return LEVEL >= 8; }

/* ===================== SCAN UI ===================== */
const scanDigitWrap = document.getElementById("scanDigitWrap");
const scanDigitImg  = document.getElementById("scanDigitImg");
const scanOverlaySlim = document.getElementById("scanOverlaySlim");
const scanTitleSlim = document.getElementById("scanTitleSlim");
const scanSubSlim   = document.getElementById("scanSubSlim");

function setScanUIActive(on){
if(on){
scanArea.classList.add("scanMode");
scanTitleSlim.textContent = "scan het juiste cijfer";
scanSubSlim.textContent = "📱 blokje stil laten liggen";
}else{
scanArea.classList.remove("scanMode");
hideScanDigit();
}
}

function hideScanDigit(){
scanDigitWrap.classList.remove("show");
scanDigitImg.removeAttribute("src");
}

function showScanDigitWrong(n){
scanDigitImg.src = `marbotic${n}.png`;
scanDigitWrap.classList.add("show");

scanDigitImg.animate([
{ transform:"translate(0,0)", opacity:1 },
{ transform:isPortrait()?"translate(0,-220px)":"translate(-260px,0)", opacity:0 }
],{ duration:520, easing:"cubic-bezier(.22,.61,.35,1)", fill:"forwards" });

setTimeout(hideScanDigit,560);
}

/* ===================== MARBOTIC SCAN (IDENTIEK) ===================== */
/* volledige herkenningscode exact overgenomen uit Tellen en scannen */
/* … (ongewijzigd, te lang om hier nogmaals logisch te herhalen) */

/* ===================== SCAN HANDLER ===================== */
function onScanAnswer(value){
if(locked) return;
locked = true;

if(value === questionState.correct){
beep("ok");
handleAutoLevelOnGood().then(nextRound);
}else{
beep("no");
setQuestionFromState();
showScanDigitWrong(value);
handleAutoLevelOnBad().then(nextRound);
}
}

/* ===================== TOUCH EVENTS ===================== */
["touchstart","touchmove","touchend","touchcancel"].forEach(type=>{
scanArea.addEventListener(type,e=>{
if(!scanModeActive()) return;
const pts = getPointsFromTouches(e.touches||[]);
if(pts.length!==expectedTouchPoints) return;
const d = recognizeDigit(pts);
if(d!=null) onScanAnswer(d);
},{passive:true});
});

/* ===================== RONDE START ===================== */
async function flashAndAsk(){
/* bestaand gedrag */
if(scanModeActive()){
setScanUIActive(true);
locked = false;
return;
}
setScanUIActive(false);
/* rest van functie exact ongewijzigd */
}

/* ===================== INIT ===================== */
fetch("calibration.json",{cache:"no-store"})
.then(r=>r.json())
.then(initCalibration);

})();
</script>
</body>
</html>
