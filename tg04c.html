<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      /* kleuren uit jouw tellen en scannen */
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;

      --dash-w:4px;
      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);

      --border: rgba(245,180,152,0.85);
      --tile: #ffffff;
      --tile-ink: #4d4a48;
      --muted: rgba(77,74,72,0.70);

      --ok: rgba(46,196,122,0.95);
      --no: rgba(255,91,122,0.95);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }

    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 22px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }

    .right{
      background:#ffffff;
      position: relative;
      overflow:hidden;
      min-height: 0;
      transition: background 140ms ease;
    }

    @media (orientation: landscape){
      .right{ border-left: 6px dashed var(--border); }
    }
    @media (orientation: portrait){
      .right{ border-top: 6px dashed var(--border); }
      .left{ padding: 22px; gap: 16px; }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
    }
    .homeBtn:active,
    .tuneBtn:active{ transform: scale(0.98); }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: var(--dash-w) dashed var(--border);
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      transition: background 160ms ease, transform 120ms ease;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    .gameCard.flashWrong{ background: #fde1e1; }
    .gameCard.shake{ animation: wiggle 220ms ease; }

    @media (orientation: portrait){
      .gameCard{ height: min(420px, 34vh); }
    }

    @keyframes wiggle{
      0%{ transform: translateX(0); }
      28%{ transform: translateX(-6px); }
      58%{ transform: translateX(5px); }
      100%{ transform: translateX(0); }
    }

    /* board inner */
    .flashBoard{
      width: min(520px, 88%);
      aspect-ratio: 1.35 / 1;
      border-radius: 26px;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(245,180,152,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      box-shadow: 0 14px 26px rgba(0,0,0,0.08);
    }
    .flashSvg{ width:100%; height:100%; }

    /* Right panel */
    .scanOverlay{
      position:absolute;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px;
      z-index: 5;
    }

    .scanUI{
      width: min(720px, 92%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 14px;
      text-align:center;
      transform: translateY(-8px);
    }

    .miniTile{
      width: 66px;
      height: 66px;
      border-radius: 10px;
      background: #78abff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      color:#fff;
      font-weight: 900;
      font-size: 20px;
      line-height: 1;
      place-items:center;
    }

    .scanTitle{
      font-size: clamp(22px, 2vw, 34px);
      font-weight: 900;
      color: #7b7876;
      margin-top: 6px;
      text-transform: lowercase;
    }

    .scanSub{
      font-size: clamp(16px, 1.3vw, 20px);
      color: rgba(123,120,118,0.75);
      margin-top: -4px;
      text-transform: lowercase;
    }

    /* Answer grid */
    .answerGrid{
      width: min(780px, 92%);
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 6px;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    @media (max-width: 860px){
      .answerGrid{ grid-template-columns: 1fr; }
    }

    /* "fase look": antwoorden weg */
    .phaseLook .answerGrid{
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    /* "fase choose": zichtbaar */
    .phaseChoose .answerGrid{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* tegel look */
    .ansBtn{
      appearance:none;
      border: 4px solid var(--border);
      background: rgba(255,255,255,0.94);
      border-radius: 22px;
      box-shadow: 0 14px 26px rgba(0,0,0,0.10);
      padding: 14px;
      min-height: 130px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;

      transform: translateY(0) scale(1);
      transition: transform 90ms ease, box-shadow 140ms ease, background 140ms ease, border-color 140ms ease;
      position:relative;
      overflow:hidden;
    }

    .ansBtn:hover{
      box-shadow: 0 18px 34px rgba(0,0,0,0.12);
    }

    .ansBtn:active{
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 10px 18px rgba(0,0,0,0.10);
    }

    .ansBtn:focus-visible{
      outline: none;
      box-shadow: 0 0 0 6px rgba(229,140,116,0.25), 0 18px 34px rgba(0,0,0,0.12);
      border-color: rgba(229,140,116,0.95);
    }

    .ansBtn.correct{
      border-color: var(--ok);
      background: rgba(46,196,122,0.10);
    }
    .ansBtn.wrong{
      border-color: var(--no);
      background: rgba(255,91,122,0.10);
    }

    /* "nu mag je kiezen" binnenkom animatie per kaart */
    .ansBtn.reveal{
      opacity: 0;
      transform: translateY(12px) scale(0.985);
      animation: popIn 220ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    @keyframes popIn{
      0%{ opacity:0; transform: translateY(12px) scale(0.985); }
      70%{ opacity:1; transform: translateY(-2px) scale(1.01); }
      100%{ opacity:1; transform: translateY(0) scale(1); }
    }

    /* start overlay */
    .startOverlay{
      position:fixed;
      inset:0;
      background: rgba(253,238,234,0.55);
      backdrop-filter: blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      padding: 24px;
    }

    .startCard{
      width: min(560px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align:center;
    }

    .startCard h1{
      margin: 0 0 10px 0;
      font-size: 28px;
      color: #4d4a48;
      text-transform: lowercase;
    }

    .startCard p{
      margin: 0 0 16px 0;
      color: rgba(77,74,72,0.82);
      font-size: 18px;
      line-height: 1.35;
    }

    .startBtn{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 900;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      text-transform: lowercase;
    }
    .startBtn:active{ transform: scale(0.99); }

    /* kleine fase hint (geen tekst overload, alleen subtiel) */
    .phasePill{
      position:absolute;
      left: 24px;
      bottom: 18px;
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(245,180,152,0.55);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 900;
      color: rgba(77,74,72,0.82);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
      text-transform: lowercase;
      font-size: 13px;
      display:flex;
      gap: 8px;
      align-items:center;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background: rgba(229,140,116,0.75);
    }
    .phaseLook .dot{ background: rgba(120,171,255,0.95); }
    .phaseChoose .dot{ background: rgba(229,140,116,0.95); }
  </style>
</head>

<body class="phaseLook">
  <section class="left" aria-label="Opgave">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn" aria-label="Naar begin" type="button">🏠</button>
      <button class="tuneBtn" id="tuneBtn" aria-label="Instellen" type="button">⚙️</button>
      <div class="titlePill">slim kijken</div>
    </div>

    <div class="content">
      <div class="gameCard" id="gameCard" aria-label="Flitskaart">
        <div class="flashBoard" id="flashBoard">
          <div class="flashSvg" id="flashSvg"></div>
        </div>

        <div class="phasePill" aria-hidden="true">
          <span class="dot"></span>
          <span id="phaseText">kijk</span>
        </div>
      </div>
    </div>
  </section>

  <section class="right" aria-label="Antwoordvak">
    <div class="scanOverlay">
      <div class="scanUI">
        <div class="miniTile" aria-hidden="true">
          <div>1</div><div>2</div><div>3</div><div>4</div>
        </div>

        <div class="scanTitle" id="scanTitle">kijk naar de stippen</div>
        <div class="scanSub" id="scanSub">kies wat je zag</div>

        <div class="answerGrid" id="answerGrid" aria-label="Antwoorden"></div>
      </div>
    </div>
  </section>

  <div class="startOverlay" id="startOverlay" role="dialog" aria-modal="true" aria-label="Start">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Je ziet stippen heel kort, daarna kies je wat je zag.</p>
      <button class="startBtn" id="startBtn" type="button">start</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));

      // DOM
      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");
      const homeBtn = document.getElementById("homeBtn");
      const tuneBtn = document.getElementById("tuneBtn");

      const flashSvg = document.getElementById("flashSvg");
      const answerGrid = document.getElementById("answerGrid");
      const scanTitle = document.getElementById("scanTitle");
      const scanSub = document.getElementById("scanSub");
      const gameCard = document.getElementById("gameCard");
      const phaseText = document.getElementById("phaseText");

      // simpele settings (later kun je dit aan jouw overlay koppelen)
      const SETTINGS = {
        flashMsStart: 800,
        minMs: 450,
        maxMs: 1600
      };

      // geluidjes zonder bestanden, klein en betrouwbaar
      let audioCtx = null;
      function beep(type){
        try{
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();

          o.type = "sine";
          if(type === "ok") o.frequency.setValueAtTime(740, t);
          if(type === "no") o.frequency.setValueAtTime(220, t);
          if(type === "tap") o.frequency.setValueAtTime(520, t);

          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + (type==="ok"?0.12:0.18));

          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(t);
          o.stop(t + 0.22);
        }catch(e){}
      }

      function setPhase(name){
        document.body.classList.remove("phaseLook","phaseChoose","phaseFeedback");
        document.body.classList.add(name);
        phaseText.textContent = (name === "phaseChoose") ? "kies" : "kijk";
      }

      // Dots in 3x3 grid
      const P = {
        tl:[0.25,0.25], tc:[0.50,0.25], tr:[0.75,0.25],
        ml:[0.25,0.50], mc:[0.50,0.50], mr:[0.75,0.50],
        bl:[0.25,0.75], bc:[0.50,0.75], br:[0.75,0.75]
      };

      const diceFaces = {
        1: [P.mc],
        2: [P.tl, P.br],
        3: [P.tl, P.mc, P.br],
        4: [P.tl, P.tr, P.bl, P.br],
        5: [P.tl, P.tr, P.mc, P.bl, P.br],
        6: [P.tl, P.ml, P.bl, P.tr, P.mr, P.br]
      };

      function svgForDots(n, opts = {}){
        const {
          dotRadius = 12,
          dotColor = "rgba(77,74,72,0.80)",
          glow = false
        } = opts;

        const w = 520, h = 380;
        const dots = diceFaces[n] || [];
        const box = {x0:0.12, y0:0.12, x1:0.88, y1:0.88};

        const filter = glow ? `
          <defs>
            <filter id="g">
              <feGaussianBlur stdDeviation="2.2" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>` : "";

        const circles = dots.map(([x,y]) => {
          const X = (box.x0 + x*(box.x1-box.x0)) * w;
          const Y = (box.y0 + y*(box.y1-box.y0)) * h;
          return `
            <circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${dotRadius}"
              fill="${dotColor}"
              ${glow ? `filter="url(#g)"` : "" }
            />`;
        }).join("");

        return `
          <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" aria-hidden="true" role="img">
            ${filter}
            ${circles}
          </svg>`;
      }

      function emptySvg(){
        return `<svg viewBox="0 0 520 380" width="100%" height="100%" aria-hidden="true"></svg>`;
      }

      function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

      // Game state
      let started = false;
      let locked = false;
      let flashMs = SETTINGS.flashMsStart;
      let currentCorrect = 1;
      let wrongCount = 0;

      function buildOptions(correct){
        // 3 opties, cap 6
        const cap = 6;
        const opts = new Set([correct]);
        while(opts.size < 3){
          const delta = [-2,-1,1,2][randInt(0,3)];
          opts.add(clamp(correct + delta, 1, cap));
        }
        // shuffle
        const arr = [...opts];
        for(let i=arr.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [arr[i],arr[j]] = [arr[j],arr[i]];
        }
        return arr;
      }

      function clearAnswers(){
        answerGrid.innerHTML = "";
      }

      function renderAnswersWithReveal(options){
        clearAnswers();

        options.forEach((v, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ansBtn reveal";
          btn.style.animationDelay = `${idx * 90}ms`;
          btn.setAttribute("aria-label", `antwoord ${v}`);

          btn.innerHTML = `<div style="width:100%; height:100%;">${svgForDots(v, {dotRadius:12})}</div>`;

          btn.addEventListener("click", () => onPick(btn, v));
          answerGrid.appendChild(btn);
        });
      }

      async function doRound(){
        locked = true;
        wrongCount = 0;

        scanTitle.textContent = "kijk naar de stippen";
        scanSub.textContent = "wacht even";

        setPhase("phaseLook");
        clearAnswers();                 // extra zekerheid, geen oude knoppen zichtbaar
        flashSvg.innerHTML = emptySvg();
        await wait(320);

        currentCorrect = randInt(1,6);

        // flits
        flashSvg.innerHTML = svgForDots(currentCorrect, {dotRadius:14, glow:true});
        await wait(flashMs);

        // leeg moment
        flashSvg.innerHTML = emptySvg();
        await wait(320);

        // nu pas keuzes opbouwen en tonen
        scanTitle.textContent = "kijk naar de stippen";
        scanSub.textContent = "kies wat je zag";

        const options = buildOptions(currentCorrect);
        renderAnswersWithReveal(options);

        setPhase("phaseChoose");
        locked = false;
      }

      async function onPick(btn, value){
        if (!started || locked) return;
        locked = true;

        const correct = currentCorrect;

        if (value === correct){
          beep("ok");
          btn.classList.add("correct");

          // korte bevestiging zonder tekst te stapelen
          flashSvg.innerHTML = svgForDots(correct, {dotRadius:14, glow:true});
          await wait(420);
          flashSvg.innerHTML = emptySvg();

          // iets sneller na goede reeks kan later, nu simpel
          flashMs = clamp(flashMs - 60, SETTINGS.minMs, SETTINGS.maxMs);

          await wait(220);
          await doRound();
          return;
        }

        // fout
        beep("no");
        btn.classList.add("wrong");
        gameCard.classList.remove("shake");
        void gameCard.offsetHeight;
        gameCard.classList.add("shake");

        wrongCount += 1;
        flashMs = clamp(flashMs + 140, SETTINGS.minMs, SETTINGS.maxMs);

        // anti tel maatregel light: even opnieuw flitsen, antwoorden weer weg
        await wait(220);

        setPhase("phaseLook");
        clearAnswers();

        flashSvg.innerHTML = svgForDots(correct, {dotRadius:14, glow:true});
        await wait(Math.min(SETTINGS.maxMs, flashMs + 220));

        flashSvg.innerHTML = emptySvg();
        await wait(280);

        // opnieuw antwoorden tonen, weer dat "nu mag je kiezen" gevoel
        const options = buildOptions(correct);
        renderAnswersWithReveal(options);
        setPhase("phaseChoose");
        locked = false;
      }

      function startGame(){
        if (started) return;
        started = true;
        startOverlay.style.display = "none";
        beep("tap");
        doRound();
      }

      // controls
      startBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); startGame(); });
      startOverlay.addEventListener("click", (e) => { if (e.target === startOverlay) startGame(); });

      homeBtn.addEventListener("click", () => {
        // in single file: gewoon terug naar start overlay
        beep("tap");
        started = false;
        locked = true;
        clearAnswers();
        flashSvg.innerHTML = emptySvg();
        setPhase("phaseLook");
        startOverlay.style.display = "flex";
      });

      tuneBtn.addEventListener("click", () => {
        // nu nog minimal, later kan ik jouw lange press of panel toevoegen
        beep("tap");
        flashMs = SETTINGS.flashMsStart;
      });

      // init
      flashSvg.innerHTML = emptySvg();
      setPhase("phaseLook");
    })();
  </script>
</body>
</html>
