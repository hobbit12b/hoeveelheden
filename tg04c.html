<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;

      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);

      --line: rgba(245,180,152,0.85);
      --line2: rgba(245,180,152,0.55);

      --ok: #2fb36d;
      --no: #e44f6c;

      --scale: 1;

      /* Motion */
      --easeOut: cubic-bezier(.18,.84,.26,1);
      --easeInOut: cubic-bezier(.22,.61,.35,1);
      --slideMs: 720ms;

      /* Portrait tuning (smaller) */
      --flashPortraitScale: .86;
      --answersPortraitScale: .90;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    /* Layout: landscape split, portrait stacked */
    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }
    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 18px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }
    @media (orientation: portrait){
      .left{ padding: 22px; gap: 14px; }
    }

    .right{
      background:#ffffff;
      position: relative;
      overflow:hidden;
      min-height: 0;
      transition: background 120ms ease;
      display:flex;
      flex-direction:column;
    }
    @media (orientation: landscape){
      .right{ border-left: 6px solid var(--line); }
    }
    @media (orientation: portrait){
      .right{ border-top: 6px solid var(--line); }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      transition: transform 120ms var(--easeOut);
    }
    .homeBtn:active,
    .tuneBtn:active{ transform: translateY(1px) scale(0.99); }

    .homeBtn svg{ width: 42px; height: 42px; display:block; }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: 3px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      transition: background 160ms ease;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
    }
    @media (orientation: portrait){
      .gameCard{
        height: min(410px, 32vh);
      }
    }

    /* Inner “flash board” */
    .flashBoard{
      width: min(720px, 100%);
      height: min(420px, 100%);
      border-radius: 24px;
      border: 2px solid rgba(245,180,152,0.55);
      background: #ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    @media (orientation: portrait){
      .flashBoard{
        transform: scale(var(--flashPortraitScale));
      }
    }

    .flashSvg{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Right side content */
    .rightInner{
      position:relative;
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    @media (orientation: portrait){
      .rightInner{
        padding: 14px 16px 18px 16px;
      }
    }

    /* Mask line that hides sliding answers behind the midline */
    .maskLine{
      position:absolute;
      left:0;
      top:0;
      right:0;
      bottom:0;
      pointer-events:none;
      z-index: 20;
    }
    @media (orientation: landscape){
      .maskLine{
        background:
          linear-gradient(90deg,
            transparent 0,
            transparent calc(0px),
            transparent 100%);
      }
      /* The actual “mask slab” sits exactly on the midline, inside right panel */
      .maskLine::before{
        content:"";
        position:absolute;
        left:-6px; /* cover the border seam */
        top:0;
        width: 12px; /* a bit thicker to fully hide shadows */
        height:100%;
        background:#ffffff;
      }
    }
    @media (orientation: portrait){
      .maskLine::before{
        content:"";
        position:absolute;
        left:0;
        top:-6px; /* cover border seam */
        width:100%;
        height: 12px; /* thicker to hide shadows */
        background:#ffffff;
      }
    }

    /* Answer stack wrapper (we animate this behind the mask) */
    .answersWrap{
      width: min(560px, 94%);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      z-index: 10;
    }

    /* LANDSCAPE: buttons under each other, vertically centered */
    .answers{
      width: 100%;
      display:flex;
      flex-direction: column;
      gap: 14px;
      justify-content:center;   /* vertical centering inside answersWrap */
      align-items: stretch;
    }

    /* PORTRAIT: row */
    @media (orientation: portrait){
      .answersWrap{
        transform: scale(var(--answersPortraitScale));
      }
      .answers{
        flex-direction: row;
        gap: 12px;
        align-items: stretch;
      }
    }

    .ansBtn{
      appearance:none;
      border:none;
      background:#ffffff;
      border: 3px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.10);
      padding: 10px;
      min-height: 132px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      position:relative;

      /* smooth, “clickable” */
      transform: translateZ(0);
      transition:
        transform 180ms var(--easeOut),
        box-shadow 180ms var(--easeOut),
        border-color 180ms var(--easeOut);
      will-change: transform;
    }

    /* make portrait cards a bit smaller and more square */
    @media (orientation: portrait){
      .ansBtn{
        min-height: 150px; /* higher so they feel more square in portrait */
      }
    }

    .ansBtn:active{
      transform: translateY(2px) scale(0.995);
      box-shadow: 0 8px 16px rgba(0,0,0,0.10);
    }

    .ansBtn.pressHold{
      /* tiny press + soft rebound (done via keyframes on pointerdown) */
      animation: pressPop 240ms var(--easeOut) 1;
    }
    @keyframes pressPop{
      0%{ transform: translateY(0); }
      40%{ transform: translateY(2px); }
      100%{ transform: translateY(0); }
    }

    /* Feedback styles */
    .ansBtn.correct{
      border-color: rgba(47,179,109,0.55);
      box-shadow: 0 14px 28px rgba(47,179,109,0.10);
    }
    .ansBtn.wrong{
      border-color: rgba(228,79,108,0.55);
      box-shadow: 0 14px 28px rgba(228,79,108,0.10);
    }

    /* Do not show any default focus ring */
    .ansBtn:focus{ outline:none; }
    .ansBtn::-moz-focus-inner{ border:0; }

    /* SVG inside buttons */
    .ansInner{
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Slide animations: we animate each button, and also ensure they go behind the midline mask */
    .answersSlideOut .ansBtn{
      pointer-events:none;
    }

    /* Landscape slide left behind vertical midline */
    @media (orientation: landscape){
      .slideOut{
        animation: slideOutLeft var(--slideMs) var(--easeInOut) forwards;
      }
      .slideIn{
        animation: slideInLeft var(--slideMs) var(--easeInOut) forwards;
      }
      @keyframes slideOutLeft{
        0%{ transform: translateX(0); opacity: 1; }
        100%{ transform: translateX(-140%); opacity: 1; }
      }
      @keyframes slideInLeft{
        0%{ transform: translateX(140%); opacity: 1; }
        100%{ transform: translateX(0); opacity: 1; }
      }
    }

    /* Portrait slide up behind horizontal midline */
    @media (orientation: portrait){
      .slideOut{
        animation: slideOutUp var(--slideMs) var(--easeInOut) forwards;
      }
      .slideIn{
        animation: slideInUp var(--slideMs) var(--easeInOut) forwards;
      }
      @keyframes slideOutUp{
        0%{ transform: translateY(0); opacity: 1; }
        100%{ transform: translateY(-140%); opacity: 1; }
      }
      @keyframes slideInUp{
        0%{ transform: translateY(140%); opacity: 1; }
        100%{ transform: translateY(0); opacity: 1; }
      }
    }

    /* When answers are hidden (during flash) */
    .answersHidden{
      opacity:0;
      pointer-events:none;
    }

    /* Start overlay */
    .startOverlay{
      position:fixed;
      inset:0;
      background: rgba(253,238,234,0.55);
      backdrop-filter: blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      padding: 24px;
    }

    .startCard{
      width: min(560px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align:center;
    }

    .startCard h1{
      margin: 0 0 10px 0;
      font-size: 28px;
      color: #4d4a48;
      text-transform: lowercase;
    }

    .startCard p{
      margin: 0 0 16px 0;
      color: rgba(77,74,72,0.82);
      font-size: 18px;
      line-height: 1.35;
    }

    .startBtn{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 800;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      transition: transform 140ms var(--easeOut);
    }
    .startBtn:active{ transform: translateY(1px) scale(0.99); }

    /* Tune panel */
    .tunePanel{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(520px, calc(100vw - 36px));
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.16);
      border: 2px solid rgba(245,180,152,0.75);
      padding: 14px 14px 12px 14px;
      z-index: 1200;
      color: #4d4a48;
    }
    .tunePanel.hidden{ display:none; }
    .tuneHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tuneTitle{
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.2px;
      text-transform: lowercase;
    }
    .tuneClose{
      appearance:none;
      border:none;
      background:#f8c3b0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }
    .tuneClose:active{ transform: translateY(1px) scale(0.99); }
    .tuneRow{
      display:grid;
      grid-template-columns: 140px 1fr 84px;
      gap: 10px;
      align-items:center;
      margin: 8px 0;
    }
    .tuneLabel{
      font-weight: 800;
      font-size: 13px;
      color: rgba(77,74,72,0.86);
      text-transform: lowercase;
    }
    .tuneValue{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 13px;
      text-align:right;
      color: rgba(77,74,72,0.86);
    }
    .tuneRow input[type="range"]{ width: 100%; }

    .tuneButtons{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tuneBtnSmall{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 900;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      font-size: 14px;
    }
    .tuneBtnSmall.secondary{
      background:#f8c3b0;
      color:#4d4a48;
    }
    .tuneBtnSmall:active{ transform: translateY(1px) scale(0.99); }

    /* Utility */
    .hidden{ display:none !important; }

  </style>
</head>

<body>
  <section class="left" aria-label="Spel">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn" aria-label="Naar het menu" type="button">
        <!-- inline “home” icon -->
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10 28L32 10l22 18v26a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V28z" fill="rgba(255,255,255,.55)"/>
          <path d="M16 26.5L32 13.7l16 12.8v27.2H16V26.5z" fill="rgba(0,0,0,.10)"/>
          <path d="M26 54V38h12v16" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 30l20-16 20 16" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="tuneBtn" id="tuneBtn" aria-label="Instellen" type="button">⚙️</button>
      <div class="titlePill">slim kijken</div>
    </div>

    <div class="content">
      <div class="gameCard" id="gameCard" aria-label="Flitsbord">
        <div class="flashBoard" id="flashBoard">
          <div class="flashSvg" id="flashSvg"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="right" id="rightArea" aria-label="Antwoorden">
    <div class="rightInner">
      <div class="answersWrap" id="answersWrap">
        <div class="answers answersHidden" id="answers"></div>
      </div>

      <!-- midline mask -->
      <div class="maskLine" aria-hidden="true"></div>
    </div>
  </section>

  <div class="startOverlay" id="startOverlay" role="dialog" aria-modal="true" aria-label="Start">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Je ziet stippen heel kort, daarna kies je wat je zag.</p>
      <button class="startBtn" id="startBtn" type="button">Start</button>
    </div>
  </div>

  <div class="tunePanel hidden" id="tunePanel" role="dialog" aria-modal="false" aria-label="Instellingen">
    <div class="tuneHeader">
      <div class="tuneTitle">instellingen</div>
      <button class="tuneClose" id="tuneClose" aria-label="Sluiten" type="button">Sluit</button>
    </div>

    <div style="margin-top:6px; padding-top:10px; border-top:2px solid rgba(245,180,152,0.45);">
      <div class="tuneTitle" style="font-size:16px; margin-bottom:8px;">flitstijd</div>

      <div class="tuneRow">
        <div class="tuneLabel">ms</div>
        <input type="range" id="flashMsRange" min="350" max="1400" step="50" value="700" />
        <div class="tuneValue" id="flashMsValue">700</div>
      </div>

      <div class="tuneButtons">
        <button class="tuneBtnSmall secondary" id="newRoundBtn" type="button">Nieuwe ronde</button>
        <button class="tuneBtnSmall secondary" id="testWrongBtn" type="button">Test fout</button>
        <button class="tuneBtnSmall" id="testGoodBtn" type="button">Test goed</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
      const wait = (ms) => new Promise(r => setTimeout(r, ms));

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");

      const homeBtn = document.getElementById("homeBtn");
      const tuneBtn = document.getElementById("tuneBtn");
      const tunePanel = document.getElementById("tunePanel");
      const tuneClose = document.getElementById("tuneClose");

      const flashMsRange = document.getElementById("flashMsRange");
      const flashMsValue = document.getElementById("flashMsValue");

      const newRoundBtn = document.getElementById("newRoundBtn");
      const testWrongBtn = document.getElementById("testWrongBtn");
      const testGoodBtn = document.getElementById("testGoodBtn");

      const flashBoard = document.getElementById("flashBoard");
      const flashSvg = document.getElementById("flashSvg");

      const answersWrap = document.getElementById("answersWrap");
      const answersEl = document.getElementById("answers");

      // Simple beeps
      let audioCtx = null;
      function beep(type){
        try{
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          if(type === "ok") o.frequency.setValueAtTime(740, t);
          if(type === "no") o.frequency.setValueAtTime(220, t);
          if(type === "tap") o.frequency.setValueAtTime(520, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + (type==="ok"?0.12:0.18));
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t); o.stop(t + 0.22);
        }catch(e){}
      }

      // Dice dots positions (no mirroring, always same)
      const P = {
        tl:[0.25,0.25], tc:[0.50,0.25], tr:[0.75,0.25],
        ml:[0.25,0.50], mc:[0.50,0.50], mr:[0.75,0.50],
        bl:[0.25,0.75], bc:[0.50,0.75], br:[0.75,0.75]
      };
      const diceFaces = {
        1: [P.mc],
        2: [P.tl, P.br],
        3: [P.tl, P.mc, P.br],
        4: [P.tl, P.tr, P.bl, P.br],
        5: [P.tl, P.tr, P.mc, P.bl, P.br],
        6: [P.tl, P.ml, P.bl, P.tr, P.mr, P.br]
      };

      function svgForDots(dotSets, opts = {}){
        const {
          dotRadius = 11,
          dotColor = "rgba(25,25,25,.92)",
          stroke = "rgba(0,0,0,0)",
          strokeW = 0,
          glow = false
        } = opts;

        const w = 520, h = 380;
        const circles = [];
        dotSets.forEach((set) => {
          const box = set.box;
          set.dots.forEach(([x,y]) => {
            const X = (box.x0 + x*(box.x1-box.x0)) * w;
            const Y = (box.y0 + y*(box.y1-box.y0)) * h;
            circles.push({X,Y});
          });
        });

        const filter = glow ? `
          <defs>
            <filter id="g">
              <feGaussianBlur stdDeviation="2.1" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>` : "";

        const cs = circles.map(c => `
          <circle cx="${c.X.toFixed(1)}" cy="${c.Y.toFixed(1)}" r="${dotRadius}"
            fill="${dotColor}"
            stroke="${stroke}" stroke-width="${strokeW}"
            ${glow ? `filter="url(#g)"` : "" }
          />`).join("");

        return `
          <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" aria-hidden="true" role="img">
            ${filter}
            ${cs}
          </svg>`;
      }

      function patternLevel1(n){
        return [{
          dots: diceFaces[n],
          box: {x0:0.12, y0:0.12, x1:0.88, y1:0.88}
        }];
      }

      function setBoard(svgHtml){
        flashSvg.innerHTML = svgHtml;
      }

      function clearBoard(){
        setBoard(svgForDots([], {glow:false}));
      }

      function isPortrait(){
        return window.matchMedia && window.matchMedia("(orientation: portrait)").matches;
      }

      // GAME
      let started = false;
      let locked = false;
      let flashMs = 700;
      let currentCorrect = 1;

      function buildOptions(correct){
        const cap = 6;
        const options = new Set([correct]);
        while(options.size < 3){
          const delta = [ -2, -1, 1, 2 ][randInt(0,3)];
          const v = clamp(correct + delta, 1, cap);
          options.add(v);
        }
        // shuffle
        const arr = [...options];
        for(let i=arr.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [arr[i],arr[j]] = [arr[j],arr[i]];
        }
        return arr;
      }

      function renderAnswers(correct){
        const arr = buildOptions(correct);

        answersEl.innerHTML = "";
        arr.forEach(v => {
          const btn = document.createElement("button");
          btn.className = "ansBtn";
          btn.type = "button";

          // micro press + soft rebound
          btn.addEventListener("pointerdown", () => {
            btn.classList.remove("pressHold");
            // restart animation
            void btn.offsetWidth;
            btn.classList.add("pressHold");
          }, {passive:true});

          btn.addEventListener("click", () => onPick(btn, v));

          const svg = svgForDots(patternLevel1(v), {dotRadius: 12, glow:false});
          btn.innerHTML = `<div class="ansInner">${svg}</div>`;
          answersEl.appendChild(btn);
        });
      }

      function hideAnswers(){
        answersEl.classList.add("answersHidden");
      }
      function showAnswers(){
        answersEl.classList.remove("answersHidden");
      }

      async function slideAnswersOutSequential(){
        // order: right -> middle -> left
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        if(!btns.length) return;

        answersWrap.classList.add("answersSlideOut");
        // Determine order based on current visual order:
        // In portrait (row): left,middle,right are indices 0,1,2 -> out order 2,1,0
        // In landscape (column): top,mid,bottom -> we still want "right,middle,left" feel,
        // but you asked specifically that sequence to guide eyes, we keep 2,1,0 as well.
        const order = [2,1,0].filter(i => btns[i]);

        order.forEach((idx, k) => {
          const b = btns[idx];
          b.classList.remove("slideIn");
          b.classList.add("slideOut");
          b.style.animationDelay = `${k * 110}ms`;
        });

        // wait for last animation to finish
        const total = 110*(order.length-1) + parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slideMs")) || 720;
        await wait(total + 40);

        // cleanup
        btns.forEach(b => {
          b.classList.remove("slideOut");
          b.style.animationDelay = "0ms";
        });
        answersWrap.classList.remove("answersSlideOut");
      }

      async function slideAnswersInAll(){
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        if(!btns.length) return;

        // Put them just offscreen and slide in
        btns.forEach((b, i) => {
          b.classList.remove("slideOut");
          b.classList.add("slideIn");
          b.style.animationDelay = `${i * 70}ms`;
        });

        const base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slideMs")) || 720;
        const total = 70*(btns.length-1) + base;
        await wait(total + 40);

        btns.forEach(b => {
          b.classList.remove("slideIn");
          b.style.animationDelay = "0ms";
        });
      }

      async function flashSequence(){
        locked = true;

        // During flash: no answers visible
        hideAnswers();

        // small settle
        clearBoard();
        await wait(180);

        // flash
        setBoard(svgForDots(patternLevel1(currentCorrect), {dotRadius: 16, glow:false}));
        await wait(flashMs);

        // blank
        clearBoard();
        await wait(260);

        // show answers now
        renderAnswers(currentCorrect);
        showAnswers();

        // slide in gently every round (works both orientations)
        await slideAnswersInAll();

        locked = false;
      }

      function nextRound(){
        currentCorrect = randInt(1,6);
        flashSequence();
      }

      async function showExampleAndHold(choice){
        // Show what the child chose a bit longer, without any red frame
        setBoard(svgForDots(patternLevel1(choice), {dotRadius: 16, glow:false}));
        await wait(820);
        clearBoard();
      }

      async function onPick(btn, value){
        if(!started || locked) return;
        locked = true;

        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        btns.forEach(b => b.style.pointerEvents = "none");

        if(value === currentCorrect){
          beep("ok");
          btn.classList.add("correct");

          // show correct in board briefly
          setBoard(svgForDots(patternLevel1(currentCorrect), {dotRadius: 16, glow:false}));
          await wait(520);

          // slide answers out behind mask (direction depends on orientation)
          await slideAnswersOutSequential();

          // prepare next
          clearBoard();
          await wait(120);
          btns.forEach(b => { b.classList.remove("correct","wrong"); b.style.pointerEvents = ""; });

          nextRound();
          return;
        }

        // wrong
        beep("no");
        btn.classList.add("wrong");

        // show chosen example briefly, then show correct a bit too
        await showExampleAndHold(value);

        setBoard(svgForDots(patternLevel1(currentCorrect), {dotRadius: 16, glow:false}));
        await wait(720);
        clearBoard();

        // remove answers too (same slide out), then bring new
        await slideAnswersOutSequential();

        btns.forEach(b => { b.classList.remove("correct","wrong"); b.style.pointerEvents = ""; });
        await wait(120);

        nextRound();
      }

      // Settings
      function openTunePanel(){
        tunePanel.classList.remove("hidden");
      }
      function closeTunePanel(){
        tunePanel.classList.add("hidden");
      }

      tuneBtn.addEventListener("click", () => {
        beep("tap");
        if(tunePanel.classList.contains("hidden")) openTunePanel();
        else closeTunePanel();
      });
      tuneClose.addEventListener("click", () => {
        beep("tap");
        closeTunePanel();
      });

      flashMsRange.addEventListener("input", () => {
        flashMs = Number(flashMsRange.value);
        flashMsValue.textContent = String(flashMs);
      });

      newRoundBtn.addEventListener("click", () => {
        beep("tap");
        if(!started) return;
        nextRound();
      });
      testWrongBtn.addEventListener("click", () => {
        beep("tap");
        if(!started || locked) return;
        const wrong = currentCorrect === 6 ? 1 : currentCorrect + 1;
        const firstBtn = answersEl.querySelector(".ansBtn");
        if(firstBtn) onPick(firstBtn, wrong);
      });
      testGoodBtn.addEventListener("click", () => {
        beep("tap");
        if(!started || locked) return;
        const firstBtn = answersEl.querySelector(".ansBtn");
        if(firstBtn) onPick(firstBtn, currentCorrect);
      });

      // Start
      function startGame(){
        if(started) return;
        started = true;
        startOverlay.style.display = "none";
        flashMs = Number(flashMsRange.value);
        flashMsValue.textContent = String(flashMs);
        nextRound();
      }

      startBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        beep("tap");
        startGame();
      });
      startOverlay.addEventListener("click", (e) => {
        if(e.target === startOverlay){
          beep("tap");
          startGame();
        }
      });

      homeBtn.addEventListener("click", () => {
        beep("tap");
        try { window.location.href = "index.html"; } catch(e){}
      });

      // On rotate, re-run a soft “in” on answers so it stays smooth, no jolts
      let rotTimer = null;
      function onReflow(){
        if(!started) return;
        if(rotTimer) clearTimeout(rotTimer);
        rotTimer = setTimeout(async () => {
          // Re-render answers to match new layout
          renderAnswers(currentCorrect);
          showAnswers();
          await slideAnswersInAll();
        }, 180);
      }
      window.addEventListener("resize", onReflow);
      window.addEventListener("orientationchange", onReflow);

      // Init
      clearBoard();
      flashMsValue.textContent = String(flashMsRange.value);

    })();
  </script>
</body>
</html>
