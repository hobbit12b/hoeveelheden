<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;

      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);

      --border: rgba(245,180,152,0.90);
      --border-soft: rgba(245,180,152,0.55);

      --ok: rgba(46,196,122,0.95);
      --no: rgba(255,91,122,0.95);

      --slideDur: 360ms;
      --slideGap: 115ms;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }

    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 18px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }

    .right{
      background:#ffffff;
      position: relative;
      min-height: 0;
      overflow:hidden;
      transition: background 140ms ease;
    }

    /* middenlijn, solide */
    @media (orientation: landscape){
      .right{ border-left: 6px solid rgba(245,180,152,0.55); }
    }
    @media (orientation: portrait){
      .right{ border-top: 6px solid rgba(245,180,152,0.55); }
      .left{ padding: 22px; gap: 14px; }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      transition: transform 90ms ease;
    }
    .homeBtn:active,
    .tuneBtn:active{ transform: scale(0.98); }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .hud{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hudPill{
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(245,180,152,0.55);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      font-weight: 900;
      color: rgba(77,74,72,0.88);
      text-transform: lowercase;
      font-size: 14px;
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .hudPill b{ color: rgba(77,74,72,0.95); }

    .stars{
      display:flex;
      gap: 8px;
      align-items:center;
    }
    .star{
      width: 14px;
      height: 14px;
      border-radius: 99px;
      background: rgba(245,180,152,0.28);
      border: 2px solid rgba(245,180,152,0.55);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }
    .star.on{
      background: rgba(229,140,116,0.95);
      border-color: rgba(229,140,116,0.75);
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 8px 6px 6px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: 4px solid rgba(245,180,152,0.70); /* altijd neutraal */
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      transition: background 160ms ease;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    @media (orientation: portrait){
      .gameCard{ height: min(420px, 34vh); }
    }

    /* fase kleuren: subtiel via schaduw, niet via rand */
    body.phaseFlash .gameCard{ box-shadow: 0 10px 22px rgba(0,0,0,0.08), 0 0 0 6px rgba(229,140,116,0.18) inset; }
    body.phaseChoose .gameCard{ box-shadow: 0 10px 22px rgba(0,0,0,0.08), 0 0 0 6px rgba(245,180,152,0.16) inset; }
    body.phaseFeedbackGood .gameCard{ box-shadow: 0 10px 22px rgba(0,0,0,0.08), 0 0 0 6px rgba(46,196,122,0.16) inset; }
    body.phaseFeedbackWrong .gameCard{ box-shadow: 0 10px 22px rgba(0,0,0,0.08), 0 0 0 6px rgba(255,91,122,0.14) inset; }

    .gameCard.shake{ animation: wiggle 220ms ease; }
    @keyframes wiggle{
      0%{ transform: translateX(0); }
      28%{ transform: translateX(-6px); }
      58%{ transform: translateX(5px); }
      100%{ transform: translateX(0); }
    }

    .flashBoard{
      width: min(520px, 88%);
      aspect-ratio: 1.35 / 1;
      border-radius: 26px;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(245,180,152,0.45); /* altijd neutraal */
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      box-shadow: 0 14px 26px rgba(0,0,0,0.06);
      outline: none;
    }
    .flashSvg{ width:100%; height:100%; }

    .rightInner{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0; /* padding gaat naar maskViewport zodat cliprand exact op middenlijn kan liggen */
    }

    .maskViewport{
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 26px;
    }

    /* cruciaal: geen padding aan de middenlijn kant */
    @media (orientation: landscape){
      .maskViewport{ padding: 26px 26px 26px 0; } /* geen padding links, cliprand is de middenlijn */
    }
    @media (orientation: portrait){
      .maskViewport{ padding: 0 26px 26px 26px; } /* geen padding boven, cliprand is de middenlijn */
    }

    .answersSurface{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      will-change: transform;
    }

    .rightWrap{
      width: min(860px, 96%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 14px;
    }

    .answerGrid{
      width: 100%;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      transition: opacity 140ms ease, transform 140ms ease;
      will-change: opacity, transform;
    }

    @media (max-width: 560px){
      .answerGrid{ grid-template-columns: 1fr; gap: 14px; }
    }

    .answersHidden .answerGrid{
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    .answersShown .answerGrid{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .ansBtn{
      appearance:none;
      border: 4px solid rgba(245,180,152,0.78);
      background: rgba(255,255,255,0.98);
      border-radius: 22px;
      box-shadow: 0 16px 28px rgba(0,0,0,0.11);
      padding: 14px;
      min-height: 130px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transform: translate3d(0,0,0);
      transition: transform 90ms ease, box-shadow 140ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease, filter 140ms ease;
      position:relative;
      overflow:hidden;
      will-change: transform, opacity;
    }

    .ansBtn:active{
      transform: translate3d(0,2px,0) scale(0.985);
      box-shadow: 0 12px 22px rgba(0,0,0,0.10);
    }

    .ansBtn.correct{
      border-color: var(--ok);
      background: rgba(46,196,122,0.10);
    }
    .ansBtn.wrong{
      border-color: var(--no);
      background: rgba(255,91,122,0.10);
    }

    .ansBtn.dim{
      opacity: 0.25;
      filter: grayscale(0.15);
    }

    .ansBtn.reveal{
      opacity: 0;
      transform: translate3d(0,12px,0) scale(0.985);
      animation: popIn 220ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    @keyframes popIn{
      0%{ opacity:0; transform: translate3d(0,12px,0) scale(0.985); }
      70%{ opacity:1; transform: translate3d(0,-2px,0) scale(1.01); }
      100%{ opacity:1; transform: translate3d(0,0,0) scale(1); }
    }

    .startOverlay{
      position:fixed;
      inset:0;
      background: rgba(253,238,234,0.55);
      backdrop-filter: blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      padding: 24px;
    }

    .startCard{
      width: min(600px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align:center;
    }

    .startCard h1{
      margin: 0 0 10px 0;
      font-size: 28px;
      color: #4d4a48;
      text-transform: lowercase;
      font-weight: 950;
    }

    .startCard p{
      margin: 0 0 16px 0;
      color: rgba(77,74,72,0.82);
      font-size: 18px;
      line-height: 1.35;
    }

    .startBtn{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 950;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      text-transform: lowercase;
    }
    .startBtn:active{ transform: scale(0.99); }

    .tunePanel{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(540px, calc(100vw - 36px));
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.16);
      border: 2px solid rgba(245,180,152,0.75);
      padding: 14px 14px 12px 14px;
      z-index: 1200;
      color: #4d4a48;
    }
    .tunePanel.hidden{ display:none; }

    .tuneHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tuneTitle{
      font-weight: 950;
      font-size: 18px;
      letter-spacing: 0.2px;
      text-transform: lowercase;
    }
    .tuneClose{
      appearance:none;
      border:none;
      background:#f8c3b0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 950;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }
    .tuneClose:active{ transform: scale(0.99); }

    .tuneRow{
      display:grid;
      grid-template-columns: 170px 1fr 90px;
      gap: 10px;
      align-items:center;
      margin: 8px 0;
    }
    .tuneLabel{
      font-weight: 900;
      font-size: 13px;
      color: rgba(77,74,72,0.86);
      text-transform: lowercase;
    }
    .tuneValue{
      font-variant-numeric: tabular-nums;
      font-weight: 950;
      font-size: 13px;
      text-align:right;
      color: rgba(77,74,72,0.86);
    }
    .tuneRow input[type="range"]{ width: 100%; }

    .tuneButtons{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tuneBtnSmall{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 950;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      font-size: 14px;
      text-transform: lowercase;
    }
    .tuneBtnSmall.secondary{
      background:#f8c3b0;
      color:#4d4a48;
    }
    .tuneBtnSmall:active{ transform: scale(0.99); }

    .tuneHint{
      margin-top: 8px;
      font-size: 12px;
      color: rgba(77,74,72,0.68);
      line-height: 1.35;
    }
  </style>
</head>

<body class="answersHidden">
  <section class="left" aria-label="Opgave">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn" aria-label="Naar begin" type="button">🏠</button>
      <button class="tuneBtn" id="tuneBtn" aria-label="Instellingen" type="button">⚙️</button>
      <div class="titlePill">slim kijken</div>
    </div>

    <div class="hud">
      <div class="hudPill"><span>level</span> <b id="hudLevel">1</b> <span>•</span> <span>tijd</span> <b id="hudMs">800</b><span>ms</span></div>
      <div class="hudPill"><span>ronde</span> <b id="hudRound">1</b></div>
      <div class="stars" id="stars" aria-label="Sterren">
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
      </div>
    </div>

    <div class="content">
      <div class="gameCard" id="gameCard" aria-label="Flitskaart">
        <div class="flashBoard" id="flashBoard">
          <div class="flashSvg" id="flashSvg"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="right" aria-label="Antwoorden">
    <div class="rightInner">
      <div class="maskViewport" id="maskViewport">
        <div class="answersSurface">
          <div class="rightWrap">
            <div class="answerGrid" id="answerGrid" aria-label="Keuzes"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="startOverlay" id="startOverlay" role="dialog" aria-modal="true" aria-label="Start">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Je ziet stippen heel kort. Als ze weg zijn, kies je wat je zag.</p>
      <button class="startBtn" id="startBtn" type="button">start</button>
    </div>
  </div>

  <div class="tunePanel hidden" id="tunePanel" role="dialog" aria-modal="false" aria-label="Instellingen">
    <div class="tuneHeader">
      <div class="tuneTitle">instellingen</div>
      <button class="tuneClose" id="tuneClose" aria-label="Sluiten" type="button">sluit</button>
    </div>

    <div style="margin-top:6px; padding-top:10px; border-top:2px solid rgba(245,180,152,0.45);">
      <div class="tuneTitle" style="font-size:16px; margin-bottom:8px;">spel</div>

      <div class="tuneRow">
        <div class="tuneLabel">level</div>
        <input type="range" id="levelRange" min="1" max="2" step="1" value="1" />
        <div class="tuneValue" id="levelValue">1</div>
      </div>

      <div class="tuneRow">
        <div class="tuneLabel">level 1 max</div>
        <input type="range" id="l1MaxRange" min="3" max="6" step="1" value="4" />
        <div class="tuneValue" id="l1MaxValue">4</div>
      </div>

      <div class="tuneRow">
        <div class="tuneLabel">flitstijd start</div>
        <input type="range" id="flashStartRange" min="450" max="1200" step="50" value="800" />
        <div class="tuneValue" id="flashStartValue">800</div>
      </div>

      <div class="tuneRow">
        <div class="tuneLabel">flitstijd minimum</div>
        <input type="range" id="flashMinRange" min="250" max="650" step="25" value="450" />
        <div class="tuneValue" id="flashMinValue">450</div>
      </div>

      <div class="tuneRow">
        <div class="tuneLabel">flitstijd maximum</div>
        <input type="range" id="flashMaxRange" min="900" max="2000" step="50" value="1600" />
        <div class="tuneValue" id="flashMaxValue">1600</div>
      </div>

      <div class="tuneButtons">
        <button class="tuneBtnSmall" id="newRoundBtn" type="button">nieuwe ronde</button>
        <button class="tuneBtnSmall secondary" id="resetBtn" type="button">reset</button>
        <button class="tuneBtnSmall secondary" id="testSlideBtn" type="button">test schuif</button>
      </div>

      <div class="tuneHint">
        Spiegeling staat uit. Patronen houden dezelfde oriëntatie.
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
      const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const wait = (ms) => new Promise(r => setTimeout(r, ms));

      const LS_KEY = "slimkijken_subitize_v5";
      const defaultData = {
        level: 1,
        l1Max: 4,
        flashStart: 800,
        flashMin: 450,
        flashMax: 1600,
        stars: 0,
        streak: 0,
        round: 1
      };

      function loadData(){
        try{
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return structuredClone(defaultData);
          const d = JSON.parse(raw);
          return { ...structuredClone(defaultData), ...d };
        }catch(e){
          return structuredClone(defaultData);
        }
      }
      function saveData(){
        try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
      }

      let DATA = loadData();

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");
      const homeBtn = document.getElementById("homeBtn");
      const tuneBtn = document.getElementById("tuneBtn");

      const tunePanel = document.getElementById("tunePanel");
      const tuneClose = document.getElementById("tuneClose");

      const levelRange = document.getElementById("levelRange");
      const levelValue = document.getElementById("levelValue");

      const l1MaxRange = document.getElementById("l1MaxRange");
      const l1MaxValue = document.getElementById("l1MaxValue");

      const flashStartRange = document.getElementById("flashStartRange");
      const flashStartValue = document.getElementById("flashStartValue");

      const flashMinRange = document.getElementById("flashMinRange");
      const flashMinValue = document.getElementById("flashMinValue");

      const flashMaxRange = document.getElementById("flashMaxRange");
      const flashMaxValue = document.getElementById("flashMaxValue");

      const newRoundBtn = document.getElementById("newRoundBtn");
      const resetBtn = document.getElementById("resetBtn");
      const testSlideBtn = document.getElementById("testSlideBtn");

      const flashSvg = document.getElementById("flashSvg");
      const answerGrid = document.getElementById("answerGrid");
      const gameCard = document.getElementById("gameCard");
      const maskViewport = document.getElementById("maskViewport");

      const hudLevel = document.getElementById("hudLevel");
      const hudMs = document.getElementById("hudMs");
      const hudRound = document.getElementById("hudRound");
      const starsEl = document.getElementById("stars");

      let audioCtx = null;
      function beep(type){
        try{
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();

          o.type = "sine";
          if(type === "ok") o.frequency.setValueAtTime(740, t);
          if(type === "no") o.frequency.setValueAtTime(220, t);
          if(type === "tap") o.frequency.setValueAtTime(520, t);

          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + (type==="ok"?0.12:0.18));

          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(t);
          o.stop(t + 0.22);
        }catch(e){}
      }

      function setPhase(name){
        document.body.classList.remove("phaseFlash","phaseChoose","phaseFeedbackGood","phaseFeedbackWrong");
        if (name) document.body.classList.add(name);
      }

      function showAnswers(show){
        document.body.classList.toggle("answersShown", !!show);
        document.body.classList.toggle("answersHidden", !show);
      }

      function setStars(n){
        DATA.stars = clamp(n, 0, 5);
        const nodes = [...starsEl.querySelectorAll(".star")];
        nodes.forEach((s, i) => s.classList.toggle("on", i < DATA.stars));
      }

      const CURRENT = {
        started: false,
        locked: false,
        flashMs: DATA.flashStart,
        correct: 1,
        cap: 4
      };

      function updateHud(){
        hudLevel.textContent = String(DATA.level);
        hudRound.textContent = String(DATA.round);
        hudMs.textContent = String(Math.round(CURRENT.flashMs));
      }

      function emptySvg(){
        return `<svg viewBox="0 0 520 380" width="100%" height="100%" aria-hidden="true"></svg>`;
      }

      /* patronen, geen spiegeling, geen rotatie */
      const P = {
        tl:[0.25,0.25], tc:[0.50,0.25], tr:[0.75,0.25],
        ml:[0.25,0.50], mc:[0.50,0.50], mr:[0.75,0.50],
        bl:[0.25,0.75], bc:[0.50,0.75], br:[0.75,0.75]
      };

      const diceFaces = {
        1: [P.mc],
        2: [P.tl, P.br],
        3: [P.tl, P.mc, P.br],
        4: [P.tl, P.tr, P.bl, P.br],
        5: [P.tl, P.tr, P.mc, P.bl, P.br],
        6: [P.tl, P.ml, P.bl, P.tr, P.mr, P.br]
      };

      function svgForDots(points, opts = {}){
        const {
          dotRadius = 14,
          dotColor = "rgba(77,74,72,0.78)",
          glow = false
        } = opts;

        const w = 520, h = 380;
        const box = {x0:0.12, y0:0.12, x1:0.88, y1:0.88};

        const filter = glow ? `
          <defs>
            <filter id="g">
              <feGaussianBlur stdDeviation="2.2" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>` : "";

        const circles = (points || []).map(([x,y]) => {
          const X = (box.x0 + x*(box.x1-box.x0)) * w;
          const Y = (box.y0 + y*(box.y1-box.y0)) * h;
          return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${dotRadius}" fill="${dotColor}" ${glow ? `filter="url(#g)"` : "" } />`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" aria-hidden="true" role="img">${filter}${circles}</svg>`;
      }

      function svgLevel1(n, glow=false, radius=14){
        return svgForDots(diceFaces[n] || [], { dotRadius: radius, glow });
      }

      function svgLevel2(sum, glow=false, radius=14){
        const big = Math.min(6, Math.max(2, Math.ceil(sum/2)));
        const small = sum - big;
        const bb = Math.max(big, small);
        const ss = Math.min(big, small);

        const left = (diceFaces[bb] || []).map(([x,y]) => [x * 0.46 + 0.10, y * 0.64 + 0.18]);
        const right = (diceFaces[ss] || []).map(([x,y]) => [x * 0.46 + 0.52, y * 0.64 + 0.18]);
        return svgForDots(left.concat(right), { dotRadius: radius, glow });
      }

      function computeCap(){
        if (DATA.level === 1) return clamp(DATA.l1Max, 3, 6);
        return 9;
      }

      function buildOptions(correct, cap){
        const opts = new Set([correct]);
        const deltas = [-1, 1, -2, 2, -1, 1];
        while(opts.size < 3){
          const d = choose(deltas);
          const v = clamp(correct + d, 1, cap);
          opts.add(v);
        }
        const arr = [...opts];
        for(let i=arr.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [arr[i],arr[j]] = [arr[j],arr[i]];
        }
        return arr;
      }

      function applySettingsToCurrent(){
        CURRENT.cap = computeCap();
        CURRENT.flashMs = clamp(CURRENT.flashMs, DATA.flashMin, DATA.flashMax);
      }

      function clearAnswers(){
        answerGrid.innerHTML = "";
      }

      function renderAnswers(options){
        clearAnswers();
        options.forEach((v, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ansBtn reveal";
          btn.style.animationDelay = `${idx * 90}ms`;
          btn.setAttribute("aria-label", `antwoord ${v}`);

          let innerSvg = "";
          if (DATA.level === 1) innerSvg = svgLevel1(v, false, 14);
          else innerSvg = svgLevel2(v, false, 14);

          btn.innerHTML = `<div style="width:100%; height:100%;">${innerSvg}</div>`;
          btn.addEventListener("click", () => onPick(btn, v));
          answerGrid.appendChild(btn);
        });
      }

      function dimOtherButtons(keepBtn){
        const all = [...answerGrid.querySelectorAll(".ansBtn")];
        all.forEach(b => { if (b !== keepBtn) b.classList.add("dim"); });
      }

      function updateAdaptiveOnCorrect(){
        DATA.streak = (DATA.streak || 0) + 1;
        if (DATA.streak >= 2){
          CURRENT.flashMs = clamp(CURRENT.flashMs - 70, DATA.flashMin, DATA.flashMax);
          DATA.streak = 0;
        }
        setStars((DATA.stars || 0) + 1);
        if (DATA.stars >= 5) setStars(0);
      }

      function updateAdaptiveOnWrong(){
        DATA.streak = 0;
        CURRENT.flashMs = clamp(CURRENT.flashMs + 160, DATA.flashMin, DATA.flashMax);
      }

      function isPortrait(){
        return window.matchMedia && window.matchMedia("(orientation: portrait)").matches;
      }

      function orderButtonsForSlide(){
        const btns = [...answerGrid.querySelectorAll(".ansBtn")];
        const items = btns.map(b => {
          const r = b.getBoundingClientRect();
          return { b, left: r.left, top: r.top };
        });

        if (!isPortrait()){
          items.sort((a,c) => (c.left - a.left) || (a.top - c.top));   /* rechts, midden, links */
        } else {
          items.sort((a,c) => (c.top - a.top) || (c.left - a.left));   /* onder, midden, boven */
        }
        return items.map(x => x.b);
      }

      async function slideOutAnswers(){
        const ordered = orderButtonsForSlide();
        const dur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slideDur")) || 360;
        const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slideGap")) || 115;

        const view = maskViewport.getBoundingClientRect();
        const extra = 18;

        for (const b of ordered){
          b.style.pointerEvents = "none";
          b.classList.remove("reveal");
        }

        for (let i = 0; i < ordered.length; i++){
          const b = ordered[i];
          const r = b.getBoundingClientRect();

          if (!isPortrait()){
            /* landscape, naar links, volledig over de cliprand */
            const dx = -((r.right - view.left) + extra);
            b.animate(
              [{ transform: "translate3d(0,0,0)" }, { transform: `translate3d(${dx}px,0,0)` }],
              { duration: dur, easing: "cubic-bezier(.2,.9,.2,1)", fill: "forwards" }
            );
          } else {
            /* portrait, omhoog, volledig over de cliprand */
            const dy = -((r.bottom - view.top) + extra);
            b.animate(
              [{ transform: "translate3d(0,0,0)" }, { transform: `translate3d(0,${dy}px,0)` }],
              { duration: dur, easing: "cubic-bezier(.2,.9,.2,1)", fill: "forwards" }
            );
          }

          await wait(gap);
        }

        await wait(dur + 10);
      }

      function pickCorrect(){
        applySettingsToCurrent();
        if (DATA.level === 1) return randInt(1, CURRENT.cap);
        return randInt(1, 9);
      }

      function emptyBoard(){ flashSvg.innerHTML = emptySvg(); }

      function showCorrectExample(glowOn){
        if (DATA.level === 1){
          flashSvg.innerHTML = svgLevel1(CURRENT.correct, !!glowOn, 14);
        } else {
          flashSvg.innerHTML = svgLevel2(CURRENT.correct, !!glowOn, 14);
        }
      }

      async function doRound(){
        CURRENT.locked = true;
        applySettingsToCurrent();
        updateHud();

        showAnswers(false);
        clearAnswers();

        emptyBoard();
        setPhase(null);
        await wait(220);

        CURRENT.correct = pickCorrect();

        setPhase("phaseFlash");
        showCorrectExample(true);
        await wait(CURRENT.flashMs);

        emptyBoard();
        await wait(300);

        setPhase("phaseChoose");
        renderAnswers(buildOptions(CURRENT.correct, CURRENT.cap));
        showAnswers(true);

        CURRENT.locked = false;
      }

      async function onPick(btn, value){
        if (!CURRENT.started || CURRENT.locked) return;
        CURRENT.locked = true;

        const correct = CURRENT.correct;

        if (value === correct){
          beep("ok");
          setPhase("phaseFeedbackGood");
          btn.classList.add("correct");

          /* korte bevestiging in het midden */
          setPhase("phaseFlash");
          showCorrectExample(true);
          await wait(420);

          emptyBoard();

          await slideOutAnswers();

          showAnswers(false);
          clearAnswers();

          updateAdaptiveOnCorrect();
          DATA.round += 1;
          saveData();
          updateHud();

          await wait(140);
          await doRound();
          return;
        }

        /* fout */
        beep("no");
        setPhase("phaseFeedbackWrong");
        btn.classList.add("wrong");
        dimOtherButtons(btn);

        gameCard.classList.remove("shake");
        void gameCard.offsetHeight;
        gameCard.classList.add("shake");

        updateAdaptiveOnWrong();
        saveData();
        updateHud();

        /* jouw keuze langer laten staan */
        await wait(950);

        /* nu pas het voorbeeld tonen, zonder rode rand context */
        setPhase("phaseFlash");
        showCorrectExample(true);
        await wait(1000);

        /* opnieuw */
        showAnswers(false);
        await wait(220);

        emptyBoard();
        await wait(240);

        setPhase("phaseFlash");
        showCorrectExample(true);
        await wait(clamp(CURRENT.flashMs + 260, DATA.flashMin, DATA.flashMax));

        emptyBoard();
        await wait(280);

        setPhase("phaseChoose");
        renderAnswers(buildOptions(correct, CURRENT.cap));
        showAnswers(true);

        CURRENT.locked = false;
      }

      /* instellingen */
      function syncTuneUI(){
        levelRange.value = String(DATA.level);
        levelValue.textContent = String(DATA.level);

        l1MaxRange.value = String(DATA.l1Max);
        l1MaxValue.textContent = String(DATA.l1Max);

        flashStartRange.value = String(DATA.flashStart);
        flashStartValue.textContent = String(DATA.flashStart);

        flashMinRange.value = String(DATA.flashMin);
        flashMinValue.textContent = String(DATA.flashMin);

        flashMaxRange.value = String(DATA.flashMax);
        flashMaxValue.textContent = String(DATA.flashMax);
      }

      function commitTune(which){
        DATA.level = Number(levelRange.value) || 1;
        DATA.l1Max = Number(l1MaxRange.value) || 4;

        DATA.flashStart = Number(flashStartRange.value) || 800;
        DATA.flashMin = Number(flashMinRange.value) || 450;
        DATA.flashMax = Number(flashMaxRange.value) || 1600;

        if (DATA.flashMin > DATA.flashMax){
          const tmp = DATA.flashMin;
          DATA.flashMin = DATA.flashMax;
          DATA.flashMax = tmp;
        }

        if (which === "flashStart") CURRENT.flashMs = DATA.flashStart;

        saveData();
        syncTuneUI();
        applySettingsToCurrent();
        updateHud();
      }

      function openTunePanel(){
        tunePanel.classList.remove("hidden");
        syncTuneUI();
      }
      function closeTunePanel(){
        tunePanel.classList.add("hidden");
      }

      levelRange.addEventListener("input", () => commitTune("level"));
      l1MaxRange.addEventListener("input", () => commitTune("l1Max"));
      flashStartRange.addEventListener("input", () => commitTune("flashStart"));
      flashMinRange.addEventListener("input", () => commitTune("flashMin"));
      flashMaxRange.addEventListener("input", () => commitTune("flashMax"));

      tuneBtn.addEventListener("click", () => {
        beep("tap");
        if (tunePanel.classList.contains("hidden")) openTunePanel();
        else closeTunePanel();
      });
      tuneClose.addEventListener("click", () => {
        beep("tap");
        closeTunePanel();
      });

      newRoundBtn.addEventListener("click", async () => {
        beep("tap");
        if (!CURRENT.started) return;
        CURRENT.locked = true;
        showAnswers(false);
        clearAnswers();
        emptyBoard();
        await wait(200);
        await doRound();
      });

      resetBtn.addEventListener("click", () => {
        beep("tap");
        DATA = structuredClone(defaultData);
        saveData();

        CURRENT.flashMs = DATA.flashStart;
        DATA.round = 1;
        DATA.stars = 0;
        DATA.streak = 0;

        syncTuneUI();
        setStars(0);
        updateHud();
      });

      testSlideBtn.addEventListener("click", async () => {
        beep("tap");
        showAnswers(true);
        setPhase("phaseChoose");
        renderAnswers([1,2,3]);
        await wait(320);
        await slideOutAnswers();
        showAnswers(false);
        clearAnswers();
        setPhase(null);
      });

      homeBtn.addEventListener("click", () => {
        beep("tap");
        CURRENT.started = false;
        CURRENT.locked = true;
        clearAnswers();
        emptyBoard();
        showAnswers(false);
        setPhase(null);
        startOverlay.style.display = "flex";
      });

      function startGame(){
        if (CURRENT.started) return;
        CURRENT.started = true;

        startOverlay.style.display = "none";
        beep("tap");

        CURRENT.flashMs = DATA.flashStart;
        DATA.round = 1;
        DATA.streak = 0;
        setStars(0);

        applySettingsToCurrent();
        updateHud();

        doRound();
      }

      startBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        startGame();
      });

      startOverlay.addEventListener("click", (e) => {
        if (e.target === startOverlay) startGame();
      });

      /* init */
      flashSvg.innerHTML = emptySvg();
      showAnswers(false);
      setPhase(null);

      applySettingsToCurrent();
      setStars(DATA.stars || 0);
      updateHud();
      syncTuneUI();
    })();
  </script>
</body>
</html>
