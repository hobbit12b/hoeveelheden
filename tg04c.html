<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;

      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);

      --border: rgba(245,180,152,0.90);
      --border-soft: rgba(245,180,152,0.55);

      --ok: rgba(46,196,122,0.95);
      --no: rgba(255,91,122,0.95);

      --slideDur: 260ms;
      --slideGap: 90ms;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }

    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 22px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }

    .right{
      background:#ffffff;
      position: relative;
      min-height: 0;
      overflow:hidden;
      transition: background 140ms ease;
    }

    @media (orientation: landscape){
      .right{ border-left: 6px solid rgba(245,180,152,0.55); }
    }
    @media (orientation: portrait){
      .right{ border-top: 6px solid rgba(245,180,152,0.55); }
      .left{ padding: 22px; gap: 16px; }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      transition: transform 90ms ease;
    }
    .homeBtn:active,
    .tuneBtn:active{ transform: scale(0.98); }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: 4px solid rgba(245,180,152,0.70);
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      transition: background 160ms ease, border-color 160ms ease;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    @media (orientation: portrait){
      .gameCard{ height: min(420px, 34vh); }
    }

    body.phaseFlash .gameCard{ border-color: rgba(229,140,116,0.85); }
    body.phaseChoose .gameCard{ border-color: rgba(245,180,152,0.85); }

    .gameCard.shake{ animation: wiggle 220ms ease; }
    @keyframes wiggle{
      0%{ transform: translateX(0); }
      28%{ transform: translateX(-6px); }
      58%{ transform: translateX(5px); }
      100%{ transform: translateX(0); }
    }

    .flashBoard{
      width: min(520px, 88%);
      aspect-ratio: 1.35 / 1;
      border-radius: 26px;
      background: rgba(255,255,255,0.92);
      border: 2px solid var(--border-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      box-shadow: 0 14px 26px rgba(0,0,0,0.06);
    }
    .flashSvg{ width:100%; height:100%; }

    .rightInner{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px;
      overflow:hidden;
    }

    .rightWrap{
      width: min(780px, 92%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 12px;
    }

    .answerGrid{
      width: 100%;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      transition: opacity 140ms ease, transform 140ms ease;
      will-change: opacity, transform;
    }

    @media (max-width: 520px){
      .answerGrid{ grid-template-columns: 1fr; }
    }

    .answersHidden .answerGrid{
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    .answersShown .answerGrid{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .ansBtn{
      appearance:none;
      border: 4px solid rgba(245,180,152,0.75);
      background: rgba(255,255,255,0.98);
      border-radius: 22px;
      box-shadow: 0 16px 28px rgba(0,0,0,0.11);
      padding: 14px;
      min-height: 130px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transform: translate3d(0,0,0);
      transition: transform 90ms ease, box-shadow 140ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease;
      position:relative;
      overflow:hidden;
      will-change: transform, opacity;
    }

    .ansBtn:active{
      transform: translate3d(0,2px,0) scale(0.985);
      box-shadow: 0 12px 22px rgba(0,0,0,0.10);
    }

    .ansBtn.correct{
      border-color: var(--ok);
      background: rgba(46,196,122,0.10);
    }
    .ansBtn.wrong{
      border-color: var(--no);
      background: rgba(255,91,122,0.10);
    }

    .ansBtn.dim{
      opacity: 0.25;
      filter: grayscale(0.15);
    }

    .ansBtn.reveal{
      opacity: 0;
      transform: translate3d(0,12px,0) scale(0.985);
      animation: popIn 220ms cubic-bezier(.2,.9,.2,1) forwards;
    }
    @keyframes popIn{
      0%{ opacity:0; transform: translate3d(0,12px,0) scale(0.985); }
      70%{ opacity:1; transform: translate3d(0,-2px,0) scale(1.01); }
      100%{ opacity:1; transform: translate3d(0,0,0) scale(1); }
    }

    /* Belangrijk: slide moet altijd winnen van reveal */
    .ansBtn.slideLeft{ animation: slideLeft var(--slideDur) cubic-bezier(.2,.9,.2,1) forwards !important; }
    .ansBtn.slideUp{ animation: slideUp var(--slideDur) cubic-bezier(.2,.9,.2,1) forwards !important; }

    @keyframes slideLeft{
      from{ transform: translate3d(0,0,0); opacity: 1; }
      to{ transform: translate3d(-140vw,0,0); opacity: 0; }
    }

    @keyframes slideUp{
      from{ transform: translate3d(0,0,0); opacity: 1; }
      to{ transform: translate3d(0,-140vh,0); opacity: 0; }
    }

    .startOverlay{
      position:fixed;
      inset:0;
      background: rgba(253,238,234,0.55);
      backdrop-filter: blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 999;
      padding: 24px;
    }

    .startCard{
      width: min(560px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align:center;
    }

    .startCard h1{
      margin: 0 0 10px 0;
      font-size: 28px;
      color: #4d4a48;
      text-transform: lowercase;
      font-weight: 900;
    }

    .startCard p{
      margin: 0 0 16px 0;
      color: rgba(77,74,72,0.82);
      font-size: 18px;
      line-height: 1.35;
    }

    .startBtn{
      appearance:none;
      border:none;
      background: var(--brand);
      color:#fff;
      font-weight: 900;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      text-transform: lowercase;
    }
    .startBtn:active{ transform: scale(0.99); }
  </style>
</head>

<body class="answersHidden">
  <section class="left" aria-label="Opgave">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn" aria-label="Naar begin" type="button">🏠</button>
      <button class="tuneBtn" id="tuneBtn" aria-label="Reset tempo" type="button">⚙️</button>
      <div class="titlePill">slim kijken</div>
    </div>

    <div class="content">
      <div class="gameCard" id="gameCard" aria-label="Flitskaart">
        <div class="flashBoard" id="flashBoard">
          <div class="flashSvg" id="flashSvg"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="right" aria-label="Antwoorden">
    <div class="rightInner">
      <div class="rightWrap">
        <div class="answerGrid" id="answerGrid" aria-label="Keuzes"></div>
      </div>
    </div>
  </section>

  <div class="startOverlay" id="startOverlay" role="dialog" aria-modal="true" aria-label="Start">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Je ziet stippen heel kort, daarna kies je wat je zag.</p>
      <button class="startBtn" id="startBtn" type="button">start</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
      const msFromCssVar = (name, fallback) => {
        const raw = getComputedStyle(document.documentElement).getPropertyValue(name) || "";
        const n = parseFloat(raw);
        return Number.isFinite(n) ? n : fallback;
      };

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("startBtn");
      const homeBtn = document.getElementById("homeBtn");
      const tuneBtn = document.getElementById("tuneBtn");

      const flashSvg = document.getElementById("flashSvg");
      const answerGrid = document.getElementById("answerGrid");
      const gameCard = document.getElementById("gameCard");

      const SETTINGS = {
        flashMsStart: 800,
        minMs: 450,
        maxMs: 1600,

        wrongChoiceHoldMs: 900,
        showCorrectBoardMs: 950,
        wrongPauseAfterMs: 220,

        correctHoldMs: 420,
        afterSlidePauseMs: 140
      };

      let audioCtx = null;
      function beep(type){
        try{
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();

          o.type = "sine";
          if(type === "ok") o.frequency.setValueAtTime(740, t);
          if(type === "no") o.frequency.setValueAtTime(220, t);
          if(type === "tap") o.frequency.setValueAtTime(520, t);

          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + (type==="ok"?0.12:0.18));

          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(t);
          o.stop(t + 0.22);
        }catch(e){}
      }

      function setPhase(name){
        document.body.classList.remove("phaseFlash","phaseChoose");
        if (name) document.body.classList.add(name);
      }

      function showAnswers(show){
        document.body.classList.toggle("answersShown", !!show);
        document.body.classList.toggle("answersHidden", !show);
      }

      const P = {
        tl:[0.25,0.25], tc:[0.50,0.25], tr:[0.75,0.25],
        ml:[0.25,0.50], mc:[0.50,0.50], mr:[0.75,0.50],
        bl:[0.25,0.75], bc:[0.50,0.75], br:[0.75,0.75]
      };
      const diceFaces = {
        1: [P.mc],
        2: [P.tl, P.br],
        3: [P.tl, P.mc, P.br],
        4: [P.tl, P.tr, P.bl, P.br],
        5: [P.tl, P.tr, P.mc, P.bl, P.br],
        6: [P.tl, P.ml, P.bl, P.tr, P.mr, P.br]
      };

      function svgForDots(n, opts = {}){
        const { dotRadius = 12, dotColor = "rgba(77,74,72,0.78)", glow = false } = opts;

        const w = 520, h = 380;
        const dots = diceFaces[n] || [];
        const box = {x0:0.12, y0:0.12, x1:0.88, y1:0.88};

        const filter = glow ? `
          <defs>
            <filter id="g">
              <feGaussianBlur stdDeviation="2.2" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>` : "";

        const circles = dots.map(([x,y]) => {
          const X = (box.x0 + x*(box.x1-box.x0)) * w;
          const Y = (box.y0 + y*(box.y1-box.y0)) * h;
          return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${dotRadius}" fill="${dotColor}" ${glow ? `filter="url(#g)"` : "" } />`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" aria-hidden="true" role="img">${filter}${circles}</svg>`;
      }

      function emptySvg(){
        return `<svg viewBox="0 0 520 380" width="100%" height="100%" aria-hidden="true"></svg>`;
      }

      function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

      let started = false;
      let locked = false;
      let flashMs = SETTINGS.flashMsStart;
      let currentCorrect = 1;

      function buildOptions(correct){
        const cap = 6;
        const opts = new Set([correct]);
        while(opts.size < 3){
          const delta = [-2,-1,1,2][randInt(0,3)];
          opts.add(clamp(correct + delta, 1, cap));
        }
        const arr = [...opts];
        for(let i=arr.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [arr[i],arr[j]] = [arr[j],arr[i]];
        }
        return arr;
      }

      function clearAnswers(){ answerGrid.innerHTML = ""; }

      function renderAnswers(options){
        clearAnswers();
        options.forEach((v, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ansBtn reveal";
          btn.style.animationDelay = `${idx * 90}ms`;
          btn.setAttribute("aria-label", `antwoord ${v}`);
          btn.innerHTML = `<div style="width:100%; height:100%;">${svgForDots(v, {dotRadius:12})}</div>`;
          btn.addEventListener("click", () => onPick(btn, v));
          answerGrid.appendChild(btn);
        });
      }

      function dimOtherButtons(keepBtn){
        const all = [...answerGrid.querySelectorAll(".ansBtn")];
        all.forEach(b => { if (b !== keepBtn) b.classList.add("dim"); });
      }

      function isPortrait(){
        return window.innerHeight >= window.innerWidth;
      }

      function slideAxisClass(){
        return isPortrait() ? "slideUp" : "slideLeft";
      }

      function orderButtonsForSlide(){
        const btns = [...answerGrid.querySelectorAll(".ansBtn")];
        const items = btns.map(b => {
          const r = b.getBoundingClientRect();
          return { b, left: r.left, top: r.top };
        });

        if (!isPortrait()){
          items.sort((a,c) => (c.left - a.left) || (a.top - c.top));
        } else {
          items.sort((a,c) => (c.top - a.top) || (c.left - a.left));
        }
        return items.map(x => x.b);
      }

      async function slideOutAnswers(){
        const axis = slideAxisClass();
        const ordered = orderButtonsForSlide();
        const dur = msFromCssVar("--slideDur", 260);
        const gap = msFromCssVar("--slideGap", 90);

        ordered.forEach(b => {
          b.style.pointerEvents = "none";
          b.classList.remove("reveal");
          b.classList.remove("slideLeft","slideUp");
          b.style.animationDelay = "0ms";
        });

        void answerGrid.offsetHeight;

        for (let i = 0; i < ordered.length; i++){
          const btn = ordered[i];
          btn.classList.add(axis);
          await wait(dur + (i < ordered.length - 1 ? gap : 0));
        }
      }

      async function doRound(){
        locked = true;

        showAnswers(false);
        clearAnswers();

        flashSvg.innerHTML = emptySvg();
        setPhase(null);
        await wait(240);

        currentCorrect = randInt(1,6);

        setPhase("phaseFlash");
        flashSvg.innerHTML = svgForDots(currentCorrect, {dotRadius:14, glow:true});
        await wait(flashMs);

        flashSvg.innerHTML = emptySvg();
        await wait(300);

        setPhase("phaseChoose");
        renderAnswers(buildOptions(currentCorrect));
        showAnswers(true);

        locked = false;
      }

      async function onPick(btn, value){
        if (!started || locked) return;
        locked = true;

        const correct = currentCorrect;

        if (value === correct){
          beep("ok");
          btn.classList.add("correct");

          flashSvg.innerHTML = svgForDots(correct, {dotRadius:14, glow:true});
          await wait(SETTINGS.correctHoldMs);
          flashSvg.innerHTML = emptySvg();

          await slideOutAnswers();

          showAnswers(false);
          clearAnswers();

          flashMs = clamp(flashMs - 60, SETTINGS.minMs, SETTINGS.maxMs);

          await wait(SETTINGS.afterSlidePauseMs);
          await doRound();
          return;
        }

        beep("no");
        btn.classList.add("wrong");
        dimOtherButtons(btn);

        gameCard.classList.remove("shake");
        void gameCard.offsetHeight;
        gameCard.classList.add("shake");

        flashMs = clamp(flashMs + 140, SETTINGS.minMs, SETTINGS.maxMs);

        await wait(SETTINGS.wrongChoiceHoldMs);

        flashSvg.innerHTML = svgForDots(correct, {dotRadius:14, glow:true});
        await wait(SETTINGS.showCorrectBoardMs);

        showAnswers(false);
        await wait(SETTINGS.wrongPauseAfterMs);

        flashSvg.innerHTML = emptySvg();
        await wait(260);

        setPhase("phaseFlash");
        flashSvg.innerHTML = svgForDots(correct, {dotRadius:14, glow:true});
        await wait(Math.min(SETTINGS.maxMs, flashMs + 260));

        flashSvg.innerHTML = emptySvg();
        await wait(280);

        setPhase("phaseChoose");
        renderAnswers(buildOptions(correct));
        showAnswers(true);
        locked = false;
      }

      function startGame(){
        if (started) return;
        started = true;
        startOverlay.style.display = "none";
        beep("tap");
        doRound();
      }

      startBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); startGame(); });
      startOverlay.addEventListener("click", (e) => { if (e.target === startOverlay) startGame(); });

      homeBtn.addEventListener("click", () => {
        beep("tap");
        started = false;
        locked = true;
        clearAnswers();
        flashSvg.innerHTML = emptySvg();
        showAnswers(false);
        setPhase(null);
        startOverlay.style.display = "flex";
      });

      tuneBtn.addEventListener("click", () => {
        beep("tap");
        flashMs = SETTINGS.flashMsStart;
      });

      window.addEventListener("orientationchange", () => {
        // alleen voor correcte richting bij de volgende animatie
      });

      flashSvg.innerHTML = emptySvg();
      showAnswers(false);
      setPhase(null);
    })();
  </script>
</body>
</html>
