<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rekenreis, index</title>

  <style>
    :root{
      --gap: clamp(14px, 3.0vmin, 28px);

      --card-w: clamp(300px, 42vw, 560px);
      --card-h: calc(var(--card-w) * 0.88);

      --banner-h: clamp(86px, 14vmin, 150px);

      /* zachte, vriendelijke focuskleur */
      --focus: rgba(255, 255, 255, 0.45);
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }

    body{
      margin: 0;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      background: #a8d8ff;
      color: #fff;
    }

    /* Achtergrond als aparte laag zodat we parallax kunnen doen */
    .bg{
      position: fixed;
      inset: 0;
      background-image: url("background_liggend.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translate3d(0,0,0) scale(1.04);
      will-change: transform;
      z-index: 0;
    }
    @media (orientation: portrait){
      .bg{ background-image: url("background_staand.png"); }
      :root{
        --card-w: clamp(280px, 44vw, 520px);
      }
    }

    /* Contrastlaag */
    .vignette{
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 700px at 50% 45%, rgba(255,255,255,0.12), rgba(0,0,0,0.08) 60%, rgba(0,0,0,0.18) 100%);
      mix-blend-mode: multiply;
      z-index: 1;
    }

    /* Header met banner zoals in je voorbeeld */
    header{
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 50%;
      transform: translateX(-50%);
      width: min(980px, calc(100vw - (var(--gap) * 2)));
      height: var(--banner-h);
      display: grid;
      place-items: center;
      z-index: 3;
      pointer-events: none;
    }
    .ribbon{
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 18px 20px rgba(0,0,0,0.22));
    }
    .ribbon img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .ribbon .title{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: clamp(34px, 5.2vmin, 56px);
      letter-spacing: 0.5px;
      text-shadow:
        0 6px 16px rgba(0,0,0,0.25),
        0 2px 0 rgba(0,0,0,0.18);
    }
    /* zachte glans over de banner */
    .ribbon::after{
      content:"";
      position: absolute;
      inset: 8px 10px;
      border-radius: 32px;
      background: linear-gradient(110deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.28) 48%, rgba(255,255,255,0) 70%);
      transform: translateX(-120%);
      opacity: 0.9;
      animation: ribbonShine 5.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes ribbonShine{
      0%{ transform: translateX(-120%); opacity: 0.0; }
      18%{ opacity: 0.9; }
      38%{ transform: translateX(120%); opacity: 0.0; }
      100%{ transform: translateX(120%); opacity: 0.0; }
    }

    main{
      position: fixed;
      inset: 0;
      z-index: 2;

      padding:
        calc(env(safe-area-inset-top, 0px) + var(--banner-h) + 14px)
        calc(env(safe-area-inset-right, 0px) + var(--gap))
        calc(env(safe-area-inset-bottom, 0px) + var(--gap))
        calc(env(safe-area-inset-left, 0px) + var(--gap));

      display: grid;
      place-items: center;
    }

    .grid{
      width: min(1320px, 100%);
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: var(--gap);
      align-items: center;
      justify-items: center;
    }

    /* Kaarten zoals in je layout */
    .card{
      width: var(--card-w);
      max-width: 100%;
      aspect-ratio: 1.14 / 1;
      position: relative;
      border-radius: 34px;
      outline: none;
      text-decoration: none;
      display: grid;
      place-items: center;

      transform: translateZ(0);
      transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
      box-shadow: 0 26px 40px rgba(0,0,0,0.22);
    }

    .card img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.18));
      border-radius: 34px;
    }

    /* Extra knop gevoel: rand en glans */
    .card::before{
      content:"";
      position: absolute;
      inset: 10px;
      border-radius: 26px;
      border: 3px solid rgba(255,255,255,0.55);
      opacity: 0.55;
      pointer-events: none;
    }
    .card::after{
      content:"";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(115deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.28) 45%, rgba(255,255,255,0) 70%);
      transform: translateX(-120%) skewX(-12deg);
      opacity: 0;
      pointer-events: none;
    }

    /* Hover en focus feedback */
    @media (hover: hover){
      .card:hover{
        transform: translateY(-6px) scale(1.02);
        filter: saturate(1.04) brightness(1.02);
        box-shadow: 0 34px 54px rgba(0,0,0,0.24);
      }
      .card:hover::after{
        opacity: 1;
        animation: shine 750ms ease-out 1;
      }
    }
    @keyframes shine{
      0%{ transform: translateX(-120%) skewX(-12deg); }
      100%{ transform: translateX(120%) skewX(-12deg); }
    }

    .card:active{
      transform: translateY(2px) scale(0.99);
      filter: brightness(0.99);
    }

    .card:focus-visible{
      box-shadow:
        0 26px 40px rgba(0,0,0,0.22),
        0 0 0 8px var(--focus);
    }

    /* Kleine, levende glinsters in de lucht */
    .float-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }
    .float{
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(255,255,255,0.3) 55%, rgba(255,255,255,0) 75%);
      opacity: 0.0;
      animation: drift var(--dur) linear infinite;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.12));
    }
    @keyframes drift{
      0%   { transform: translate3d(var(--x), calc(100vh + 40px), 0) scale(var(--s)); opacity: 0.0; }
      10%  { opacity: 0.85; }
      85%  { opacity: 0.75; }
      100% { transform: translate3d(calc(var(--x) + var(--dx)), -60px, 0) scale(calc(var(--s) * 1.2)); opacity: 0.0; }
    }

    /* Klik en tik effect zoals magie */
    .fx-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .sparkle{
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(255,255,255,0.25) 55%, rgba(255,255,255,0) 75%);
      transform: translate(-50%, -50%);
      animation: pop 520ms ease-out forwards;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.14));
    }
    .sparkle::after{
      content:"";
      position: absolute;
      inset: -3px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      opacity: 0.85;
    }
    @keyframes pop{
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
      18%  { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s)); }
    }
    .ring{
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.55);
      transform: translate(-50%, -50%);
      opacity: 0.85;
      animation: ring 520ms ease-out forwards;
    }
    @keyframes ring{
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      20%  { opacity: 0.9; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(5.3); }
    }

    @media (prefers-reduced-motion: reduce){
      .ribbon::after, .float, .sparkle, .ring{ animation: none; display: none; }
      .bg{ transform: none; }
      .card{ transition: none; }
    }
  </style>
</head>

<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header aria-hidden="true">
    <div class="ribbon">
      <img src="banner_index.png" alt="" />
      <div class="title">Index</div>
    </div>
  </header>

  <main>
    <section class="grid" aria-label="Kies een spel">
      <a class="card" href="tg07.html" aria-label="Tovergetallen">
        <img src="tovergetallen.png" alt="Tovergetallen" />
      </a>

      <a class="card" href="tg8.html" aria-label="Bellenblazen">
        <img src="bellenblazen.png" alt="Bellenblazen" />
      </a>

      <a class="card" href="tg05.html" aria-label="Cijferreeksen">
        <img src="cijferreeksen.png" alt="Cijferreeksen" />
      </a>

      <a class="card" href="tg04.html" aria-label="Slim tellen">
        <img src="slim%20tellen.png" alt="Slim tellen" />
      </a>
    </section>
  </main>

  <div class="float-layer" id="float" aria-hidden="true"></div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <script>
    const bg = document.getElementById("bg");
    const floatLayer = document.getElementById("float");
    const fx = document.getElementById("fx");

    /* Parallax die heel subtiel meebeweegt met je muis, touch blijft rustig */
    let px = 0, py = 0;
    window.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const nx = (e.clientX / window.innerWidth)  - 0.5;
      const ny = (e.clientY / window.innerHeight) - 0.5;
      px = nx; py = ny;
    }, { passive: true });

    function animateBg(){
      if (bg){
        const tx = (px * 10).toFixed(2);
        const ty = (py * 10).toFixed(2);
        bg.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(1.04)`;
      }
      requestAnimationFrame(animateBg);
    }
    animateBg();

    /* Zachte, zwevende glinsters */
    function spawnFloat(){
      if (!floatLayer) return;
      const el = document.createElement("div");
      el.className = "float";
      const x = Math.random() * window.innerWidth;
      const dx = (Math.random() - 0.5) * 140;
      const s  = 0.7 + Math.random() * 1.1;
      const dur = 7 + Math.random() * 7;

      el.style.setProperty("--x", x.toFixed(1) + "px");
      el.style.setProperty("--dx", dx.toFixed(1) + "px");
      el.style.setProperty("--s", s.toFixed(2));
      el.style.setProperty("--dur", dur.toFixed(2) + "s");

      floatLayer.appendChild(el);
      setTimeout(() => el.remove(), (dur * 1000) + 200);
    }
    for (let i = 0; i < 12; i++) spawnFloat();
    setInterval(spawnFloat, 850);

    /* Klikglitters */
    function sparkleAt(x, y){
      if (!fx) return;

      const ring = document.createElement("div");
      ring.className = "ring";
      ring.style.left = x + "px";
      ring.style.top  = y + "px";
      fx.appendChild(ring);
      setTimeout(() => ring.remove(), 560);

      const count = 12;
      for (let i = 0; i < count; i++){
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = x + "px";
        s.style.top  = y + "px";

        const angle = (Math.PI * 2) * (i / count) + (Math.random() * 0.35);
        const dist  = 26 + Math.random() * 34;

        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        s.style.setProperty("--dx", dx.toFixed(1) + "px");
        s.style.setProperty("--dy", dy.toFixed(1) + "px");
        s.style.setProperty("--s", (0.7 + Math.random() * 0.7).toFixed(2));

        fx.appendChild(s);
        setTimeout(() => s.remove(), 560);
      }
    }

    /* Mini bel klankje zonder bestanden */
    let audioReady = false;
    let ctx;
    function chime(){
      try{
        if (!audioReady){
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          audioReady = true;
        }
        const now = ctx.currentTime;

        const o1 = ctx.createOscillator();
        const o2 = ctx.createOscillator();
        const g  = ctx.createGain();

        o1.type = "sine";
        o2.type = "triangle";

        o1.frequency.setValueAtTime(880, now);
        o2.frequency.setValueAtTime(1320, now);

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.14, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

        o1.connect(g);
        o2.connect(g);
        g.connect(ctx.destination);

        o1.start(now);
        o2.start(now);
        o1.stop(now + 0.24);
        o2.stop(now + 0.24);
      }catch(err){
        // stilte is ook ok
      }
    }

    /* Interactie op kaarten */
    document.querySelectorAll(".card").forEach((a) => {
      a.addEventListener("pointerenter", (e) => {
        if (e.pointerType !== "mouse") return;
        const r = a.getBoundingClientRect();
        sparkleAt(r.left + r.width * 0.18, r.top + r.height * 0.25);
      });

      a.addEventListener("click", (e) => {
        e.preventDefault();

        const r = a.getBoundingClientRect();
        sparkleAt(r.left + r.width / 2, r.top + r.height / 2);
        chime();

        const href = a.getAttribute("href");
        setTimeout(() => { window.location.href = href; }, 170);
      });
    });

    /* Tikglitters overal, kleine dosis */
    let lastFx = 0;
    window.addEventListener("pointerdown", (e) => {
      const now = Date.now();
      if (now - lastFx < 180) return;
      lastFx = now;
      sparkleAt(e.clientX, e.clientY);
    }, { passive: true });
  </script>
</body>
</html>
