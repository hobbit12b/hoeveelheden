<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tellen en scannen</title>

<style>
:root{
  --bg-left:#fdeeea;
  --brand:#e58c74;
  --text:#6f6b68;
  --card-radius:28px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  margin:0;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  user-select:none;
  background:#fff;
}

body{
  display:grid;
  grid-template-columns:58fr 42fr;
}
@media(orientation:portrait){
  body{grid-template-columns:1fr;grid-template-rows:54fr 46fr;}
}

.left{
  background:var(--bg-left);
  padding:26px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.scan-surface{
  background:#fff;
  position:relative;
}
@media(orientation:landscape){
  .scan-surface{border-left:6px dashed rgba(245,180,152,0.85);}
}
@media(orientation:portrait){
  .scan-surface{border-top:6px dashed rgba(245,180,152,0.85);}
}

.topbar{
  display:flex;
  align-items:center;
  gap:16px;
}

.homeBtn,.tuneBtn{
  width:72px;height:72px;
  border-radius:18px;
  background:#f8c3b0;
  border:none;
  box-shadow:0 8px 18px rgba(0,0,0,0.1);
  display:grid;
  place-items:center;
  cursor:pointer;
}
.homeBtn img{width:42px;}

.titlePill{
  padding:18px 44px;
  border-radius:22px;
  background:var(--brand);
  color:#fff;
  font-weight:800;
  font-size:clamp(22px,2.1vw,34px);
}

.content{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gameCard{
  width:100%;
  max-width:980px;
  height:100%;
  max-height:520px;
  background:#fff;
  border:4px dashed rgba(245,180,152,0.85);
  border-radius:var(--card-radius);
  position:relative;
  overflow:hidden;
  transition:background 220ms ease;
}
.gameCard.flash-wrong{
  background:#fde1e1;
}

canvas{
  position:absolute;
  inset:0;
}

.successGif{
  position:absolute;
  left:50%;
  bottom:14%;
  transform:translateX(-50%);
  width:260px;
  opacity:0;
  pointer-events:none;
  transition:opacity 160ms ease;
  z-index:50;
}
.successGif.show{opacity:1;}

.startOverlay{
  position:fixed;
  inset:0;
  background:rgba(253,238,234,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.startCard{
  background:#fff;
  padding:24px;
  border-radius:24px;
  text-align:center;
}

.startBtn{
  background:var(--brand);
  color:#fff;
  border:none;
  border-radius:18px;
  padding:14px 20px;
  font-size:18px;
  font-weight:800;
}
</style>
</head>

<body>

<section class="left">
  <div class="topbar">
    <button class="homeBtn"><img src="home.png"></button>
    <button class="tuneBtn">⚙️</button>
    <div class="titlePill">tellen en scannen</div>
  </div>

  <div class="content">
    <div class="gameCard" id="gameCard">
      <canvas id="canvas"></canvas>
      <img id="successGif" class="successGif" src="bellen_blazen02.gif">
    </div>
  </div>
</section>

<section class="scan-surface"></section>

<div class="startOverlay" id="startOverlay">
  <div class="startCard">
    <h2>Tik om te starten</h2>
    <button class="startBtn" id="startBtn">Start</button>
  </div>
</div>

<script>
/* ---------- BASIS ---------- */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const card=document.getElementById('gameCard');
const gif=document.getElementById('successGif');

const popSound=new Audio('audio/plopgeluid.mp3');
const countSounds=[1,2,3,4,5,6,7,8,9].map(n=>new Audio(`audio/${n}.mp3`));

let items=[];
let target=0;
let wrongTries=0;
let started=false;

/* ---------- RESIZE ---------- */
function resize(){
  const r=card.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

/* ---------- ITEMS ---------- */
function spawnItems(n){
  items=[];
  for(let i=0;i<n;i++){
    items.push({
      x:80+Math.random()*(canvas.width-160),
      y:80+Math.random()*(canvas.height-160),
      r:36,
      counted:false,
      ring:false
    });
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  items.forEach(it=>{
    ctx.beginPath();
    ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
    ctx.fillStyle='#9ad0ff';
    ctx.fill();

    if(it.counted){
      ctx.strokeStyle='rgba(255,255,255,0.9)';
      ctx.lineWidth=6;
      ctx.stroke();
    }
    if(it.ring){
      ctx.strokeStyle='#ff9a9a';
      ctx.lineWidth=4;
      ctx.stroke();
    }
  });
  requestAnimationFrame(draw);
}

/* ---------- FEEDBACK ---------- */
function flashWrong(){
  card.classList.add('flash-wrong');
  setTimeout(()=>card.classList.remove('flash-wrong'),240);
}

async function countOutLoud(){
  for(let i=0;i<items.length;i++){
    items[i].ring=true;
    countSounds[i].currentTime=0;
    countSounds[i].play();
    await new Promise(r=>setTimeout(r,650));
  }
}

/* ---------- ANTWOORD ---------- */
async function goodAnswer(){
  gif.src='bellen_blazen02.gif';
  gif.classList.add('show');

  await new Promise(r=>setTimeout(r,3200));

  gif.src='bel_barst.gif';
  popSound.currentTime=0;
  popSound.play();

  await new Promise(r=>setTimeout(r,900));

  gif.classList.remove('show');
  nextRound();
}

async function wrongAnswer(){
  flashWrong();
  wrongTries++;

  if(wrongTries>=3){
    await countOutLoud();
    nextRound();
  }
}

/* ---------- RONDE ---------- */
function nextRound(){
  wrongTries=0;
  target=1+Math.floor(Math.random()*5);
  spawnItems(target);
}

/* ---------- INPUT ---------- */
canvas.addEventListener('pointerdown',e=>{
  if(!started)return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;
  items.forEach(it=>{
    if(Math.hypot(it.x-x,it.y-y)<it.r+20){
      it.counted=!it.counted;
    }
  });
});

/* ---------- START ---------- */
document.getElementById('startBtn').onclick=()=>{
  started=true;
  document.getElementById('startOverlay').style.display='none';
  resize();
  spawnItems(3);
  draw();
};
</script>
</body>
</html>
