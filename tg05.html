<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tellen en scannen</title>

<style>
html,body{
  margin:0; height:100%; overflow:hidden;
  font-family: system-ui, sans-serif;
}
body{
  display:grid;
  grid-template-columns: 60% 40%;
}
.left{
  background:#fdeeea;
  padding:20px;
}
.scan{
  background:#fff;
  border-left:6px dashed #f5b498;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#777;
}
.card{
  background:#fff;
  border-radius:24px;
  border:4px dashed #f5b498;
  height:100%;
  position:relative;
}
canvas{
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div class="left">
  <div class="card">
    <canvas id="game"></canvas>
  </div>
</div>

<div class="scan">
  Leg het houten cijfer hier
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

/* assets */
const images = {
  ster: loadImg('ster.png'),
  blad: loadImg('blad.png'),
  lieveheersbeestje: loadImg('lieveheersbeestje.png'),
  bubble: loadImg('bubble.png')
};

function loadImg(src){
  const i = new Image();
  i.src = src;
  return i;
}

/* items */
let items = [];

function randomItem(){
  const kinds = ['ster','blad','lieveheersbeestje'];
  return kinds[Math.floor(Math.random()*kinds.length)];
}

function generateItems(count){
  items = [];
  for(let i=0;i<count;i++){
    items.push({
      x: Math.random()*canvas.width*0.8 + canvas.width*0.1,
      y: Math.random()*canvas.height*0.7 + canvas.height*0.15,
      r: Math.min(canvas.width,canvas.height)*0.07,
      rot: (Math.random()-0.5)*0.9,
      kind: randomItem(),
      counted:false,
      wobble:0
    });
  }
}

generateItems(Math.floor(Math.random()*9)+1);

/* draw */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  items.forEach(it=>{
    const img = images[it.kind];
    if(!img.complete) return;

    ctx.save();
    ctx.translate(it.x,it.y);
    ctx.rotate(it.rot + it.wobble);

    ctx.shadowColor='rgba(0,0,0,0.25)';
    ctx.shadowBlur=14;
    ctx.shadowOffsetX=4;
    ctx.shadowOffsetY=6;

    const size = it.r*2.2;
    ctx.drawImage(img,-size/2,-size/2,size,size);

    ctx.shadowColor='transparent';

    if(it.counted){
      const b = images.bubble;
      if(b.complete){
        ctx.globalAlpha=0.9;
        ctx.drawImage(b,-size*0.6,-size*0.6,size*1.2,size*1.2);
        ctx.globalAlpha=1;
      }
    }

    ctx.restore();
  });
}

/* animation loop */
function loop(){
  items.forEach(it=>{
    if(it.wobble!==0){
      it.wobble *= 0.7;
      if(Math.abs(it.wobble)<0.001) it.wobble=0;
    }
  });
  draw();
  requestAnimationFrame(loop);
}
loop();

/* interaction */
canvas.addEventListener('pointerdown',e=>{
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  items.forEach(it=>{
    if(it.counted) return;
    const d = Math.hypot(it.x-x,it.y-y);
    if(d < it.r){
      it.counted = true;

      /* wiebel + pop */
      it.wobble = (Math.random()>0.5?1:-1)*0.35;
    }
  });
});
</script>

</body>
</html>
