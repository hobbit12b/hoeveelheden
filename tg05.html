<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tellen en scannen</title>

<style>
:root{
  --bg-left:#fdeeea;
  --brand:#e58c74;
  --text:#6f6b68;
  --card-radius:28px;
  --scale:1;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  margin:0;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  user-select:none;
  background:#fff;
}

body{
  display:grid;
  grid-template-columns:58fr 42fr;
}

@media(orientation:portrait){
  body{grid-template-columns:1fr;grid-template-rows:54fr 46fr;}
}

.left{
  background:var(--bg-left);
  padding:26px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.scan-surface{
  background:#fff;
  position:relative;
}

@media(orientation:landscape){
  .scan-surface{border-left:6px dashed rgba(245,180,152,0.85);}
}
@media(orientation:portrait){
  .scan-surface{border-top:6px dashed rgba(245,180,152,0.85);}
}

.topbar{
  display:flex;
  align-items:center;
  gap:16px;
}

.homeBtn,.tuneBtn{
  width:72px;height:72px;
  border-radius:18px;
  background:#f8c3b0;
  border:none;
  box-shadow:0 8px 18px rgba(0,0,0,0.1);
  display:grid;
  place-items:center;
  cursor:pointer;
}

.homeBtn img{width:42px;height:42px;}

.titlePill{
  padding:18px 44px;
  border-radius:22px;
  background:var(--brand);
  color:#fff;
  font-weight:800;
  font-size:clamp(22px,2.1vw,34px);
}

.content{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gameCard{
  width:100%;
  height:100%;
  max-width:980px;
  max-height:520px;
  background:#fff;
  border:4px dashed rgba(245,180,152,0.85);
  border-radius:var(--card-radius);
  position:relative;
}

@media(orientation:portrait){
  .gameCard{max-height:420px;}
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.successGif{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:260px;
  opacity:0;
  pointer-events:none;
  z-index:50;
  transition:opacity 200ms ease;
}
.successGif.show{opacity:1;}

.scanOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
  color:#777;
  font-size:22px;
}

.startOverlay{
  position:fixed;
  inset:0;
  background:rgba(253,238,234,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.startCard{
  background:#fff;
  padding:24px;
  border-radius:24px;
  text-align:center;
}

.startBtn{
  background:var(--brand);
  color:#fff;
  border:none;
  border-radius:18px;
  padding:14px 20px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>

<body>

<section class="left">
  <div class="topbar">
    <button class="homeBtn"><img src="home.png"></button>
    <div class="titlePill">tellen en scannen</div>
  </div>

  <div class="content">
    <div class="gameCard" id="gameCard">
      <canvas id="countCanvas"></canvas>
      <img id="successGif" class="successGif" src="bellen_blazen02.gif">
    </div>
  </div>
</section>

<section class="scan-surface">
  <div class="scanOverlay">
    Leg het houten cijfer hier
  </div>
</section>

<div class="startOverlay" id="startOverlay">
  <div class="startCard">
    <h2>Tik om te starten</h2>
    <p>Tel de dingen en scan het juiste cijfer.</p>
    <button class="startBtn" id="startBtn">Start</button>
  </div>
</div>

<script>
/* ---------- AUDIO ---------- */
const PLOP_SRC='audio/plopgeluid.mp3';
const goodAudio=new Audio('goed.mp3');
const wrongAudio=new Audio('fout.mp3');

let audioCtx=null,plopBuffer=null;

async function initAudio(){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  audioCtx=new Ctx();
  const r=await fetch(PLOP_SRC);
  const b=await r.arrayBuffer();
  plopBuffer=await audioCtx.decodeAudioData(b);
}

function playPlop(){
  if(!audioCtx||!plopBuffer)return;
  const src=audioCtx.createBufferSource();
  src.buffer=plopBuffer;
  src.connect(audioCtx.destination);
  src.start();
}

/* ---------- CANVAS ---------- */
const canvas=document.getElementById('countCanvas');
const ctx=canvas.getContext('2d');
const card=document.getElementById('gameCard');

function resize(){
  const r=card.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  relayout();
}
window.addEventListener('resize',()=>setTimeout(resize,200));
window.addEventListener('orientationchange',()=>setTimeout(resize,300));

const imgs={
  ster:new Image(),
  blad:new Image(),
  lieve:new Image(),
  bubble:new Image()
};
imgs.ster.src='ster.png';
imgs.blad.src='blad.png';
imgs.lieve.src='lieveheersbeestje.png';
imgs.bubble.src='bubble.png';

let items=[];

function rand(a,b){return a+Math.random()*(b-a);}
function genItems(n){
  items=[];
  const r=card.getBoundingClientRect();
  for(let i=0;i<n;i++){
    items.push({
      x:rand(80,r.width-80),
      y:rand(80,r.height-80),
      r:rand(36,44),
      rot:rand(-1.5,1.5),
      kind:['ster','blad','lieve'][Math.floor(Math.random()*3)],
      counted:false,
      float:false,
      pop:false,
      popT:0
    });
  }
}

function relayout(){
  if(!items.length)return;
  const r=card.getBoundingClientRect();
  items.forEach(it=>{
    it.x=Math.min(r.width-60,Math.max(60,it.x));
    it.y=Math.min(r.height-60,Math.max(60,it.y));
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const now=performance.now();

  items=items.filter(it=>{
    if(it.float){
      it.y-=1.4;
      it.x+=Math.sin(now/300+it.x)*0.3;
      if(it.y<-100)return false;
    }
    return true;
  });

  items.forEach(it=>{
    const img=imgs[it.kind];
    ctx.save();
    ctx.translate(it.x,it.y);
    ctx.rotate(it.rot);
    ctx.shadowColor='rgba(0,0,0,0.3)';
    ctx.shadowBlur=14;
    ctx.shadowOffsetY=6;
    ctx.drawImage(img,-it.r,-it.r,it.r*2,it.r*2);
    ctx.restore();

    if(it.counted){
      ctx.drawImage(imgs.bubble,it.x-it.r*1.2,it.y-it.r*1.2,it.r*2.4,it.r*2.4);
    }
    if(it.pop){
      playPlop();
      it.pop=false;
    }
  });

  requestAnimationFrame(draw);
}

/* ---------- GAME ---------- */
let started=false;
const successGif=document.getElementById('successGif');

function goodAnswer(){
  successGif.src='bellen_blazen02.gif';
  successGif.classList.add('show');

  setTimeout(()=>{
    successGif.src='bel_barst.gif';
  },3000);

  setTimeout(()=>{
    successGif.classList.remove('show');
  },3900);

  items.forEach(it=>{
    if(it.counted){
      it.float=true;
    }
  });

  setTimeout(nextRound,1800);
}

function wrongAnswer(){
  items.forEach(it=>{
    if(it.counted){
      it.pop=true;
      it.counted=false;
    }
  });
}

canvas.addEventListener('pointerdown',e=>{
  if(!started)return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;
  items.forEach(it=>{
    if(!it.counted&&Math.hypot(it.x-x,it.y-y)<it.r){
      it.counted=true;
    }
  });
});

function nextRound(){
  genItems(Math.floor(rand(1,9)));
}

document.getElementById('startBtn').onclick=async()=>{
  if(started)return;
  started=true;
  document.getElementById('startOverlay').style.display='none';
  await initAudio();
  resize();
  nextRound();
  draw();
};
</script>

</body>
</html>
