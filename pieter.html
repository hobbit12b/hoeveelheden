<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pak het juiste cijfer</title>

<style>
:root{
  --bg-left:#fdeeea;
  --brand:#e58c74;
  --text:#6f6b68;

  --scale:1;

  --fairy-left:33%;
  --fairy-size-base:439px;
  --fairy-no-x:8px;

  --digit-left:68.5%;
  --digit-top:58%;
  --digit-size-base:260px;

  --explosion-left:71%;
  --explosion-top:43%;
  --explosion-scale:1.5;

  --shadow:0 16px 40px rgba(0,0,0,0.08);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  height:100%;
  margin:0;
  font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:#fff;
  overflow:hidden;
  user-select:none;
}

body{
  display:grid;
  grid-template-columns:58fr 42fr;
}

.left{
  background:var(--bg-left);
  padding:26px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.scan-surface{
  background:#fff;
  position:relative;
  transition:background 160ms ease;
}

.scan-surface.flashWrong{
  background:#fde1e1;
}

.stage{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.stage video,
.stage img{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#fairyVid,
#fairyNoVid{
  left:var(--fairy-left);
  bottom:0;
  top:auto;
  width:clamp(240px, calc(var(--fairy-size-base)*var(--scale)), 620px);
  transform:translateX(-50%) translateY(6px);
  opacity:0;
  transition:opacity 90ms linear;
  will-change:opacity, transform;
}

#fairyNoVid{
  transform:
    translateX(-50%)
    translateY(6px)
    translateX(calc(var(--fairy-no-x)*var(--scale)));
}

#fairyVid{ opacity:1; }

#digitImg{
  left:var(--digit-left);
  top:var(--digit-top);
  width:clamp(160px, calc(var(--digit-size-base)*var(--scale)), 420px);
  opacity:0;
}

#explosionWrap{
  position:absolute;
  left:var(--explosion-left);
  top:var(--explosion-top);
  width:calc(260px*var(--explosion-scale));
  opacity:0;
}
</style>
</head>

<body>

<section class="left">
  <div style="flex:1; position:relative;">
    <div class="stage" id="stage">
      <video id="fairyVid" muted playsinline preload="auto"></video>
      <video id="fairyNoVid" muted playsinline preload="auto"></video>
      <div id="explosionWrap">
        <video id="explosionVid" muted playsinline preload="auto"></video>
      </div>
      <img id="digitImg">
    </div>
  </div>
</section>

<section class="scan-surface" id="scan-area"></section>

<script>
const FAIRY_SRC = 'toverfee.mp4';
const FAIRY_NO_SRC = 'toverfee_nee.mp4';

const fairyVid = document.getElementById('fairyVid');
const fairyNoVid = document.getElementById('fairyNoVid');
const scanArea = document.getElementById('scan-area');

const SAFE_END_OFFSET_NO = 0.12;

/* ---------- VIDEO WARM UP (ANTI HAPER) ---------- */
function warmUpVideo(video){
  return new Promise(resolve=>{
    if(!video) return resolve();

    const doWarm = async () => {
      try{
        const p = video.play();
        if(p && p.then) await p.catch(()=>{});
        setTimeout(()=>{
          try{ video.pause(); }catch(e){}
          try{ video.currentTime = 0.01; }catch(e){}
          setTimeout(()=>{
            try{ video.pause(); }catch(e){}
            try{ video.currentTime = 0; }catch(e){}
            resolve();
          },80);
        },120);
      }catch(e){ resolve(); }
    };

    if(video.readyState>=2) doWarm();
    else video.addEventListener('canplay', doWarm, {once:true});
  });
}

/* ---------- FAIRY SETUP ---------- */
function prepareFairies(){
  fairyVid.src = FAIRY_SRC;
  fairyNoVid.src = FAIRY_NO_SRC;

  fairyVid.muted = fairyNoVid.muted = true;
  fairyVid.playsInline = fairyNoVid.playsInline = true;

  fairyVid.load();
  fairyNoVid.load();

  warmUpVideo(fairyVid).then(()=>freezeFirstFrame(fairyVid));
  warmUpVideo(fairyNoVid).then(()=>freezeFirstFrame(fairyNoVid));
}

function freezeFirstFrame(video){
  try{
    video.pause();
    video.currentTime = 0;
  }catch(e){}
}

function showIdleFairy(){
  fairyVid.style.opacity = '1';
  fairyNoVid.style.opacity = '0';
}

function showNoFairy(){
  fairyVid.style.opacity = '0';
  fairyNoVid.style.opacity = '1';
}

/* ---------- PLAY FUNCTIONS ---------- */
function playFairy(video, stopBeforeEnd, onDone){
  try{
    video.pause();
    video.currentTime = 0.01;
  }catch(e){}

  const p = video.play();
  if(p && p.catch) p.catch(()=>{});

  if(stopBeforeEnd){
    const d = video.duration;
    if(d){
      setTimeout(()=>{
        try{
          video.currentTime = d - stopBeforeEnd;
          video.pause();
        }catch(e){}
        if(onDone) onDone();
      }, (d-stopBeforeEnd)*1000);
      return;
    }
  }

  video.onended = () => {
    video.onended = null;
    if(onDone) onDone();
  };
}

/* ---------- WRONG FLOW (ANTI HAPER) ---------- */
function playWrong(){
  scanArea.classList.add('flashWrong');
  setTimeout(()=>scanArea.classList.remove('flashWrong'),200);

  showNoFairy();

  requestAnimationFrame(()=>{
    playFairy(fairyNoVid, SAFE_END_OFFSET_NO, showIdleFairy);
  });
}

/* ---------- START ---------- */
window.addEventListener('load', ()=>{
  prepareFairies();
});

/* test: tik ergens voor fout animatie */
document.body.addEventListener('click', playWrong);
</script>

</body>
</html>
