<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Pak het juiste cijfer</title>

<style>
:root{
  --bg-left:#fdeeea;
  --brand:#e58c74;
  --text:#6f6b68;
  --scale:1;
  --fairy-left:33%;
  --fairy-size-base:439px;
  --fairy-size:clamp(180px, calc(var(--fairy-size-base)*var(--scale)), 460px);
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui, sans-serif;
}

body{
  display:grid;
  grid-template-columns:58fr 42fr;
}

.left{
  background:var(--bg-left);
  padding:24px;
}

.scan-surface{
  background:#fff;
  position:relative;
  transition:background 120ms ease;
}

.scan-surface.flashWrong{
  animation:flashWrong 260ms ease;
}

@keyframes flashWrong{
  0%{background:#fff;}
  40%{background:#fde1e1;}
  100%{background:#fff;}
}

.stage{
  position:relative;
  width:100%;
  height:100%;
}

.stage video,
.stage img{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#fairyVid,
#fairyNoVid{
  left:var(--fairy-left);
  bottom:0;
  width:var(--fairy-size);
  transform:translateX(-50%) translateY(6px);
  opacity:0;
  transition:opacity 90ms ease;
}

#fairyVid{opacity:1;}

#fairyNoVid{
  transform:translateX(-50%) translateY(6px) translateX(calc(8px * var(--scale)));
}

.startOverlay{
  position:fixed;
  inset:0;
  background:rgba(253,238,234,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
}

.startBtn{
  padding:16px 24px;
  border-radius:18px;
  border:none;
  background:var(--brand);
  color:#fff;
  font-size:18px;
}
</style>
</head>

<body>

<section class="left">
  <div class="stage">
    <video id="fairyVid" muted playsinline preload="auto"></video>
    <video id="fairyNoVid" muted playsinline preload="auto"></video>
  </div>
</section>

<section class="scan-surface" id="scanArea"></section>

<div class="startOverlay" id="startOverlay">
  <button class="startBtn" id="startBtn">Start</button>
</div>

<script>
const FAIRY_SRC = 'toverfee.mp4';
const FAIRY_NO_SRC = 'toverfee_nee.mp4';

const GOOD_SOUND = new Audio('goed.mp3');
const WRONG_SOUND = new Audio('fout.mp3');

const fairyVid = document.getElementById('fairyVid');
const fairyNoVid = document.getElementById('fairyNoVid');
const scanArea = document.getElementById('scanArea');
const startBtn = document.getElementById('startBtn');
const startOverlay = document.getElementById('startOverlay');

function prepVideo(video, src){
  video.src = src;
  video.muted = true;
  video.playsInline = true;
  video.loop = false;
  video.preload = 'auto';
  video.load();
}

function freezeFirstFrame(video){
  if(video.readyState >= 2){
    video.pause();
    video.currentTime = 0;
  } else {
    video.addEventListener('canplay', ()=>freezeFirstFrame(video), {once:true});
  }
}

function showIdleFairy(){
  fairyVid.style.opacity = '1';
  fairyNoVid.style.opacity = '0';
  freezeFirstFrame(fairyVid);
}

function playFairyOnce(video, onDone){
  const SAFE_END = 0.12;

  const stopEarly = () => {
    const d = video.duration;
    if(d && d > SAFE_END){
      video.currentTime = d - SAFE_END;
      video.pause();
    }
    if(onDone) onDone();
  };

  video.currentTime = 0;
  video.play();
  setTimeout(stopEarly, (video.duration - SAFE_END) * 1000);
}

function wrongFeedback(){
  scanArea.classList.remove('flashWrong');
  void scanArea.offsetHeight;
  scanArea.classList.add('flashWrong');
  WRONG_SOUND.currentTime = 0;
  WRONG_SOUND.play();
  fairyVid.style.opacity = '0';
  fairyNoVid.style.opacity = '1';
  playFairyOnce(fairyNoVid, showIdleFairy);
}

function goodFeedback(){
  GOOD_SOUND.currentTime = 0;
  GOOD_SOUND.play();
  showIdleFairy();
  playFairyOnce(fairyVid, showIdleFairy);
}

startBtn.onclick = () => {
  startOverlay.style.display = 'none';
  prepVideo(fairyVid, FAIRY_SRC);
  prepVideo(fairyNoVid, FAIRY_NO_SRC);
  freezeFirstFrame(fairyVid);
};

scanArea.onclick = () => {
  Math.random() > 0.5 ? goodFeedback() : wrongFeedback();
};
</script>

</body>
</html>
