<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rekenreis</title>

  <style>
    :root{
      --banner-scale: 1;
      --gap: clamp(10px, 2.0vmin, 18px);

      /* Desktop en algemene landscape */
      --banner-h: clamp(70px, 10vmin, 120px);
      --card-w: clamp(165px, 21vw, 245px);

      --after-banner: clamp(14px, 2.2vmin, 20px);
      --focus: rgba(255, 255, 255, 0.40);

      /* Banner afstand vanaf boven */
      --banner-top: calc(env(safe-area-inset-top, 0px) + 10px);
    }

    /* iPad landscape: banner groter */
    @media (orientation: landscape) and (pointer: coarse) and (max-width: 1100px){
      :root{
        --banner-h: clamp(110px, 14.0vmin, 170px);
        --after-banner: clamp(12px, 2.0vmin, 18px);
        --banner-scale: 1.4;

      }
    }

    /* Desktop landscape: knoppen iets groter, banner iets lager */
    @media (orientation: landscape) and (pointer: fine) and (min-width: 1101px){
      :root{
        --card-w: clamp(190px, 16vw, 300px);
        --banner-scale: 0.85;
        --banner-top: calc(env(safe-area-inset-top, 0px) + 56px);

      
      }
    }

    /* Portret: is klaar en goed, hier alleen zodat het exact blijft */
    @media (orientation: portrait){
      :root{
        --banner-h: clamp(132px, 15.5vmin, 210px);
        --card-w: clamp(285px, 44vw, 520px);
        --after-banner: clamp(34px, 4.6vmin, 56px);
        --banner-top: calc(env(safe-area-inset-top, 0px) + 10px);
      }
    }

    /* Extra lage schermen */
    @media (max-height: 520px){
      :root{
        --banner-h: clamp(56px, 8.5vmin, 92px);
        --card-w: clamp(150px, 20vw, 220px);
      }
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }

    body{
      margin: 0;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      background: #a8d8ff;
      color: #fff;
    }

    .bg{
      position: fixed;
      inset: 0;
      background-image: url("background_liggend.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translate3d(0,0,0) scale(1.03);
      will-change: transform;
      z-index: 0;
    }
    @media (orientation: portrait){
      .bg{ background-image: url("background_staand.png"); }
    }

    .vignette{
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 700px at 50% 45%, rgba(255,255,255,0.10), rgba(0,0,0,0.07) 60%, rgba(0,0,0,0.16) 100%);
      mix-blend-mode: multiply;
      z-index: 1;
    }

    /* Shell altijd bovenaan, banner boven knoppen */
    .shell{
      position: fixed;
      inset: 0;
      z-index: 2;

      padding:
        var(--banner-top)
        calc(env(safe-area-inset-right, 0px) + var(--gap))
        calc(env(safe-area-inset-bottom, 0px) + 12px)
        calc(env(safe-area-inset-left, 0px) + var(--gap));

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: var(--after-banner);
    }

    header{
      width: min(980px, 100%);
      height: var(--banner-h);
      display: grid;
      place-items: center;
      pointer-events: none;
      flex: 0 0 auto;
    }
    .banner{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 16px 16px rgba(0,0,0,0.18));
          transform: scale(var(--banner-scale));
      transform-origin: top center;
}

    /* Content neemt de rest van de hoogte in */
    .content{
      width: 100%;
      flex: 1 1 auto;
      display: grid;
      place-items: center;
      min-height: 0;
    }

    /* Landscape: knoppen vertikaal uitgelijnd, dus netjes gecentreerd in de overgebleven hoogte */
    @media (orientation: landscape){
      .content{ place-items: center; }
    }

    /* Portret: content start hoger, maar knoppen staan lager door je bestaande afstanden */
    @media (orientation: portrait){
      .content{ place-items: start center; }
    }

    .grid{
      display: grid;
      gap: var(--gap);
      justify-items: center;
      align-items: center;
    }

    @media (orientation: landscape){
      .grid{
        grid-template-columns: repeat(4, var(--card-w));
        grid-template-rows: auto;
        justify-content: center;
        width: fit-content;
        max-width: 100%;
      }
    }

    @media (orientation: portrait){
      .grid{
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        row-gap: clamp(10px, 2.0vmin, 16px);
        column-gap: var(--gap);
        width: min(1320px, 100%);
        align-content: start;
        margin-top: clamp(18px, 3.8vmin, 44px);
      }
    }

    .card{
      width: var(--card-w);
      max-width: 100%;
      aspect-ratio: 1.14 / 1;

      display: block;
      text-decoration: none;
      outline: none;

      transform: translateZ(0);
      transition: transform 140ms ease, filter 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;

      filter: drop-shadow(0 22px 26px rgba(0,0,0,0.22));
      transform: translateZ(0);
      transition: transform 140ms ease, filter 140ms ease;
    }

    @media (hover: hover){
      .card:hover img{
        transform: translateY(-6px) scale(1.02);
        filter: drop-shadow(0 30px 34px rgba(0,0,0,0.24)) brightness(1.02) saturate(1.03);
      }
    }

    .card:active img{
      transform: translateY(2px) scale(0.99);
      filter: drop-shadow(0 18px 22px rgba(0,0,0,0.20)) brightness(0.99);
    }

    .card:focus-visible img{
      filter: drop-shadow(0 22px 26px rgba(0,0,0,0.22));
      outline: 8px solid var(--focus);
      outline-offset: 10px;
      border-radius: 26px;
    }

    .float-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }
    .float{
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(255,255,255,0.3) 55%, rgba(255,255,255,0) 75%);
      opacity: 0.0;
      animation: drift var(--dur) linear infinite;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.12));
    }
    @keyframes drift{
      0%   { transform: translate3d(var(--x), calc(100vh + 40px), 0) scale(var(--s)); opacity: 0.0; }
      10%  { opacity: 0.85; }
      85%  { opacity: 0.75; }
      100% { transform: translate3d(calc(var(--x) + var(--dx)), -60px, 0) scale(calc(var(--s) * 1.2)); opacity: 0.0; }
    }

    .fx-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .sparkle{
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(255,255,255,0.25) 55%, rgba(255,255,255,0) 75%);
      transform: translate(-50%, -50%);
      animation: pop 520ms ease-out forwards;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.14));
    }
    .sparkle::after{
      content:"";
      position: absolute;
      inset: -3px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      opacity: 0.85;
    }
    @keyframes pop{
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
      18%  { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s)); }
    }
    .ring{
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.55);
      transform: translate(-50%, -50%);
      opacity: 0.85;
      animation: ring 520ms ease-out forwards;
    }
    @keyframes ring{
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      20%  { opacity: 0.9; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(5.3); }
    }

    @media (prefers-reduced-motion: reduce){
      .float, .sparkle, .ring{ animation: none; display: none; }
      .bg{ transform: none; }
      .card, .card img{ transition: none; }
    }
  </style>
</head>

<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="shell">
    <header aria-hidden="true">
      <img class="banner" src="rekenreis.png" alt="" />
    </header>

    <div class="content">
      <section class="grid" aria-label="Kies een spel">
        <a class="card" href="tg07.html" aria-label="Tovergetallen">
          <img src="tovergetallen.png" alt="Tovergetallen" />
        </a>

        <a class="card" href="tg08.html" aria-label="Bellenblazen">
          <img src="bellenblazen.png" alt="Bellenblazen" />
        </a>

        <a class="card" href="tg05.html" aria-label="Cijferreeksen">
          <img src="cijferreeksen.png" alt="Cijferreeksen" />
        </a>

        <a class="card" href="tg04.html" aria-label="Slim tellen">
          <img src="slim%20tellen.png" alt="Slim tellen" />
        </a>
      </section>
    </div>
  </div>

  <div class="float-layer" id="float" aria-hidden="true"></div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <script>
    const bg = document.getElementById("bg");
    const floatLayer = document.getElementById("float");
    const fx = document.getElementById("fx");

    let px = 0, py = 0;
    window.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const nx = (e.clientX / window.innerWidth)  - 0.5;
      const ny = (e.clientY / window.innerHeight) - 0.5;
      px = nx; py = ny;
    }, { passive: true });

    function animateBg(){
      if (bg){
        const tx = (px * 9).toFixed(2);
        const ty = (py * 9).toFixed(2);
        bg.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(1.03)`;
      }
      requestAnimationFrame(animateBg);
    }
    animateBg();

    function spawnFloat(){
      if (!floatLayer) return;
      const el = document.createElement("div");
      el.className = "float";
      const x = Math.random() * window.innerWidth;
      const dx = (Math.random() - 0.5) * 140;
      const s  = 0.7 + Math.random() * 1.1;
      const dur = 7 + Math.random() * 7;

      el.style.setProperty("--x", x.toFixed(1) + "px");
      el.style.setProperty("--dx", dx.toFixed(1) + "px");
      el.style.setProperty("--s", s.toFixed(2));
      el.style.setProperty("--dur", dur.toFixed(2) + "s");

      floatLayer.appendChild(el);
      setTimeout(() => el.remove(), (dur * 1000) + 200);
    }
    for (let i = 0; i < 10; i++) spawnFloat();
    setInterval(spawnFloat, 980);

    function sparkleAt(x, y){
      if (!fx) return;

      const ring = document.createElement("div");
      ring.className = "ring";
      ring.style.left = x + "px";
      ring.style.top  = y + "px";
      fx.appendChild(ring);
      setTimeout(() => ring.remove(), 560);

      const count = 12;
      for (let i = 0; i < count; i++){
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = x + "px";
        s.style.top  = y + "px";

        const angle = (Math.PI * 2) * (i / count) + (Math.random() * 0.35);
        const dist  = 24 + Math.random() * 34;

        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        s.style.setProperty("--dx", dx.toFixed(1) + "px");
        s.style.setProperty("--dy", dy.toFixed(1) + "px");
        s.style.setProperty("--s", (0.7 + Math.random() * 0.7).toFixed(2));

        fx.appendChild(s);
        setTimeout(() => s.remove(), 560);
      }
    }

    let audioReady = false;
    let ctx;
    function chime(){
      try{
        if (!audioReady){
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          audioReady = true;
        }
        const now = ctx.currentTime;

        const o1 = ctx.createOscillator();
        const o2 = ctx.createOscillator();
        const g  = ctx.createGain();

        o1.type = "sine";
        o2.type = "triangle";

        o1.frequency.setValueAtTime(880, now);
        o2.frequency.setValueAtTime(1320, now);

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

        o1.connect(g);
        o2.connect(g);
        g.connect(ctx.destination);

        o1.start(now);
        o2.start(now);
        o1.stop(now + 0.24);
        o2.stop(now + 0.24);
      }catch(err){}
    }

    document.querySelectorAll(".card").forEach((a) => {
      a.addEventListener("pointerenter", (e) => {
        if (e.pointerType !== "mouse") return;
        const r = a.getBoundingClientRect();
        sparkleAt(r.left + r.width * 0.18, r.top + r.height * 0.25);
      });

      a.addEventListener("click", (e) => {
        e.preventDefault();
        const r = a.getBoundingClientRect();
        sparkleAt(r.left + r.width / 2, r.top + r.height / 2);
        chime();
        const href = a.getAttribute("href");
        setTimeout(() => { window.location.href = href; }, 160);
      });
    });

    let lastFx = 0;
    window.addEventListener("pointerdown", (e) => {
      const now = Date.now();
      if (now - lastFx < 190) return;
      lastFx = now;
      sparkleAt(e.clientX, e.clientY);
    }, { passive: true });
  </script>
</body>
</html>
