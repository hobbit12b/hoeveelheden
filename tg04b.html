<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slim kijken</title>

  <style>
    :root{
      --bg-left:#fdeeea;
      --brand:#e58c74;
      --text:#6f6b68;
      --midLine: rgba(245,180,152,0.85);
      --card-radius:28px;
      --shadow: 0 16px 40px rgba(0,0,0,0.08);
      --pressDown: 2px;
      --wrongFill: rgba(248, 197, 197, 0.85);
      --wrongBorder: rgba(229, 140, 116, 0.45);
      --correctFill: rgba(210, 244, 214, 0.92);
      --correctBorder: rgba(144, 204, 152, 0.70);
      --activeFill: rgba(229, 140, 116, 0.18);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#ffffff;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overflow:hidden;
    }

    body{
      display:grid;
      grid-template-columns: 58fr 42fr;
      height: 100%;
    }
    @media (orientation: portrait){
      body{
        grid-template-columns: 1fr;
        grid-template-rows: 54fr 46fr;
      }
    }

    .left{
      background: var(--bg-left);
      padding: 28px 26px 22px 26px;
      display:flex;
      flex-direction:column;
      gap: 22px;
      position: relative;
      overflow:hidden;
      min-height: 0;
    }

    .scan-surface{
      background:#ffffff;
      position: relative;
      overflow:hidden;
      min-height: 0;
      transition: background 140ms ease;
    }

    @media (orientation: landscape){
      .scan-surface{ border-left: 6px dashed var(--midLine); }
    }
    @media (orientation: portrait){
      .scan-surface{ border-top: 6px dashed var(--midLine); }
      .left{ padding: 22px; gap: 16px; }
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .homeBtn,
    .tuneBtn{
      width:72px;
      height:72px;
      border-radius:18px;
      background: #f8c3b0;
      border: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding: 0;
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      transition: transform 140ms cubic-bezier(.22,.61,.35,1);
    }

    .titlePill{
      padding: 18px 44px;
      border-radius: 22px;
      background: var(--brand);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(22px, 2.1vw, 34px);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 64px;
      width: min(660px, 100%);
      text-transform: lowercase;
    }

    .content{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      min-height: 0;
    }

    .gameCard{
      width: min(980px, 100%);
      height: min(520px, 58vh);
      background: #ffffff;
      border: 6px solid rgba(245,180,152,0.85);
      border-radius: var(--card-radius);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      position:relative;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }

    .flashBoard{
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background:#ffffff;
      border: 2px solid rgba(245,180,152,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
      aspect-ratio: 520 / 380;
    }

    .flashSvg{
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .scanStage{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 10;
    }

    .answersWrap{
      width: min(560px, 92%);
      max-width: 560px;
    }

    .answers{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      justify-items:center;
      align-items:center;
    }

    @media (orientation: portrait){
      .answers{
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .answersWrap{ width: min(640px, 92%); }
    }

    /* --- NIEUWE 3D KAART STYLING --- */
    .ansBtn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      aspect-ratio: 1 / 1;
      width: 100%;
      position: relative;
      perspective: 1000px; /* Nodig voor 3D diepte */
      transition: transform 180ms cubic-bezier(.22,.61,.35,1);
    }

    @media (orientation: landscape){
      .answersWrap{ width: min(360px, 92%); }
      .ansBtn{ width: clamp(86px, 10.5vw, 120px); }
    }

    .cardWrap {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.35, 1);
      transform-style: preserve-3d; /* Houdt kinderen in 3D ruimte */
    }

    /* De omdraai-actie */
    .ansBtn.cardOpen .cardWrap {
      transform: rotateY(180deg);
    }

    .cardBack, .cardFront {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; /* Verbergt de achterkant tijdens het draaien */
      -webkit-backface-visibility: hidden;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 3px solid rgba(245,180,152,0.85);
      box-shadow: 0 12px 24px rgba(0,0,0,0.10);
    }

    /* Achterkant: Het vogeltje */
    .cardBack {
      background: #f8c3b0;
      background-image: url("vogeltje_achterkantkaart.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 2;
      transform: rotateY(0deg);
    }

    /* Voorkant: De stippen */
    .cardFront {
      background: #ffffff;
      transform: rotateY(180deg); /* Staat standaard al 'omgedraaid' */
      z-index: 1;
      padding: 10px;
    }

    /* Feedback kleuren op de voorkant (stippenkant) */
    .ansBtn.wrongHold .cardFront {
      background: var(--wrongFill);
      border-color: var(--wrongBorder);
    }

    .ansBtn.correctHold .cardFront {
      background: var(--correctFill);
      border-color: var(--correctBorder);
    }

    .ansBtn.pressBounce{ animation: pressBounce 280ms cubic-bezier(.22,.61,.35,1) 1; }
    @keyframes pressBounce{
      0%{ transform: scale(1); }
      42%{ transform: scale(0.96); }
      100%{ transform: scale(1); }
    }

    .answersHidden{ opacity:0; pointer-events:none; }

    /* UI onderdelen */
    .startOverlay{ position:fixed; inset:0; background: rgba(253,238,234,0.55); backdrop-filter: blur(2px); display:flex; align-items:center; justify-content:center; z-index: 999; padding: 24px; }
    .startCard{ width: min(740px, 92vw); background: #ffffff; border-radius: 24px; box-shadow: var(--shadow); padding: 22px 20px; text-align:center; }
    .startBtn{ appearance:none; border:none; background: var(--brand); color:#fff; font-weight: 900; padding: 14px 18px; border-radius: 18px; font-size: 18px; cursor:pointer; box-shadow: 0 14px 26px rgba(0,0,0,0.12); }
    .tunePanel{ position: fixed; right: 18px; bottom: 18px; width: min(620px, calc(100vw - 36px)); background: rgba(255,255,255,0.98); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.16); border: 2px solid rgba(245,180,152,0.75); padding: 14px; z-index: 1200; color: #4d4a48; }
    .tunePanel.hidden{ display:none; }
    .tuneHeader{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
    .tuneClose{ appearance:none; border:none; background:#f8c3b0; border-radius: 12px; padding: 10px 12px; font-weight: 900; cursor:pointer; }
    .tuneRow{ display:grid; grid-template-columns: 170px 1fr 84px; gap: 10px; align-items:center; margin: 10px 0; }
    .tuneBtnSmall{ appearance:none; border:none; background: var(--brand); color:#fff; font-weight: 900; padding: 10px 12px; border-radius: 14px; cursor:pointer; }
  </style>
</head>

<body>
  <section class="left">
    <div class="topbar">
      <button class="homeBtn" id="homeBtn">
        <svg viewBox="0 0 64 64"><path d="M10 28L32 10l22 18v26a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V28z" fill="rgba(255,255,255,.55)"/><path d="M16 26.5L32 13.7l16 12.8v27.2H16V26.5z" fill="rgba(0,0,0,.10)"/><path d="M26 54V38h12v16" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 30l20-16 20 16" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tuneBtn" id="tuneBtn">⚙️</button>
      <div class="titlePill" id="titlePill">slim kijken</div>
    </div>
    <div class="content">
      <div class="gameCard"><div class="flashBoard"><div class="flashSvg" id="flashSvg"></div></div></div>
    </div>
  </section>

  <section class="scan-surface" id="scanArea">
    <div class="scanStage"><div class="answersWrap"><div class="answers answersHidden" id="answers"></div></div></div>
  </section>

  <div class="startOverlay" id="startOverlay">
    <div class="startCard">
      <h1>tik om te starten</h1>
      <p>Level 1 is open. Vanaf level 2 draaien de kaarten om!</p>
      <button class="startBtn" id="startBtn">Start</button>
    </div>
  </div>

  <div class="tunePanel hidden" id="tunePanel">
    <div class="tuneHeader"><div class="tuneTitle">instellingen</div><button class="tuneClose" id="tuneClose">Sluit</button></div>
    <div class="tuneSection"><div>huidig level: <span id="tuneLevelValue">1</span></div></div>
    <div class="tuneSection">
      <div class="tuneRow"><div class="tuneLabel">flitstijd</div><input type="range" id="flashMsRange" min="300" max="2400" step="50" value="300" /><div class="tuneValue" id="flashMsValue">300</div></div>
    </div>
    <div class="tuneButtons"><button class="tuneBtnSmall secondary" id="newRoundBtn">Nieuwe ronde</button></div>
  </div>

  <script>
    (() => {
      "use strict";

      const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
      const randInt = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      const raf = () => new Promise(r => requestAnimationFrame(() => r()));

      // --- LOGICA VARIATIES ---
      const P = { tl:[0.25,0.25], tc:[0.50,0.25], tr:[0.75,0.25], ml:[0.25,0.50], mc:[0.50,0.50], mr:[0.75,0.50], bl:[0.25,0.75], bc:[0.50,0.75], br:[0.75,0.75] };
      const diceFaces = { 1:[P.mc], 2:[P.tl, P.br], 3:[P.tl, P.mc, P.br], 4:[P.tl, P.tr, P.bl, P.br], 5:[P.tl, P.tr, P.mc, P.bl, P.br], 6:[P.tl, P.ml, P.bl, P.tr, P.mr, P.br] };
      const L = { a:[0.30,0.35], b:[0.50,0.35], c:[0.70,0.35], d:[0.30,0.65], e:[0.50,0.65], f:[0.70,0.65], m:[0.50,0.50], r:[0.86,0.50], l:[0.14,0.50] };
      const VARS_1TO4 = { 1:[[L.m],[L.b],[L.e]], 2:[[L.a,L.c],[L.b,L.e],[L.a,L.f]], 3:[[L.a,L.b,L.c],[L.a,L.m,L.f],[L.a,L.d,L.f]], 4:[[L.a,L.c,L.d,L.f],[L.a,L.b,L.c,L.m],[L.a,L.d,L.f,L.b]] };
      const VARS_5 = [[L.a,L.b,L.c,L.d,L.e],[L.a,L.c,L.d,L.f,L.m],[L.a,L.c,L.d,L.f,L.b]];
      const VARS_6 = [[L.a,L.b,L.c,L.d,L.e,L.f],[[0.38,0.28],[0.38,0.50],[0.38,0.72],[0.62,0.28],[0.62,0.50],[0.62,0.72]],[L.a,L.c,L.m,L.d,L.f,L.r]];

      let LEVEL = 1, flashMs = 300, streakGood = 0, streakBad = 0, started = false, locked = false, correct = 1, previewToken = 0;

      function usesAnswerCards() { return LEVEL >= 2; }
      function maxForLevel() { return (LEVEL <= 3) ? 4 : 6; }

      function svgForDots(dots, opts = {}) {
        const { dotRadius = 14 } = opts;
        const circles = dots.map(([x,y]) => `<circle cx="${(0.12+x*0.76)*520}" cy="${(0.12+y*0.76)*380}" r="${dotRadius}" fill="rgba(25,25,25,.92)" />`).join("");
        return `<svg viewBox="0 0 520 380" width="100%" height="100%">${circles}</svg>`;
      }

      function getPattern(n, isQuestion) {
        if (!isQuestion || LEVEL <= 2) return diceFaces[n];
        if (n <= 4) return pick(VARS_1TO4[n]);
        if (n === 5) return pick(VARS_5);
        return pick(VARS_6);
      }

      const flashSvg = document.getElementById("flashSvg"), answersEl = document.getElementById("answers");

      function renderAnswers(correctVal, onPick) {
        const cap = maxForLevel();
        const options = new Set([correctVal]);
        while(options.size < 3) options.add(clamp(correctVal + pick([-2,-1,1,2]), 1, cap));
        const arr = [...options].sort(() => Math.random() - 0.5);

        answersEl.innerHTML = "";
        arr.forEach(v => {
          const btn = document.createElement("button");
          btn.className = "ansBtn";
          const dotsSvg = svgForDots(getPattern(v, false), {dotRadius: 12});
          
          btn.innerHTML = `
            <div class="cardWrap">
              <div class="cardBack"></div>
              <div class="cardFront">${dotsSvg}</div>
            </div>
          `;

          // Level 1: Altijd open (geen flip effect)
          if (!usesAnswerCards()) {
            btn.classList.add("cardOpen");
            btn.querySelector(".cardWrap").style.transition = "none";
          }

          btn.addEventListener("click", () => onPick(btn, v));
          answersEl.appendChild(btn);
        });
      }

      async function previewCardsNonBlocking() {
        if (!usesAnswerCards()) return;
        const myToken = ++previewToken;
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        await wait(200);
        for(let b of btns) { if(previewToken !== myToken) return; b.classList.add("cardOpen"); await wait(100); }
        await wait(1700);
        if(previewToken !== myToken) return;
        btns.forEach(b => b.classList.remove("cardOpen"));
      }

      async function animateInButtons() {
        const btns = [...answersEl.querySelectorAll(".ansBtn")];
        answersEl.classList.remove("answersHidden");
        btns.forEach((btn, i) => {
          btn.style.opacity = "0";
          btn.animate([{opacity:0, transform:"translateY(20px)"},{opacity:1, transform:"translateY(0)"}], {duration:500, fill:"forwards", delay:i*100});
        });
        await wait(500 + btns.length*100);
      }

      async function nextRound() {
        locked = true; previewToken++;
        answersEl.classList.add("answersHidden");
        flashSvg.innerHTML = "";
        await wait(400);

        correct = pick([1,2,3,4,5,6].filter(n => n <= maxForLevel()));
        flashSvg.innerHTML = svgForDots(getPattern(correct, true), {dotRadius: 16});
        
        await wait(flashMs);
        flashSvg.innerHTML = "";
        await wait(300);

        renderAnswers(correct, onPick);
        await animateInButtons();
        locked = false;
        previewCardsNonBlocking();
      }

      async function onPick(btn, value) {
        if (locked) return;
        locked = true; previewToken++;
        
        btn.classList.add("cardOpen"); // Zorg dat kaart omdraait bij klik
        const isCorrect = (value === correct);
        btn.classList.add(isCorrect ? "correctHold" : "wrongHold");

        if (isCorrect) {
          streakGood++; streakBad = 0;
          if (streakGood >= 5) { LEVEL = clamp(LEVEL + 1, 1, 5); streakGood = 0; }
        } else {
          streakBad++; streakGood = 0;
          if (streakBad >= 2) { LEVEL = clamp(LEVEL - 1, 1, 5); streakBad = 0; }
        }

        document.getElementById("titlePill").textContent = `slim kijken, level ${LEVEL}`;
        document.getElementById("tuneLevelValue").textContent = LEVEL;

        await wait(1500);
        nextRound();
      }

      // --- UI EVENTS ---
      document.getElementById("startBtn").onclick = () => { document.getElementById("startOverlay").style.display="none"; started=true; nextRound(); };
      document.getElementById("tuneBtn").onclick = () => document.getElementById("tunePanel").classList.toggle("hidden");
      document.getElementById("tuneClose").onclick = () => document.getElementById("tunePanel").classList.add("hidden");
      document.getElementById("flashMsRange").oninput = (e) => { flashMs = Number(e.target.value); document.getElementById("flashMsValue").textContent = flashMs; };
      document.getElementById("newRoundBtn").onclick = () => { if(started) nextRound(); };

    })();
  </script>
</body>
</html>
