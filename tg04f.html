<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Slim kijken</title>
<style>
/* ... STYLES ONGEWIJZIGD ... */
</style>
</head>
<body>
<!-- ... HTML ONGEWIJZIGD ... -->

<script>
(() => {
"use strict";

/* ... CODE ONGEWIJZIGD TOT renderAnswers ... */

function renderAnswers(correct, onPick){
const arr = buildOptions(correct);
answersEl.innerHTML = "";

arr.forEach(v => {
const btn = document.createElement("button");
btn.className = "ansBtn";
btn.type = "button";

btn.addEventListener("pointerdown", () => {
btn.classList.remove("pressBounce");
void btn.offsetWidth;
btn.classList.add("pressBounce");
}, {passive:true});

btn.addEventListener("click", () => onPick(btn, v));

/* FIX: level 6 en hoger, marbotic png in kaart voorkant */
if(LEVEL >= 6){
const face = `<div class="marboticFace"><img class="marboticImg" src="${marboticSrc(v)}" alt="" draggable="false"></div>`;
btn.innerHTML = `
<div class="cardWrap">
<div class="cardInner">
<div class="cardBack" aria-hidden="true"></div>
<div class="cardFront">${face}</div>
</div>
</div>
`;
answersEl.appendChild(btn);
return;
}

/* level 1 tot en met 5, dobbelsteen svg als antwoord */
const layoutId = standardLayoutId(v);
const face = `<div class="qWrap"><img class="layoutImg" src="${diceSrc(layoutId)}" alt="" draggable="false"></div>`;

if(usesAnswerCards()){
btn.innerHTML = `
<div class="cardWrap">
<div class="cardInner">
<div class="cardBack" aria-hidden="true"></div>
<div class="cardFront">${face}</div>
</div>
</div>
`;
}else{
btn.innerHTML = face;
}
answersEl.appendChild(btn);
});
}

/* ... REST VAN DE CODE ONGEWIJZIGD ... */

})();
</script>
</body>
</html>
